    evidence: "2026-08-31 Kiki 실행 완료. ① 스키마 정렬: stamp --purge a9b8c7d6e5f4 → upgrade head 22건 → head d4a71c0f9b32 도달, 프로브 재실행 pending_count 0 · present_after_gap 0(백업 whymath_20260831_141321.dump 선행). ② 계정 부트스트랩(ADMIN-11): account_bootstrap_cli create → {\"user_id\": \"5612757b-93c2-4d60-8318-3c85d3d6ff2c\", \"created\": true, \"role\": \"student\"}. ③ 좌석 부여: role_grant_cli grant 5612757b-93c2-4d60-8318-3c85d3d6ff2c content_admin → GRANT_EXIT=0, {\"old_role\": \"student\", \"new_role\": \"content_admin\"}. ④ list → {\"users\": [{\"user_id\": \"5612757b-93c2-4d60-8318-3c85d3d6ff2c\", \"role\": \"content_admin\"}], \"total\": 1}. 좌석 0건 상태 해소 — \"봉인 정상\"과 \"아무도 못 씀\"이 이제 다른 값이다."
    notes: "[목적] 콘텐츠 CUD 6라우터(/v1/concepts·/v1/problems의 POST/PATCH/DELETE)가 전건 403이다.\n  봉인(SEC-07)은 정상 작동 중이지만 좌석이 0건이라 아무도 통과 못 한다.\n\n[1·2단계 — 2026-08-11 Kiki 실측, 완료]\n  alembic_version = d6e7f8a9b0c1(코드 체인에 없는 값) · user_profile에 role 없음 ·\n  alembic 전 명령 exit 255(Can't locate revision).\n\n[3단계 — 2026-08-31 Kiki 실측, 완료. scripts/ops/probe_prod_schema_revision.sql]\n  EXIT=0 · stamp_target a9b8c7d6e5f4 / pending 22 / present_after_gap 0(혼입 없음).\n\n[4단계 A~D — 2026-08-31 Kiki 실행, 완료]\n  A 백업 = whymath_20260831_141321.dump(524,832 bytes) · BACKUP_EXIT=0\n  B stamp --purge a9b8c7d6e5f4 → STAMP_EXIT=0 · current = a9b8c7d6e5f4\n    (`stamp`는 --purge 없이는 exit 255다 — 예행연습에서 잡은 설계 정정)\n  C upgrade head → UPGRADE_EXIT=0 · 22건 전부 적용 · current = d4a71c0f9b32 (head)\n  D 프로브 재실행 → 26행 전부 present · pending_count 0 · after_gap 0\n  ⇒ 20일 묵은 스키마 드리프트 해소. OPS-39가 관측하려던 그 드리프트가 실제로 닫혔다.\n\n[★ 4단계 E 차단 — 2026-08-31 발견. 미확인 전제가 틀렸다]\n  좌석을 줄 대상이 없다: **user_profile 0행**. 이 노트의 이전 판이 `user_profile 조회로\n  user_id를 고른다`고 적은 것은 계정이 존재한다는 미확인 전제였고 그것이 틀렸다.\n  role_grant_cli는 정상이다 — list가 exit 0에 {\"users\": [], \"total\": 0}을 냈다\n  (프리플라이트 통과 = 스키마도 정상. CLI가 아니라 대상이 부재).\n  원인: 저장소에서 UserProfile을 만드는 경로는 api/auth.py의 resolve_user 하나뿐이고\n  그것은 OAuth 콜백에서만 불린다. provider를 붙이기 전에는 계정이 존재할 수 없다.\n\n[Kiki 결정 — 2026-08-31]\n  ① 좌석은 **Kiki 실계정 이메일**에 붙인다. email_hash가 비밀값 없는 순수 sha256이라\n     나중에 같은 이메일로 실제 로그인하면 resolve_user가 같은 행을 찾아 좌석이 유지된다.\n  ② 계정 생성은 원시 SQL이 아니라 **전용 ops CLI**로 한다(ADMIN-11).\n  데모 인증 경로(고정 신원 demo-student@whymath.example)는 배제 — 그 좌석은 `데모 인증이\n  켜진 서버에 닿는 누구나`의 것이 되기 때문이다.\n\n[5단계 — 좌석 발급. ADMIN-11 착지 후 실행. 실행 블록은 세션 응답 참조]\n  E-1) account_bootstrap_cli create (Kiki 이메일) → user_id JSON (멱등·재실행 안전)\n  E-2) role_grant_cli grant (그 user_id) content_admin → GRANT_EXIT=0\n  E-3) role_grant_cli list → 좌석 1건 JSON\n  주의: WHYMATH_DATABASE_URL을 그 창에 설정하고 끝나면 정리한다.\n\n[clear 증적] E-3의 list 출력(user_id 포함 JSON) + GRANT_EXIT=0."
