    notes: "[목적] 콘텐츠 CUD 6라우터(/v1/concepts·/v1/problems의 POST/PATCH/DELETE)가 전건 403이다.\n  봉인(SEC-07)은 정상 작동 중이지만 좌석이 0건이라 아무도 통과 못 한다. 이 게이트를 통과해야\n  `봉인 정상`과 `아무도 못 씀`이 비로소 다른 값이 된다.\n\n[1·2단계 — 2026-08-11 Kiki 실측, 완료]\n  · alembic_version = d6e7f8a9b0c1(코드 체인에 없는 값) · user_profile에 role 없음\n  · `alembic current`·`alembic upgrade head` 둘 다 exit 255(Can't locate revision)\n\n[3단계 — 2026-08-31 Kiki 실측, 완료. 프로브 = scripts/ops/probe_prod_schema_revision.sql]\n  EXIT=0 · verdict = stamp_target `a9b8c7d6e5f4` / pending_count 22 / present_after_gap 0\n  · seq 67(concept_visual_style)까지 적용, seq 68(formula_node.constraints)부터 미적용\n  · present_after_gap 0 = 뒤섞임 없음 → stamp 안전\n  · 같은 상태를 로컬 PostgreSQL 16에 `upgrade a9b8c7d6e5f4`로 재현해 프로브 26행이\n    Kiki 출력과 완전히 일치함을 확인(측정의 교차검증)\n\n[★ 4단계 설계 정정 — 2026-08-31 예행연습에서 발견]\n  기존 4단계 예고는 `alembic stamp <rev>`였는데 **그 명령은 이 DB에서 반드시 실패한다.**\n  로컬에 whymath-pg와 같은 상태(alembic_version = d6e7f8a9b0c1)를 만들어 실측한 결과:\n    · `alembic stamp a9b8c7d6e5f4`  → exit 255 (Can't locate revision 'd6e7f8a9b0c1')\n    · `alembic stamp --purge a9b8c7d6e5f4` → exit 0, 버전 테이블 = a9b8c7d6e5f4\n  stamp도 `current`와 같은 이유로 현재값을 먼저 해석하려 든다. `--purge`가 버전 테이블을\n  비우고 찍으므로 그 해석 자체를 건너뛴다. **반드시 --purge를 쓸 것.**\n\n[예행연습 결과 — 로컬 PostgreSQL 16, 2026-08-31]\n  베이스(a9b8c7d6e5f4)에서 `upgrade head` = 22건 전부 적용, exit 0, current = d4a71c0f9b32.\n  적용 후 프로브 = stamp_target d4a71c0f9b32 / pending 0 / after_gap 0.\n  user_profile.role 실재 확인(role_enum = student, content_admin).\n  미적용 22건에 op.drop_column·op.drop_table 0건 — 전부 additive(신규 테이블·nullable\n  컬럼·기존 컬럼 백필). 확장 의존(pgvector·timescaledb) 신규 발생 없음.\n\n[4단계 — 실행 블록은 세션 응답에 값이 채워진 형태로 제공됨. 순서 요약]\n  A) 백업: scripts\\backup\\backup_whymath_pg.ps1 → BACKUP_EXIT=0 + 새 .dump 실재 확인\n  B) stamp --purge a9b8c7d6e5f4 → current가 a9b8c7d6e5f4\n  C) upgrade head → current가 d4a71c0f9b32\n  D) 프로브 재실행 자가검증 → pending_count 0 (B·C가 실제로 먹혔는지 가르는 변별력 스텝)\n  E) 좌석 부여: role_grant_cli grant (user_id) content_admin → list\n  주의: B~E는 같은 창에서(WHYMATH_DATABASE_URL이 그 창 한정). 끝나면 env 정리.\n  #800 잔여 결함 2건은 승계 시 정정됨 — git pull → fetch+checkout -B, 꺾쇠 자리표시자 제거.\n\n[clear 증적] 좌석 부여 후 role_grant_cli list 출력(user_id 포함 JSON) + GRANT_EXIT=0."
