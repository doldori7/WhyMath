  - id: G-operator-seat-first-grant
    title: "운영자 좌석 1호 발급 (whymath-pg) — 1단계 측정 완료(2026-08-11). 기록 head가 코드 체인에 없는 d6e7f8a9b0c1이라 alembic이 거부되는 상태 — 2단계는 스키마 실태 조사"
    kind: human
    assignee: kiki
    status: pending
    requested: 2026-08-11
    remind_after_days: 7
    evidence: null
    notes: |
      [1단계 결과 — 2026-08-11 Kiki 실측, 완료]
        · 컨테이너 생존 = true
        · alembic_version = d6e7f8a9b0c1
        · misconception_catalog에서 length(mis_id) > 16 인 행 = 0건
      [측정이 뒤집은 것] 사전 예상은 "f3a4b5c6d7e8(29개 밀림·파괴적 6건)"이었으나 실제 값은
        d6e7f8a9b0c1이고, 이 값은 **현재 코드의 마이그레이션 체인에 존재하지 않는다**
        (versions/ 전수 grep 0건). 따라서 상황은 단순 '뒤처짐'이 아니다.
      [실측된 결과] 이 상태에서는 alembic이 아예 동작하지 않는다 — 컨테이너에서 동일 상태를
        재현해 확인: `alembic current`·`alembic upgrade head` 둘 다 exit 255,
        "Can't locate revision identified by 'd6e7f8a9b0c1'". 즉 upgrade로는 진행 불가.
      [하지 말 것] `alembic stamp`로 임의의 리비전을 찍지 말 것. 스키마 실태와 다른 값을
        찍으면 이후 마이그레이션이 이미 있는 객체를 만들려다 깨지거나, 없는 객체를 있다고
        믿고 건너뛴다. stamp는 실태 조사 뒤 마지막에 하는 조치다.
      [3)의 의미] 0건이므로, 장차 a5b6c7d8e9f0(mis_id 길이 확대)을 적용할 때 요구되는
        DELETE 선행은 불필요하다 — 그 전제는 이미 충족돼 있다.

      [2단계 — 스키마 실태 조사. 읽기 전용, 데이터 변경 0]
      # [실행 시스템] Windows PowerShell (= Phaiakes9 이 PC)
      cd C:\Users\kiki\Desktop\__AI\WhyMath

      # 어떤 테이블이 실재하는지 (개수와 목록)
      docker exec whymath-pg psql -U whymath -d whymath -c "SELECT count(*) AS tables FROM information_schema.tables WHERE table_schema='public';"
      docker exec whymath-pg psql -U whymath -d whymath -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name;"

      # 리비전 판별에 결정적인 컬럼·테이블 존재 여부 (있으면 t, 없으면 f)
      docker exec whymath-pg psql -U whymath -d whymath -c "SELECT to_regclass('public.privacy_audit') IS NOT NULL AS privacy_audit, to_regclass('public.defect_report') IS NOT NULL AS defect_report, to_regclass('public.concept_visual_style') IS NOT NULL AS concept_visual_style;"
      docker exec whymath-pg psql -U whymath -d whymath -c "SELECT column_name FROM information_schema.columns WHERE table_name='user_profile' ORDER BY column_name;"

      [보고] 위 4개 출력을 그대로 알려주시면, 실태에 맞는 리비전을 특정하고
        (백업 → stamp → upgrade) 순서를 설계해 드립니다.
      [주의] 실행기 단독 호출 금지 — python이 필요한 단계는 python -m 형태로 드립니다.
      [clear 증적] 최종 clear는 좌석 발급 후 role_grant_cli list 출력으로 합니다.
