    requested: 2026-08-11
    remind_after_days: 7
    evidence: null
    notes: "[목적] 콘텐츠 CUD 6라우터(/v1/concepts·/v1/problems의 POST/PATCH/DELETE)가 전건 403이다.\n  봉인(SEC-07)은 정상 작동 중이지만 좌석이 0건이라 아무도 통과 못 한다. 이 게이트를 통과해야\n  `봉인 정상`과 `아무도 못 씀`이 비로소 다른 값이 된다.\n\n[1·2단계 결과 — 2026-08-11 Kiki 실측, 완료]\n  · 컨테이너 생존 = true · alembic_version = d6e7f8a9b0c1(코드 체인에 없는 값)\n  · public 테이블 68개 · concept_visual_style 있음 · user_profile 41컬럼 — role 없음\n  · misconception_catalog에서 length(mis_id) > 16 인 행 = 0건\n  · 실측 제약: 이 상태에서 `alembic current`·`alembic upgrade head` 둘 다 exit 255\n    (Can't locate revision identified by 'd6e7f8a9b0c1') — upgrade 전에 stamp가 필요하다.\n\n[2026-08-31 재측정 — 저장소 실측(코드만 봄·DB 미접속)]\n  · 마이그레이션 체인 90건·head = d4a71c0f9b32. 2026-08-11 이후 20건이 더 쌓였다 —\n    그때 설계한 3단계 질의 2개(A/B)로는 이제 위치를 특정할 수 없다.\n  · d6e7f8a9b0c1은 지금도 체인에 없다(체인에 있는 비슷한 값은 d6e7f0a2b3c4·seq 71 — 오타 stamp 의심).\n  · 미적용 후보 구간(seq 66~89)에 op.drop_column·op.drop_table 0건 — 전부 additive다\n    (신규 테이블·nullable 컬럼·기존 컬럼 백필). 유일한 drop_column은 a9b8c7d6e5f4인데\n    2단계에서 concept_visual_style 존재로 이미 적용이 확인됐다.\n  · role_grant_cli에 스키마 프리플라이트가 들어와 있다 — 스키마가 안 맞으면 트레이스백 대신\n    한 줄 지시로 거부한다(2026-08-11 소음 실패 상환분).\n\n[3단계 — 리비전 확정. 읽기 전용, 데이터 변경 0. 2026-08-31 단일 프로브로 교체]\n# [실행 시스템] Windows PowerShell (= Phaiakes9 이 PC) · 전제: Docker Desktop 가동\ncd C:\\Users\\kiki\\Desktop\\__AI\\WhyMath\ngit fetch origin claude/git-unshallow-repo-crr6x5\ngit checkout -B claude/git-unshallow-repo-crr6x5 origin/claude/git-unshallow-repo-crr6x5\nGet-Content scripts\\ops\\probe_prod_schema_revision.sql | docker exec -i whymath-pg psql -U whymath -d whymath -v ON_ERROR_STOP=1 -f -\necho \"EXIT=$LASTEXITCODE\"\n\n[성공 기준] EXIT=0 + 마지막 `verdict` 표의 세 값이 보인다.\n  · stamp_target      = 실제로 적용된 마지막 리비전(= 4단계에서 stamp할 값)\n  · pending_count     = upgrade head가 적용할 개수\n  · present_after_gap = 반드시 0. 0이 아니면 스키마가 뒤섞인 것이라 stamp가 위험하다 —\n    그 경우 4단계로 넘어가지 말고 출력 전체를 보고할 것.\n[실패 시] EXIT != 0 이면 컨테이너·DB 접근 문제다. `docker ps --filter name=whymath-pg` 로\n  컨테이너 생존부터 확인한다(prod=5433. 55432는 일회용 데모 DB라 대상 아님).\n[보고] verdict 3값 + 26행 표를 그대로 붙여 주시면 4단계 블록을 값이 채워진 형태로 드린다.\n\n[금지] `alembic stamp`를 임의의 값으로 먼저 실행하지 말 것. 실태와 다른 값을 찍으면 이후\n  마이그레이션이 이미 있는 객체를 만들려다 깨지거나, 없는 객체를 있다고 믿고 건너뛴다.\n  stamp는 프로브로 리비전이 확정된 뒤에만, 백업을 뜬 다음에 한다.\n\n[프로브의 동결] tests/infra/test_prod_schema_probe.py가 프로브를 체인에 묶는다 — 마이그레이션이\n  추가됐는데 프로브를 갱신하지 않으면 CI가 red가 된다. 갱신 없이 두면 프로브가 `pending 0`이라는\n  틀린 통과를 내기 때문이다(측정이 아니라 위장). 결함 주입 3종으로 변별력 실측 완료.\n\n[4단계 예고 — 실행하지 말 것. 3단계 확정 후 값이 채워진 블록을 다시 드린다]\n  · 백업: scripts\\backup\\backup_whymath_pg.ps1 (기본 대상이 이미 whymath-pg)\n  · stamp(프로브가 지목한 stamp_target) → upgrade head → 좌석 부여\n  · 좌석 부여 블록은 PR #800이 정비한 형태를 승계한다 — venv 고정($Py) + user_profile\n    조회로 user_id를 고른 뒤 grant/list, 판정은 $LASTEXITCODE로.\n  · 승계 시 함께 정정할 #800 잔여 결함 2건:\n    (1) `git pull origin main` → diverged 시 add/add 충돌을 낸다(2026-08-11 실측).\n        `git fetch origin main` + `git checkout -B main origin/main` 형태로 교체.\n    (2) [회수 방법]의 꺾쇠 user_id 자리표시자 → PowerShell이 꺾쇠를 예약어로 거부한다.\n        꺾쇠 없는 자리표시자로 교체(같은 사유로 grant 쪽은 이미 정정돼 있다).\n[clear 증적] 최종 clear는 좌석 부여 후 role_grant_cli list 출력(user_id 포함 JSON)\n  + GRANT_EXIT=0 으로 한다."
