    notes: "[목적] 콘텐츠 CUD 6라우터(/v1/concepts·/v1/problems의 POST/PATCH/DELETE)가 전건 403이다.\n  봉인(SEC-07)은 정상 작동 중이지만 좌석이 0건이라 아무도 통과 못 한다. 이 게이트를 통과해야\n  \"봉인 정상\"과 \"아무도 못 씀\"이 비로소 다른 값이 된다.\n\n[중요 — 왜 바로 grant를 하지 않는가] 2026-08-11 1차 실행이 실패했다:\n  `column user_profile.role does not exist`. whymath-pg의 스키마가 코드와 맞지 않는다.\n  PR #800이 정비한 실행 블록(venv $Py 고정·user_id 조회)은 그 자체로 옳지만,\n  **스키마가 이 상태인 한 grant에서 반드시 같은 오류로 실패한다.** 그래서 스키마를 먼저 세운다.\n\n[1단계 결과 — 2026-08-11 Kiki 실측, 완료]\n  · 컨테이너 생존 = true\n  · alembic_version = d6e7f8a9b0c1  ← **현재 코드의 마이그레이션 체인에 없는 값**\n  · misconception_catalog에서 length(mis_id) > 16 인 행 = 0건\n[2단계 결과 — 2026-08-11 Kiki 실측, 완료]\n  · public 테이블 68개\n  · privacy_audit=없음 · defect_report=없음 · concept_visual_style=있음\n  · user_profile 41컬럼 — **role 없음**(c5d6e7f0a2b3 미적용 확정)\n[해석] 실제 스키마는 a9b8c7d6e5f4(concept_visual_style 있음)와 c5d6e7f0a2b3(role 없음)\n  사이다. 즉 밀린 것은 4~5개뿐이고 **전부 additive**다 — 기록된 버전 문자열만 실태와 무관한\n  값이다. 1단계의 mis_id 0건으로 a5b6c7d8e9f0의 DELETE 선행 전제도 이미 충족.\n[실측된 제약] 이 상태에서 alembic은 아예 동작하지 않는다 — 컨테이너에서 동일 상태를 재현해\n  확인: `alembic current`·`alembic upgrade head` 둘 다 exit 255,\n  \"Can't locate revision identified by 'd6e7f8a9b0c1'\". 그래서 upgrade 전에 stamp가 필요하다.\n\n[3단계 결과 — 2026-08-31 Kiki 실측, 완료]\n  · 사전 사고: 8/25 10:08Z 누군가 whymath-pg를 빈 클러스터로 재생성(POSTGRES_USER=postgres·포트 56432·\n    스키마만 899ae0efbb8b·데이터 0). 원본은 dangling 볼륨 ef75415d에 무손실 생존 확인.\n  · 복구 완료(2026-08-31): 원본 볼륨으로 whymath-pg 재생성(5433·whymath 롤·restart unless-stopped)\n    — 재고 재현 concepts 2683 / edges 2210 / misconceptions 841 / standards 895.\n    빈 컨테이너는 whymath-pg-empty-20260825로 개명 보존(삭제 아님). 백업\n    whymath_20260831_120150.dump 확보(-Fc·카탈로그 자가검증·BACKUP_EXIT=0).\n  · A) formula_node constraints/mnemonic = 0행 → stamp 확정 = a9b8c7d6e5f4\n  · B) 뒤쪽 리비전 혼입 = 0행 → stamp 안전\n  · 후보→head 22개 마이그레이션 전수 스캔(세션 실측): upgrade측 파괴 연산 0\n    (a9b8 자체 drop은 stamp 지점이라 재실행 없음 · b8e76fe238d0 UPDATE 2건은 무손실 백필)\n\n[4단계 — 실행 대기. 아래가 복붙 실행 블록 전문(단계별 exit 판정 동봉) — Windows PowerShell·창 1개]\n# 0) 리포 최신화 + venv·DB URL 고정\ncd C:\\Users\\kiki\\Desktop\\__AI\\WhyMath\ngit fetch origin main\ngit checkout -B main origin/main\n$Py = \"C:\\Users\\kiki\\Desktop\\__AI\\WhyMath\\.venv\\Scripts\\python.exe\"\n$env:WHYMATH_DATABASE_URL = \"postgresql+asyncpg://whymath@127.0.0.1:5433/whymath\"\ncd src\\backend\n\n# 1) stamp — 3단계 A=0행으로 확정된 실태 리비전\n& $Py -m alembic stamp a9b8c7d6e5f4\necho \"STAMP_EXIT=$LASTEXITCODE\"\n& $Py -m alembic current\n\n# 2) 밀린 마이그레이션 전체 적용 (사전 전수 스캔: 파괴 연산 0·백업 확보됨)\n& $Py -m alembic upgrade head\necho \"UPGRADE_EXIT=$LASTEXITCODE\"\n& $Py -m alembic current\n\n# 3) 직접 신호 검증 — role 컬럼 실재(버전 문자열 아님) + 데이터 무손상(2683/2210/841/895)\ndocker exec whymath-pg psql -U whymath -d whymath -c \"SELECT column_name FROM information_schema.columns WHERE table_name='user_profile' AND column_name='role';\"\ndocker exec whymath-pg psql -U whymath -d whymath -c \"SELECT (SELECT count(*) FROM concept) AS concepts, (SELECT count(*) FROM concept_edge) AS edges, (SELECT count(*) FROM misconception_catalog) AS misconceptions, (SELECT count(*) FROM achievement_standard) AS standards;\"\n\n# 4) 운영자 계정 부트스트랩 — 앱 로그인과 동일 해시(sha256 소문자)·rollrock.ki@gmail.com\n#    (OAuth 미가동·user_profile 0행 실측 근거의 1회성. 페르소나는 enum 1번값 — 한글 인코딩 회피)\ndocker exec whymath-pg psql -U whymath -d whymath -c \"INSERT INTO user_profile (user_id, email_hash, persona_primary) VALUES (gen_random_uuid(), '26727c7b2e4acb35dbb468ab84a47fff1242b5248e5c67e7c9458f7a7557bb46', (enum_range(NULL::persona_enum))[1]);\"\n$uid = (docker exec whymath-pg psql -U whymath -d whymath -t -A -c \"SELECT user_id FROM user_profile WHERE email_hash='26727c7b2e4acb35dbb468ab84a47fff1242b5248e5c67e7c9458f7a7557bb46';\").Trim()\necho \"UID=$uid\"\n\n# 5) 좌석 1호 grant + list 검증 (list JSON = clear 증적)\n& $Py -m whymath_backend.ops.role_grant_cli grant $uid content_admin\necho \"GRANT_EXIT=$LASTEXITCODE\"\n& $Py -m whymath_backend.ops.role_grant_cli list\necho \"LIST_EXIT=$LASTEXITCODE\"\n\n[성공 기준] STAMP_EXIT=0 → current=a9b8c7d6e5f4 →