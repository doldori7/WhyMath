  - id: G-operator-seat-first-grant
    title: "운영자 좌석 1호 발급 (prod whymath-pg) — 1단계는 '측정만'. prod 스키마가 뒤처져 있어 부여 전에 실제 alembic head 확인이 선행돼야 한다(2026-08-11 실행 실패 실측)"
    kind: human
    assignee: kiki
    status: pending
    requested: 2026-08-11
    remind_after_days: 7
    evidence: null
    notes: |
      [과제] 1단계 — prod(whymath-pg) 현황 측정. 읽기 전용, 데이터 변경 0.
      [왜 측정부터인가] 2026-08-11 첫 시도가 `column user_profile.role does not exist`로
        실패했다. whymath-pg가 마이그레이션이 뒤처져 있다는 뜻이다. 저장소에 마지막으로
        기록된 실측 head는 f3a4b5c6d7e8(2026-06-30, dialogue_encryption_deployment_checklist.md
        §실측)이고, 그게 아직 그대로면 밀린 마이그레이션이 29개이며 그중 upgrade 단계가
        파괴적인 것이 6건(concept 컬럼 drop 4건·제약 drop·타입 확대)이다. 그래서
        "upgrade head 하세요"를 지금 드릴 수 없다 — 실제 head를 본 뒤에 판단한다.
      [실행 환경] Windows PowerShell (= Phaiakes9 이 PC, 진입 명령 불요)
      [창 구분] 새 창 1개. 서버를 점유하지 않으므로 이후 조작 가능.
      [선행] Docker Desktop 가동 + whymath-pg 컨테이너 실행 중
      [성공] 아래 3개 출력이 모두 나오면 성공. 실패는 명령이 오류를 내는 경우.

      # [실행 시스템] Windows PowerShell (= Phaiakes9 이 PC)
      cd C:\Users\kiki\Desktop\__AI\WhyMath

      # 1) 컨테이너 실행 확인 — True 여야 진행
      docker inspect -f "{{.State.Running}}" whymath-pg

      # 2) prod의 실제 alembic head (핵심 측정치)
      docker exec whymath-pg psql -U whymath -d whymath -c "SELECT version_num FROM alembic_version;"

      # 3) 파괴적 마이그레이션 선행 정리가 필요한지 (a5b6c7d8e9f0 전제 확인)
      docker exec whymath-pg psql -U whymath -d whymath -c "SELECT count(*) FROM misconception_catalog WHERE length(mis_id) > 16;"

      [판정] 2)의 값이
        - 090d254a5d43  → 이미 최신. 좌석 발급 단계로 바로 진행 가능(2단계 안내 요청).
        - c5d6e7f0a2b3 이상 090d254a5d43 미만 → 밀린 것이 additive뿐. 백업 후 upgrade 안전.
        - 그 미만(예: f3a4b5c6d7e8) → 파괴적 항목 포함. 3)의 값과 함께 알려주시면
          적용 범위·순서를 다시 설계해 드린다. 임의로 upgrade head 하지 말 것.
      [보고] 2)와 3)의 출력을 그대로 알려주시면 됩니다. 그걸로 2단계를 설계합니다.
      [주의] 실행기 단독 호출 금지 — python이 필요한 단계는 2단계에서 python -m 형태로 드립니다.
      [clear 증적] 최종 clear는 2단계(좌석 발급) 완료 후 role_grant_cli list 출력으로 합니다.
