  - "① 현행 실측 고정 — whymath-pg(5433)의 alembic head가 코드 기대(EXPECTED_ALEMBIC_HEAD)와 벌어져 있고 그 사실을 감시하는 장치가 0건임을 재확인한다. 저장소 마지막 실측 기록은 f3a4b5c6d7e8(2026-06-30·dialogue_encryption_deployment_checklist.md)이고 2026-08-11 role_grant_cli 실행 실패로 여전히 뒤처짐이 드러났다. 앱 기동 가드(verify_schema_version)는 '그 DB에 앱을 띄울 때'만 발화하므로 CLI 위주 운영에서는 구조적으로 침묵한다."
  - "② whymath-pg 마이그레이션 절차 문서 신설 — 저장소에 이 DB 대상 절차가 0건이다(deployment_cd_runbook.md의 명령은 전부 별개 compose 스택 whymath-ENV-db 대상이고, 같은 문서가 '기존 whymath-pg 이관 미실시'를 자인). db_backup_dr_runbook.md에 절을 붙이거나 별도 문서로 신설한다. 반드시 포함: 백업 선행(scripts/backup/backup_whymath_pg.ps1 기본 대상이 이미 whymath-pg) · alembic current로 대상 DB 대조(URL 오타로 5432/55432를 업그레이드하는 사고 차단) · Windows asyncpg는 URL에 ssl=disable 필요(scripts/demo/README.md 실측 사고) · 실행 후 env 누수 정리."
  - "③ 드리프트를 사람이 안 봐도 드러나게 — 최소 형태는 '측정 결과를 남기는 것'이다. 새 스케줄러·상시 프로세스는 도입하지 않는다(OPS-31 백업 스케줄과 같은 축이라 중복 인프라 금지). 후보: 기존 ops 리포트 CLI가 head 대조를 함께 출력하거나, 게이트 대장이 재확인 주기를 갖게 하는 것. 착수 세션이 비용 대비로 택일하고, 택하지 않은 안을 사유와 함께 기록한다."
  - "④ 변별력 실측 — 뒤처진 DB와 head DB 두 상태에서 서로 다른 값이 나오는지 양방향 확인한다. 같은 값이면 관측이 아니라 위장이다."
  - "⑤ 범위 밖 동결 — 실제 prod 마이그레이션 적용은 이 태스크가 하지 않는다(G-operator-seat-first-grant가 측정 → Kiki 판단 → 적용 순서로 소유). 파괴적 마이그레이션 6건의 적용 여부는 데이터 판단이라 사람 소유다."
