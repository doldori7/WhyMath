acceptance:
  - "결함: api/_rate_limit.py:938-956 _client_ip가 X-Forwarded-For 좌측 첫 값을 신뢰 프록시 검증 없이 채택. 위조 시 미인증 표면(auth 콜백/리프레시·/v1/reports/defects)의 IP 레이트리밋 전면 우회 + privacy/audit.hash_client_ip 기록(미성년 동의변경·개인정보 반출 감사 IP) 위조."
  - "수정: XFF를 append가 아닌 overwrite하는 신뢰 프록시 전제 하에서만 신뢰(신뢰 프록시 IP 화이트리스트/홉 수 기반 우측-신뢰값 채택). 신뢰 프록시 미구성이면 request.client.host로 폴백. 주의: uvicorn --proxy-headers/--forwarded-allow-ips는 이 함수를 고치지 못함(raw 헤더 직접 판독) — 함수 자체를 고쳐야 함."
  - "테스트(결함주입): 위조 XFF 헤더로 rate limit 우회·감사 IP 오염이 차단되는지 확인. 신뢰 프록시 없는 기본 자세에서 XFF가 무시되는지 동결."
  - "배포 게이트: 공개 배포(APP_BIND_ADDR=0.0.0.0 또는 인터넷 노출) 전 이 봉합이 선행되어야 함을 명시(현재 127.0.0.1 바인딩이라 잠재 상태)."
artifacts:
  - "_client_ip(api/_rate_limit.py)를 X-Forwarded-For 무조건 신뢰(좌측 첫 값 채택)에서 신뢰 프록시 allowlist 기반 우측-신뢰 알고리즘으로 교체. Settings.trusted_proxy_ip_allowlist(콤마구분, 기본값 빈 문자열) 신설 — 미구성 시 XFF 완전 무시하고 request.client.host만 사용(deny-by-default, 위조로 rate limit·감사 IP 조작 불가). 구성 시 request.client.host가 allowlist에 있을 때만 XFF를 오른쪽부터 순회해 신뢰 프록시를 건너뛰고 첫 미신뢰 값을 채택. 호출부 11곳(_rate_limit.py 9곳 + users.py + me.py) 전체 갱신. 결함주입 테스트 20건 신설(tests/backend/api/test_client_ip_trusted_proxy.py) — 미구성 시 XFF 위조 무력화, 1홉/다홉 체인, 미신뢰 피어의 위조 시도, rate-limit 레벨 통합테스트 포함. 서브에이전트 최초 보고에서 ruff 미사용 import 1건·black 포맷 1건을 독립 검증 중 발견해 직접 수정(서브에이전트의 green 주장이 부정확했던 사례 — 검증 신뢰하지 않고 직접 재확인한 덕에 발견). 최종: 백엔드 전체 스위트 8957 passed/296 skipped/0 failed, tests/infra 303 passed, ruff/black/mypy --strict 전부 green(전부 독립 재검증). uvicorn --proxy-headers 등으로는 이 함수가 고쳐지지 않는다는 점을 함수 docstring에 명시. trusted_proxy_ip_allowlist는 아직 어떤 환경에도 설정되지 않음(공개 배포 전 설정 필요 — 배포 게이트 acceptance④ 충족은 문서화로, 강제는 후속)."
