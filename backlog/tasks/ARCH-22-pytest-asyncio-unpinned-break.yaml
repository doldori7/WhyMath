acceptance:
  - "pyproject.toml의 pytest-asyncio>=0.24.0(상한 없음)에 검증된 메이저 상한을 건다(langfuse>=2.50,<5 선례 동형) — 현재 활성 장애가 아니라 예방적 조치. 배경(2026-07-30 정정): 이 세션의 로컬 컨테이너 venv에서 pip install -e '.[dev]' 시 pytest-asyncio 1.4.0이 해석돼 async fixture 처리가 깨지며 575 failed·4 errors가 재현됐다(origin/main worktree와 diff 0으로 로컬 환경 한정임은 확인). 그러나 **실 GitHub Actions CI**(PR #648, run 30528307807 — 동일 무상한 pin, 동일 pip install 커맨드)에서는 backend 잡의 Pytest 단계가 21분간 정상 green(2026-07-30T08:53~09:14) — 실 CI는 이 문제를 겪지 않는다. 즉 활성 장애가 아니라 **미래 드리프트 리스크**(pip 해석 시점에 따라 CI가 예고 없이 깨질 수 있음)로 성격을 낮춘다. 상한 pin으로 이 리스크 자체를 제거."
