notes: "발견 경위(2026-09-01 실측): PR #952 가 CI 16잡 green 을 3회 확보하고도 머지되지 못했다. 1라운드는 미해결 Codex 스레드(정당한 룰·처리 완료), 2·3라운드는 전부 mergeable_state=behind 였다 — CI 가 도는 약 30분 사이에 main 에 #963·#964(2라운드), #957(3라운드)이 착지했다. auto-merge 를 켜도 해소되지 않는다: auto-merge 는 브랜치를 자동 최신화하지 않으므로 체크 완료 시점에 base 가 앞서 있으면 그대로 대기한다. 병목은 backend 잡 약 29분이며 병렬 세션이 활발할수록 패배 확률이 오른다 — 확률이 아니라 구조. pr931 근본원인 문서 §2 가 같은 경합을 기술했으나 그 대책(HARN-46 events.ndjson 샤딩)은 dirty(파일 충돌) 축이라 이 behind 축에는 작동하지 않는다. Kiki 판단(2026-09-01): 대안이었던 'require branches to be up to date 해제'는 오래된 base 에서 통과한 CI 로 머지를 허용해 보호를 낮추므로 채택하지 않고, merge queue 를 택한다. ⚠ ruleset 변경은 리포 관리자 권한이 필요하므로 착수 세션은 Kiki 실행 명령 동봉이 필요할 수 있다(CLAUDE.md Kiki 머신 안내 규칙).\n\n[정정 2026-09-03] acceptance ②③이 저장소 관리자 설정(ruleset)을 요구한다 — 세션 권한 밖. 게이트 notes가 세션 대행 범위를 '①ci.yml merge_group 트리거는 세션이 PR로'로 이미 분리했으므로, 그 경계를 대장에 집행한다(산문 선행은 selector가 읽지 않는다 — HARN-52 축).\n\n[정정 2026-09-03] ② '큐가 사용할 체크를 required 집합과 일치'가 성립하려면 라이브 required 집합이 먼저 옳아야 한다. 미강제 10건 상태에서 큐를 켜면 6건만 검증하는 큐가 된다 — 보호를 유지하려는 이 태스크의 취지와 반대 결과."
