notes: "사고 경위(실측): 2026-08-31 HARN-38이 acceptance ①의 입력(미push 브랜치 YAML)을 못 구해 사람 게이트 G-cur16-branch-push를 신설하고 block으로 전이 → cmd_block이 원격 claim을 반납 → 05:00:05Z에 타 세션 claude/failure-definition-signature-scmzdu가 HARN-38을 claim(그 세션 task_summary도 'Pushing HARN-38 branch'로 같은 작업 착수 확인) → 게이트 해소 후 원 세션이 재claim하려 했으나 CAS 충돌로 거부. --force 우회는 하지 않았다(확정 신호). 크로스세션 메시지는 도달 불가(ListAgents 0건)라 사람 보고로 에스컬레이션. 구조적 원인: '게이트 대기'와 '차단'은 의미가 다른데(전자는 자리를 지켜야 하고 후자는 인계 가능해야 한다) 같은 전이를 쓴다. 부수: requires_gates가 걸린 태스크는 start가 거부되므로 todo로 두어도 재claim이 안 된다 — 즉 현재 설계에는 '게이트 대기 중 자리 보전'을 표현할 수단 자체가 없다.\n\n[정정 2026-08-31] HARN-48과 중복 — 구현 완료분 명시 + 잔여 축 분리 제안(4회차 중복 구현 방지)\n\n[취소 2026-09-01] HARN-48(#916 · 50df469d)과 동일 뿌리로 중복 — main의 acceptance ④가 요청한 판정에 Kiki가 cancel로 답했다(2026-09-01). HARN-48이 더 넓다: block이 remote_claims.hold()로 kind=block 홀드를 게시해 보호가 기본값이고(--handover가 인계 옵트인), claim을 재사용하지 않아 '차단'과 '착수 점유'가 신호 층위에서 분리되며, start가 kind=block을 따로 안내해 --force 탈취를 유도하지 않고, unblock이 홀드를 함께 걷는다. 본 태스크 구현(PR #942)은 반대 극성(block=반납 기본 + --gate-wait가 claim 유지)이라 머지하면 main의 _publish_block_hold가 사라져 보호가 후퇴한다 — PR #942 close, 코드 폐기. 잔여 축('게이트 대기 전용 상태값 신설')은 현재 block+홀드로 충족되어 남기지 않는다."
