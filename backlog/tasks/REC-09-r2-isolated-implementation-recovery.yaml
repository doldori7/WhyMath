notes: "docs/architecture/ai_recommendation_module_gap_review_r3.md §3 D6. r2 문서(ai_recommendation_module_gap_review_2.md)와 REC-05~REC-08 YAML 4건은 r3 커밋에서 git 파일 체크아웃으로 회수했으나(math-engine b8608bfd 선례) 구현 2커밋은 소스 변경이라 갭 리뷰 시리즈 관례(문서+등재만)를 벗어나 이 태스크로 분리한다. 고립원 origin/claude/whymath-ai-recommendation-review-tv1f08(fdf46d7b·main 대비 24커밋 앞섬). 실측: REC-05·REC-08은 status=done·artifacts 보유인데 그 커밋이 main 조상이 아니며, backlog validate가 이 불일치를 green으로 통과시킨다(대장이 고립을 못 잡는다 — D6 보강 근거). SOL-01 동형. 착수 전 조율 필수: overlap 실측 결과 S4-16-residue-gate-demotion-battle(세션 claude/whymath-ai-content-design-vafylb)이 harness/**를 선언하고 있어 attempt_grading_shadow_report.py 1건이 실제로 겹친다 — 경고를 넘기지 말고 그 세션의 진행 상태를 먼저 확인한다(2026-07-27 병렬 세션 충돌 교훈). **acceptance ① 명세 결함 실측(2026-08-11 회수 세션)**: cherry-pick은 patch-id 동치를 승계할 뿐 커밋 객체를 계보에 넣지 않으므로 --is-ancestor는 원리상 0이 될 수 없다 — 0을 만드는 유일한 길인 고립 브랜치 merge는 같은 태스크가 경계했다(r3가 이미 회수한 문서·YAML 중복 + REC-08 YAML의 done을 in_progress로 되돌림). 권장 방식과 검증 방식이 배타적이라 acceptance ①은 문자 그대로 달성 불가이며, 의도(고립 해소의 재현 가능한 증명)는 더 강한 대체 측정으로 충족했다 — git cherry(patch-id) + 경로별 바이트 대조 + ci.yml 게이트 블록 diff EXIT=0. 향후 회수 태스크의 acceptance는 --is-ancestor 대신 이 대체 측정으로 쓴다(SOL-01 동형 주의). acceptance 문구 자체는 골대 이동 방지를 위해 손대지 않았다."
