notes: "[2026-08-10 착수 조사 — 교차계층 설계 결정 필요] acceptance①의 선행 판정을 수행한 결과: 현행 problem_screen.dart:48-51의 '건너뛰기' 버튼은 context.go(chatPath)로 *코치 화면으로 이탈*할 뿐 '이 문제를 건너뛰고 다른 문제를 받는' 동작이 아니다 → 불충분(재구현 필요) 판정. 그런데 올바른 재구현은 mobile-only로 불가능함이 실측으로 확인됨: 서버 GET /v1/me/next-problem은 후보에서 attempted_ids(=채점 이력이 있는 문제)만 제외하므로(api/me.py candidate_stmt), 건너뛰기를 아무 데도 기록하지 않으면 load()를 다시 불러도 결정론적으로 *같은 문제*가 반환된다. 즉 클라만으로는 '건너뛰기'가 성립하지 않는다. 필요한 결정 2건 — ①서버 계약: 후보 제외 목록을 클라가 넘기는 방식(예: ?exclude=<uuid>,... — 기존 attempted/sibling_filter 배제와 동형 SQL 필터, 학습자 모델 무영향·상한 필요) vs 서버가 skip을 기록하는 방식(테이블/이벤트 신설) ②교수학 정책: 건너뛴 문제가 θ 추정·숙달(BKT/IRT)에 어떻게 반영되(지 않)는가 — acceptance③이 '오답 처리 금지·단순 미응답과 구분'을 요구하므로 L2 의미론 결정이 선행돼야 한다. 이 태스크는 layer=mobile·paths=src/mobile/lib/** 로 등록돼 있어 백엔드 확장은 선언 범위 밖 — 범위 재정의(백엔드 포함) 또는 별도 백엔드 태스크 분리가 필요하다. /drive 안전장치(acceptance 판단 불가·교차계층 모호성)에 해당해 차단.
  [2026-08-10 전제 정정 — 원본은 접근 가능하다] 이 태스크의 acceptance를 '원본 diff 없음 → 재설계'로 쓴 것은 **내 오판이었다**. 원 브랜치가 origin에서 삭제된 것은 사실이나, 그로부터 git fetch가 실패한다는 이유만으로 '원본 접근 전면 불가'로 단정했고 다른 접근 경로를 시험하지 않았다. 실제로는 **GitHub API로 원 커밋에 완전히 접근된다**(repos/<owner>/<repo>/commits/<sha> — 메시지·파일목록, detail=full_patch로 유니파이드 diff까지). 2026-08-10 실측 확인했고, main도 #748에서 '회수 경로는 GitHub API 고정'으로 정본화했다. ② 원S3-18 원 커밋 SHA: fa08081 · 7f0d84e. 따라서 이 항목은 '처음부터 재설계'가 아니라 **원본을 읽고 현재 main 위에 이식하는 회수**로 다루라 — 원본의 UX 디테일·테스트를 그대로 살릴 수 있다."
