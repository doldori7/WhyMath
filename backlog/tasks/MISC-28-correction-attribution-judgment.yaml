notes: "발단: MISC-26에서 정정 어휘 13종을 결함 주입으로 재니 전건이 오억제를 냈다. 어휘를 넓히는 것이 답이 아니라는 것이 그 태스크의 결론이고, 이 태스크가 그 잔여를 받는다. 교수학 판정(MISC-25 세션)이 '귀속(attribution) 문제이고 어휘·거리로는 원리상 미해결 — LLM-judge 좌석이 그 자리'라고 독립 지목했다."
