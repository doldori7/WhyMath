acceptance:
  - "① 실측 고정 — 정정 어구가 **무엇을 정정하는지**(귀속)는 어휘·거리로 판정 불가다. 같은 연결어미가 반대 뜻으로 쓰인다: \"양변을 x로 나누면 x=2라고 봤**지만** 틀렸다\"(진짜 반박 — 억제해야 함)와 \"부호가 잘못됐**지만** 양변을 x로 나누면 x=2다\"(다른 것을 정정하고 이 오개념을 저지름 — 진단해야 함)는 연결어미만으로 구별되지 않는다. 현재 축은 둘 다 억제하므로 후자가 미검출이다(실측 · `-지만`·`-어서`·`-는데` 3종 전부 재현).\n② 범위 — MISC-26이 어휘 확장을 **채택하지 않은 근거**가 이것이다. 후보 13종(위험 6 + 안전하다고 가정한 7)을 결함 주입으로 재니 **13/13 전부** 같은 형태로 오억제를 냈다(\"부호에서 실수했지만 양변을…\" 등). 즉 병목은 어휘가 아니라 귀속이고, 어휘를 넓히면 이 미검출 경로가 함께 넓어진다. MISC-25가 절 경계(구두점·번호·연결어미 `-고`)로 좁힐 수 있는 데까지 좁혔고, 남은 것은 절 **안**의 귀속이다.\n③ 해소 좌석 — 어휘 축이 아니라 **판정 축**이다. 후보: (ⓐ) LLM-judge 좌석(`l4/misconception/judge_seam.py`)이 \"이 정정 어구가 이 오개념을 가리키는가\"를 3상태로 판정 (ⓑ) 의미 경로(임베딩)로 정정 대상과 오개념의 근접도 측정 (ⓒ) 3-state 강등 — 귀속이 불명하면 억제도 진단도 아닌 **확인 질문**으로 내린다(교수학 판정 권고 · `MatchGateResult.low_quality`와 `coach.py`의 `persisted_matches = [] if outcome.low_quality` 선례가 이미 그 축을 갖고 있다). ⓒ는 confidence 눈금을 건드리지 않으므로 `refuting_regex` docstring의 \"왜 감점이 아니라 거부인가\"와 충돌하지 않는다.\n④ 집행 지점(정본화와 별항) — 판정 축을 붙이면 `harness/explicit_correction_gap_eval.py`에 **오억제 축을 추가**한다. 현재 그 도구는 사각(정정했는데 진단이 나감)만 재고 반대 방향(진단해야 하는데 안 나감)은 안 잰다 — 그래서 \"사각 0%\"가 과잉 억제를 가릴 수 있다. `tests/backend/l4/test_misconception_diagnose.py::TestExplicitCorrectionNearSignals`의 대조군이 지금 그 역할을 하지만 대표 항목만 밟으므로 전수가 아니다. 결함 주입 픽스처(연결어미 3종 × 카탈로그 전수)를 그 도구에 넣어 양방향을 한 화면에 낸다."
  - "[2026-09-12 실측 — ① 재현 · ③ 값싼 결정론 해법 반증 · ④ 착지] 판정 기준: 브랜치 `9200d244` 위 · base main `60bdd59b`.\n\nⓐ **① 오억제 전수 재현** — 형태 `<다른 것을 정정하는 앞절> <연결어미> <이 오개념 주장>`으로 카탈로그 전수를 재니 연결어미 3종 **전부 66/66(100%)** 오억제였다(대조군 미발화 1종 `exponent-zero` 제외). 즉 \"부호를 잘못 옮겨 적었지만 <오개념>\"이라고 쓴 학생은 **어떤 오개념도 진단받지 못한다**.\n\nⓑ **측정 설계 결함을 한 번 잡았다(기록)** — 1차 측정은 접두마다 정정 어휘가 달라 `-는데`만 오억제 0%가 나왔고, 그것을 \"연결어미 차이\"로 읽을 뻔했다. 실제 원인은 그 접두에만 정정 어휘가 없던 것이다. 어휘를 `잘못` 하나로 **고정**하고 연결어미만 바꾸자 3종 전부 100%로 수렴했다. 정정 어휘 없는 대조군은 0% — 억제가 어휘 때문임을 보인다. 이 통제는 `FOREIGN_CORRECTION_PREFIXES`와 그 회귀 테스트로 코드에 고정했다.\n\nⓒ **③ 후보 중 \"창을 방향으로 바꾼다\"(값싼 결정론)는 실측 반증됐다** — 오억제는 정정 어구가 신호 *앞*, MISC-25가 막은 사각은 *뒤*라서 `_CORRECTION_LOOKBEHIND`를 끄면 갈릴 것처럼 보였고 실제로 오억제가 100%→3.0%로 떨어졌다. 그러나 **같은 조작이 선행정정 사각을 0%→100%로 연다**(라벨 후 인용: \"틀린 풀이: <오개념>\"·\"오답 예시 — <오개념>\"·\"잘못된 풀이는 <오개념>\" 3종 전수). 즉 방향 규칙은 실패를 *고치지 않고 옮긴다*:\n\n    현행 lookbehind=12 : 오억제 66/66(100%) · 선행정정 사각  0/66(  0%)\n    lookbehind=0       : 오억제  2/66(  3%) · 선행정정 사각 66/66(100%)\n\n  그러므로 acceptance ③의 전제(\"어휘 축이 아니라 판정 축\")가 실측으로 확인된다. 남은 후보는 ⓐ LLM-judge 좌석 · ⓑ 의미 경로 · ⓒ 3-state 강등(확인 질문)이며, 셋 다 **학생 노출을 바꾸므로** 이 세션이 단독으로 고르지 않는다.\n\nⓓ **④ 집행 지점 착지** — `harness/explicit_correction_gap_eval.py`에 **오억제 축을 추가**해 양방향을 한 화면에 낸다. 이전에는 사각만 재서 **과잉 억제가 개선으로 보였다** — 무엇이든 억제하면 사각은 0%가 되기 때문이다. 실제로 그 상태였다: 이 도구가 \"사각 0%\"를 내는 동안 오억제는 100%였고 그 사실이 어느 화면에도 없었다. 검증: 뮤테이션 6종 전건 RED(대조군 접두 제거·대조군에 어휘 주입·어휘 통제 깨기·연결어미 누락·보고서 표 제거·**판정 반전 과잉수정 대조군**) · 신규 테스트 4건.\n\nⓔ **미이행(명시)** — ③의 좌석 선택은 **하지 않았다**. 세 후보 모두 학생에게 나가는 것을 바꾸므로 교수학 판정과 Kiki 결정이 필요하다. 게이트로 분리 등재했다. 이 태스크가 착지시킨 것은 ①의 크기와 ③의 후보 1종 반증, 그리고 ④의 양방향 측정까지다."
