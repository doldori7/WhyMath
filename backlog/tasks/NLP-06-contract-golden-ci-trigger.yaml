notes: "docs/architecture/nlp_module_gap_review_r2.md §8.3(Δ3)·§8.11-⑥(범위 축소 근거). **2026-08-11 병합 시점 축소**: 최초 등재는 backend·mobile·web 3축이었으나, 같은 날 main에 착륙한 COLLAB-04-contract-fixture-ci-trigger-axis(협업 r3 §3 D5·PR #784)가 backend·web 축을 이미 소유함이 확인돼 중복을 제거했다. 다만 COLLAB-04 acceptance ⑥이 '다른 잡(mobile/data-pipeline)의 필터 확장은 이 태스크 범위 밖'이라 **명시적으로 그었으므로** mobile 축은 여전히 무주공산이며 이 태스크가 그것만 가져간다. 두 태스크는 중복이 아니라 분업이고, 순서는 COLLAB-04가 먼저다(필터 규약·재발 차단 장치를 그쪽이 정한다). 고유 사실: ci.yml:83 mobile 필터가 ^(src/mobile/|schemas/|ci.yml)뿐이라 data/ 계약이 통째로 빠져 있고, 그 결과 NLP-03이 만든 교차 골든이 백엔드→클라 방향으로 미강제다 — 계약을 고쳐도 Dart가 안 돌고, 백엔드 구현을 고쳐도 Dart 미러가 안 돈다. math_engine_gap_review.md §7 Δ2가 mobile 필터 구멍을 지적했으나 data/ 축은 그 관찰에도 없었다. 판정 기준: '게이트를 트리거하는 경로가 그 게이트가 지키는 파일을 실제로 덮는가'.\n\n[취소 2026-08-11] COLLAB-04(done)가 mobile 축까지 덮어 해소 — 자기 acceptance ⑥이 'mobile은 범위 밖'이라 했으나 구현은 그것을 초과해 ci.yml:102 mobile 필터에 data/{notation,segmentation,scene,render}_contract.json 4종을 전부 넣었다(주석 :97이 'Dart 골든이 File(../../data/...)로 읽는다'고 사유까지 명시). 이 태스크가 mobile 축 전용으로 축소된 뒤 남은 근거가 전부 사라졌다. 잔여 축 1건은 살아 있으나 등재하지 않는다 — '백엔드 구현(l5/ocr/text_segmentation.py)만 바뀐 PR에서는 여전히 mobile 잡이 안 켜져 Dart 미러가 미검사'다(mobile 필터에 src/backend 경로가 없다). 이는 교차 골든의 백엔드→클라 방향 미강제로, NLP-03 D3 설계 목적의 절반이 여전히 비어 있다는 뜻이며 nlp_module_gap_review_r2.md §8.3·§8.11-⑥에 사실로 기록돼 있다. 별도 태스크로 만들지 않는 이유: COLLAB-04가 이 축의 소유자로 확립됐고 재발 차단 장치(tests/infra/test_ci_contract_fixture_trigger_wiring.py)도 그쪽에 있어, 여기서 신설하면 여섯 번째 중복이 된다(이 세션의 중복 5회 실적 — §8.11-⑥ 표)."
