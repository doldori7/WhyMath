  - "③ 정본화: mobile 필터에 계약 fixture 축을 추가한다. 신규 CI 잡 0 · 계약 파일 내용 변경 0 · Dart 테스트 내용 변경 0. 개별 나열 vs data/ 접두 패턴은 COLLAB-04가 정한 쪽을 따른다(두 필터가 서로 다른 규약을 쓰면 다음 누락이 어느 쪽에서 날지 알 수 없다)"
  - "④ 집행 지점(별항): 봉합 후 계약 JSON만 바꾼 상태를 합성해 mobile 잡이 실제로 켜지고 그 안에서 해당 Dart 골든이 실행되는지 확인한다 — 필터 문자열 수정만으로 완료 처리하지 않는다(2026-08-04 '정본화를 집행으로 착각한 완료 선언 금지'). '저장소에 존재함 ≠ 돌아감'(OPS-03·10·11)"
  - "⑤ 교차 골든의 양방향 강제: 백엔드 구현(src/backend/.../l5/ocr/text_segmentation.py)만 바뀐 PR에서도 Dart 미러가 검사되는지 판정한다. 안 되면 그 사실을 정직하게 기록하고 해소 여부를 이 태스크에서 결정한다 — NLP-03 D3의 설계 목적이 '같은 파일을 읽는 교차 골든'이었으므로 한 방향만 강제되면 드리프트 방어는 절반이다"
  - "⑥ 변별력: 수정 전 '해당 PR에서 mobile 잡 skip'·수정 후 '실행'이 서로 다른 값으로 나오는지 실측한다. skip은 red도 green도 아니면서 required check에서 충족으로 계상되므로(ci.yml 자인) 눈으로 green을 보는 것은 판정이 아니다"
  - "⑦ 범위 밖 명시: backend·web 필터 확장(COLLAB-04 소유 — 중복 금지) · 계약 내용·골든 케이스 수정 · mobile 잡의 커버리지 게이트 조정 · data-pipeline 필터 · 신규 계약 도입"
