acceptance:
  - "① 현행 실측 고정: backlog.py cmd_overlap의 비교 대상이 status in ('in_progress','review')로 한정돼 todo끼리는 겹침이 계산되지 않음을 재확인한다(2026-08-11 실측 :1403-1407). add --path의 겹침 검사가 같은 제한을 공유하는지도 실측한다 — 공유하면 등재 순간의 중복이 구조적으로 안 잡힌다는 뜻이다"
  - "② 실사고 재현: NLP-06과 COLLAB-04는 paths가 ['.github/workflows/ci.yml','tests/infra/**']로 동일하고 근본원인도 같은데 overlap NLP-06이 '겹침 없음'을 출력했다(둘 다 todo였기 때문). 이 상태를 회귀 테스트로 고정한다 — 결함 재현 선행"
  - "③ 정본화: 등재·착수 시점에 status와 무관하게(또는 todo 포함 옵션으로) 범위 겹침을 계산하는 경로를 연다. 기존 pathscope.overlap을 재사용하고 새 겹침 알고리즘을 만들지 않는다"
  - "④ 집행 지점(별항): add 경로에서 그 검사가 실제로 돌아 사용자에게 보이는지 확인한다 — 함수만 고치고 add가 여전히 in-flight만 보면 정본화만 하고 집행은 안 한 것이다(2026-08-04 금기). 차단이 아니라 경고로 둘지도 이 태스크가 판단한다: 오탐이 잦으면 습관화돼 소음이 되고 그 순간 보호는 상시 무력이 된다(fail-open 금기)"
  - "⑤ 변별력: 같은 paths를 가진 todo 2건을 합성해 수정 전 '겹침 없음'·수정 후 '겹침 1건'이 서로 다른 값으로 나오는지 실측한다. 양쪽에서 같은 값이면 검증이 아니라 위장이다"
  - "⑥ 범위 밖 명시: ID 번호 충돌(HARN-10 done·HARN-22 todo 소유 — 번호 축은 다른 문제) · 미머지 문서 탐지 접미어(HARN-25 소유·인플라이트) · 원격 인플라이트 스캔 확장(HARN-15 소유) · 제목·notes 유사도 기반 의미 중복 판정(이 태스크는 선언된 paths 축만 본다)"
