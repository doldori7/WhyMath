notes: "[2026-08-09 재조사] 원 소스 브랜치 claude/shadow-data-s3-pilot-nh5kbz가 origin에서 완전히 삭제됨(git fetch origin <브랜치명> → 'couldn't find remote ref', git ls-remote --heads origin 전체 43건 스캔에도 부재). 원 커밋 해시(fa08081·73b77a1·75c3dda 등) 직접 fetch도 전부 실패 — GitHub가 reachable하지 않은 SHA는 노출하지 않음. 즉 '원본 diff를 main 위에 수동 재적용'이라는 acceptance 전제 자체가 이제 불가능 — 실행 가능한 대안은 title/notes의 짧은 설명만으로 처음부터 다시 설계·구현하는 것뿐인데, 이는 '포팅'이 아니라 '재설계'라 원 기능의 정확한 범위·UX 디테일을 보장할 수 없다(디자인 판단 위험). 이 기능들을 그대로 재구현할지, 범위를 다시 정의할지, 혹은 지금 시점에 더는 필요 없다고 보고 폐기할지는 Kiki 판단이 필요 — /drive 안전장치(acceptance 판단 불가·모호성에서 정지)에 해당해 차단.
  [2026-08-10 전제 정정 — 원본은 접근 가능하다] 이 태스크의 acceptance를 '원본 diff 없음 → 재설계'로 쓴 것은 **내 오판이었다**. 원 브랜치가 origin에서 삭제된 것은 사실이나, 그로부터 git fetch가 실패한다는 이유만으로 '원본 접근 전면 불가'로 단정했고 다른 접근 경로를 시험하지 않았다. 실제로는 **GitHub API로 원 커밋에 완전히 접근된다**(repos/<owner>/<repo>/commits/<sha> — 메시지·파일목록, detail=full_patch로 유니파이드 diff까지). 2026-08-10 실측 확인했고, main도 #748에서 '회수 경로는 GitHub API 고정'으로 정본화했다. ⑧ 원NS-01 원 커밋 SHA: 224043f · 2e2587e. 따라서 이 항목은 '처음부터 재설계'가 아니라 **원본을 읽고 현재 main 위에 이식하는 회수**로 다루라 — 원본의 UX 디테일·테스트를 그대로 살릴 수 있다."
