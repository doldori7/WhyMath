artifacts:
  - "커밋(예정) — 교수법 DSL 선언≠집행 4축 판정(오케스트레이터 직접 코드 추적으로 판정 확정 후 위임, 서브에이전트 구현 + 오케스트레이터 독립 재검증).\n\n① mode_guard.check_forbidden_modes 집행 지점 — by-design 미배선 확정. 근거: /v1/coach(CoachResponse)는 LLM 생성 텍스트 필드가 아예 없어 검사할 응답 문면 자체가 없음, 실제 생성→서빙 경로(harness/wh1_primary.py, filter_tone 실배선)는 PedagogyPack을 전혀 참조하지 않음(전수 grep 0건) — 배선하려면 WH-1 루프 전체에 PedagogyPack 주입을 새로 도입해야 하는 별도 대형 작업. 완화 요인: 규칙 검출기를 가진 유일 모드(WORKED_EXAMPLE_FIRST)는 runtime_selector.forbids_worked_first가 이미 선택 시점에 사전 강등. config.py·l4/pedagogy/__init__.py·mode_guard.py 모듈 docstring에 판정·근거·완화요인·재검토조건(WH-1이 PedagogyPack 참조하게 되는 시점) 명문화. 오프라인 결함주입 측정(pedagogy_pack_fidelity_eval) 무변경 유지. 오케스트레이터가 mode_guard.py의 인용 오탈(§2-①→§2-⑤, 잘못된 절 참조)을 발견해 직접 정정.\n\n② pedagogy_pack DB 테이블 — 제거 배제, 유지+YAML↔DB 정합 감사 신설. blast radius 실측(서브에이전트가 test_pack_loader.py 7건·test_e2e_pedagogy_pilot_integration.py 전문 읽음): 후자는 step①에서 7팩을 DB에 쓰지만 step⑧ 런타임 조립(get_pack)은 YAML만 읽어 테스트 자기 자신도 쓴 값을 재조회 안 함(가장 강한 dead-write 증거). pack_registry가 'DB 무접근·순수 파일' 설계 경계를 문서화한 의도적 대체 — 완전 제거는 7테스트+E2E 구조 축소+compile.py CLI까지 연쇄돼 태스크 범위 초과로 판단. 신규 tests/backend/l1/test_pedagogy_pack_yaml_db_parity.py — schema.PedagogyPack.model_fields ↔ PedagogyPackORM 컬럼셋 상시 대조(하드코딩 스냅샷 없음, mapper 실시간 introspection).\n\n③ unit_spec DB 테이블 — ②와 겉보기 같은 패턴이나 서로 다른 근거로 같은 결론(유지+정합감사). 서브에이전트의 독자 발견: learning_objective가 복합 FK(unit_id, unit_version)로 unit_spec을 참조(CASCADE)하고 learning_objective 자체는 api/study.py·k_type_resolver.py가 실제 읽는 live 테이블 — unit_spec은 '고아 테이블'이 아니라 'live 테이블의 FK 부모'. 오케스트레이터가 db/models/pedagogy_dsl.py에서 ForeignKeyConstraint 직접 확인해 이 발견을 독립 검증 완료. 신규 tests/backend/l1/test_unit_spec_yaml_db_parity.py — 실 파일럿 코퍼스(units_v1/quadratic_maxmin.unit.yaml) 컴파일 결과의 행 dict 키와 UnitSpec/LearningObjective ORM 컬럼셋·PK-FK 정합을 상시 대조.\n\n④ api/scene.py↔api/visualization.py 오케스트레이션 미러(~40행) — 신규 api/_concept_orchestration.py로 공통분(Concept 로드→Overlay 조회→숙달도 라벨화→RoutingRequest 조립) 추출, 두 파일 전용분(behavior_areas/WH-1 프로브 vs is_visualizable 게이트)은 공유 안 함(과잉 추상화 회피). /v1/visualizations/*