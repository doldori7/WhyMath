acceptance:
  - "① 계정 유형 실측 선행 — kiki-s-broom이 실제로 Organization 계정인지 GitHub API(owner.type)로 확인한다. 이 세션은 cross-tier 제약으로 kiki-s-broom 저장소에 API 접근이 불가했다(add_repo가 \"cross-tier adds are not supported in v1\" 로 거부 — 세션당 단일 owner만 부착 가능). kiki-s-broom을 초기 소스로 하는 새 세션에서 GET /repos/kiki-s-broom/whymath 를 실행해 owner.type=Organization을 확정하기 전까지는, \"merge queue 큐잉등록 성공\"이 유일한 간접 근거임을 명시한다(간접 신호를 성공 판정으로 쓰는 안내 금지 축 — 반증 가능성 열어둠)."
  - "② 시크릿 이관 — doldori7/WhyMath에 존재가 확인된 시크릿(DEPLOY_SSH_HOST/USER/KEY/KNOWN_HOSTS/PATH, PR_AUTO_RESYNC_TOKEN)을 kiki-s-broom/whymath 저장소 Settings→Secrets and variables→Actions에 동일 이름으로 재등록한다. 값은 세션이 읽을 수 없으므로 Kiki가 직접 발급·등록해야 한다(기존 값 복사 불가 — GitHub는 시크릿 값을 재조회 허용하지 않는다)."
  - "③ 브랜치 보호/룰셋 재구성 — .github/branch-protection-setup.md에 문서화된 규칙(필수 상태 체크 목록·up-to-date 강제 등)을 kiki-s-broom/whymath main에 동일하게 재설정한다. 이번엔 merge queue 옵션이 실제로 화면에 있는지 먼저 확인하고(①의 조직 계정 확정과 연동), 있으면 활성화한다. HARN-82가 지적한 축(문서와 라이브 설정 불일치) 재발을 막기 위해, 설정 직후 라이브 조회 스크립트(pr_merge_readiness.py 등)로 required check 개수를 실측해 문서에 병기한다."
  - "④ CI 배선 확인 — kiki-s-broom/whymath에서 GitHub Actions가 활성화되어 있는지, ci.yml의 merge_group 트리거를 포함한 5개 워크플로(ci.yml·deploy.yml·branch-cleanup.yml·harness-audit.yml·pr-auto-resync.yml)가 실제로 발화하는지 1회 이상 실측 확인한다(성공 경로만 보고 설계하지 않기 — 실패 시 원인이 로그에 남는지도 확인)."
  - "⑤ 병렬 세션 좌표 — 이관 시점에 doldori7/WhyMath에서 진행 중인 다른 세션들(이 등재 시점 기준 EOS-63·HARN-56·HARN-82·HARN-86·HARN-87·MGMT-06·MP-02 claim 중)의 작업이 두 저장소로 갈라지지 않도록 컷오버 시점을 정하고, 컷오버 전후로 미러링(강제 동기화 또는 일시 정지) 절차를 문서화한다. 이관 도중 커밋이 갈라지면 회수 비용이 이번 사고 이력(미병합 고립 4회차 등)과 같은 유형이 된다."
  - "⑥ 정본 참조 갱신 — README·CI 배지·docs 내 저장소 URL 등 doldori7/WhyMath를 정본으로 지칭하는 참조를 kiki-s-broom/WhyMath로 갱신한다(코드 변경은 이 세션이 PR로 낼 수 있는 범위 — 설정 자체는 Kiki 실행)."
  - "⑦ 구 저장소 처리 방침 — doldori7/WhyMath를 아카이브할지, 리다이렉트 안내만 남길지 Kiki가 결정하고 기록한다."
  - "⑧ 이 태스크의 실행 범위 한계 명시 — 착수 세션은 kiki-s-broom을 초기 소스로 하는 새 세션이어야 한다(cross-tier 제약 실측 완료 — ①에 근거 병기). doldori7/WhyMath에 고정된 세션에서는 준비 문서·백로그 등재까지만 가능하고 실제 push/PR/설정 집행은 불가하다."
  - "⑨ [2026-09-09 정정] 이 태스크 등재 시점에는 kiki-s-broom/whymath를 doldori7/WhyMath의 별도 복사본으로 오인해 acceptance ②③에 '시크릿 재등록'·'브랜치 보호 재구성'을 적었다. 이후 이 브랜치를 kiki-s-broom/WhyMath로 push하자 GitHub가 'This repository moved'를 응답했고, 브랜치·claim 이력이 doldori7 쪽과 완전히 동일함을 실측 확인했다 — 즉 별도 복사본이 아니라 GitHub 저장소 전환(Transfer repository)이다. GitHub 저장소 전환은 시크릿·브랜치 보호 룰셋·webhook·Actions 설정을 저장소와 함께 자동으로 옮긴다(GitHub 표준 동작). 따라서 acceptance ②③은 '재등록/재구성'이 아니라 '자동 승계가 실제로 됐는지 1회 실측 확인'으로 범위를 좁혀 수행한다 — 확인 결과 누락된 항목이 있을 때만 그 항목을 추가로 등록한다."
  - "⑩ **①③④ 실측 완료 · ⑥의 실행 표면 축 착지 (2026-09-10 · PR #1063 세션)** — 나머지는 Kiki 결정이라 이 세션이 닫지 않는다.\n\n[① 계정 유형 — 답변됨] `owner.type=Organization`(GitHub 검색 API 응답 `\"type\":\"Organization\"` · org id 326699881). ⑧이 \"kiki-s-broom을 초기 소스로 하는 새 세션이어야 한다\"고 적었으나 **그 전제는 부분적으로 틀렸다** — doldori7 스코프 세션에서도 REST는 리다이렉트로 도달하고 git push도 된다(실측: 이 브랜치가 그렇게 push됐다). 거부되는 것은 GraphQL(리뷰 스레드 resolve)과 프록시 경유 raw curl뿐이다.\n\n[③ 브랜치 보호 — 승계 확인 + merge queue 활성] `PUT /pulls/1063/merge` → 405 `Repository rule violations found: A conversation must be resolved before this pull request can be merged / Changes must be made through the merge queue / All comments must be resolved`. 즉 룰셋이 승계됐고 merge queue가 실제로 켜져 있다. merge queue 전제 재판정은 HARN-98(착지 · PR #1078)과 HARN-56이 소유한다.\n\n[④ CI 배선 — 확인] `GET /actions/workflows` 총 5건 전부 state=active. 실발화도 관측 — pr-auto-resync run #16(schedule · success), harness-audit run #293(push · actor=github-merge-queue[bot]), CI가 PR #1063에서 체크 18건 정상 생성.\n\n[⑥ 정본 참조 — 실행 표면 축만 착지] 워크플로 인자·도구 코드·런북 문자열은 HARN-02가, GitHub API 리다이렉트 미추종 5곳은 HARN-03이 해소했다(둘 다 PR #1063). **이름을 새 owner로 바꿔 적지 않고** `$GITHUB_REPOSITORY`·`repos/{owner}/{repo}` 자기서술로 바꿨다 — 다음 이관에서 같은 사고를 예약하지 않기 위해서다. 전수 가드 = tests/infra/test_canonical_repo_reference.py. README·배지·docs URL 축은 **미착수로 남는다**.\n\n[② 시크릿 — 4/5] PR_AUTO_RESYNC_TOKEN 승계는 확인(pr-auto-resync가 fail-closed 설계인데 run #16까지 success). **DEPLOY_SSH_HOST/USER/KEY/KNOWN_HOSTS/PATH는 미실측** — deploy.yml이 수동 승인이라 이관 후 실행 이력이 없어 확인 경로가 없다.\n\n[남는 축 — 전부 Kiki 결정] ② DEPLOY_SSH_* 실측(배포 1회 또는 저장소 설정 화면 확인) · ⑤ 병렬 세션 컷오버 좌표 · ⑦ 구 저장소(doldori7/WhyMath) 처분 방침. 그래서 이 태스크를 done으로 닫지 않고 blocked로 되돌린다 — 실측으로 끝낼 수 있는 축은 위에서 끝냈다."
