artifacts:
  - "커밋(예정) — 번호 가드 파서·제안기·reap 분류기 3건 결함 수정(HARN-15 형제).\n\n① id_number_of 슬러그 없는 ID 파싱: _ID_NUMBER_RE를 '^([A-Za-z][A-Za-z0-9]*-\\d+)-'에서\n'^([A-Za-z][A-Za-z0-9]*-\\d+)(?:-|$)'로 수정 — 캡처 그룹 뒤에 슬러그(-...)가 오거나 문자열이\n거기서 끝나도 매치. 신규 tests/harness/test_id_number_parser.py(16건 파라미터화 테이블) —\nTASK_ID_RE가 허용하는 전 형태(슬러그 유/무·접두 1~8자·다단 슬러그)와 규약 밖 ID(빈 문자열\n등은 여전히 None)를 실증.\n\n② _next_free_number 99 상한: index가 99를 초과하면 3자리 형식위반 ID를 내지 않고 None 반환\n→ cmd_add가 '프리픽스 소진, 새 프리픽스로 분리 등 사람 결정 필요'를 명시적 오류로 안내.\n시그니처 애노테이션을 dict[str, str](거짓)에서 Mapping[str, tuple[str, str]](실제\n_taken_id_numbers 반환 타입)로 정정. 신규 tests/harness/test_next_free_number_format_guard.py\n(6건) — 경계값(98/99/100+)·cmd_add 종단 오류 메시지 실증.\n\n③ reap task_missing 경합 조건: stale_claims가 task is None일 때도 ttl 분기와 동형으로 claim\n나이(c.ts)를 본다 — TTL 이내면 task_missing_recent(reap 대상 아님, 경고만), ts 없음/파싱\n불가면 보수적으로 task_missing_recent(기존 ttl 분기의 '파싱 불가는 판정 보류' 관례와 동형),\nTTL 초과면 기존대로 task_missing(정상 정리 유지). reap()이 3-tuple(reaped, status, warnings)\n반환하도록 확장, cmd_claims가 경고를 침묵시키지 않고 출력. tests/harness/test_remote_claims.py\n기존 3건 갱신(TTL 초과로 명시) + 신규 TestTaskMissingRecentRaceGuard 2건(bare_remote 실제\n원격으로 방금 생성된 claim 생존 vs 오래된 claim 정리 양방향 실증).\n\n검증(오케스트레이터 독립 재실행 — 서브에이전트가 자체 Monitor 대기 루프에 갇혀 최종 보고를\n못 내 직접 코드 리뷰+뮤테이션 재검증 수행): 3개 뮤테이션 전부 cp 백업/복원으로 확인\n(id_number_of 정규식 원복·_next_free_number 99상한 제거·stale_claims 나이판정 제거 각각\n관련 테스트 red, 원복 후 green 및 git diff --stat 규모 일치). tests/harness 300 passed(기존\n282+신규 18) · ruff/black(scripts tests/harness, CI 동일 대상) 전부 EXIT=0 · backlog.py\nvalidate green(236건) · 전체 스위트 tests/backend+tests/infra 9570 passed·302 skipped·0\nfailed(663초·EXIT=0, 1차 시도는 환경 중단(exit 144·무관한 테스트 실패 0건)으로 재시도).\n\n⑤ 범위 밖 준수: HARN-15가 이미 완료한 원격 브랜치 관측 표면 확장은 손대지 않음.\n\n정직한 잔여: GitHub Actions 러너 실제 실행 미측정(로컬 동형 재현까지) · task_missing_recent를\ncmd_claims reap의 dry-run이 아닌 실제 --apply 흐름에서 반복 호출 시 경고가 계속 재노출되는\n사용성(같은 claim이 매번 경고로 뜸)은 설계상 의도(진짜 사라질 때까지 침묵하지 않음)이나 별도\n억제 메커니즘은 만들지 않음."
