  - "① 정규식을 읽는 지점 전수 열거: TASK_ID_RE(models.py:109)와 같은 형식 가정을 쓰는 곳을 하네스 CLI·selector·CI 스크립트·문서 링크 생성기까지 전수로 찾아 목록화한다. 부재 판정은 역할 기반 검색으로 하고 내가 찾은 방법으로 0건이면 범위를 밝혀 적는다\n② 방향 결정과 근거 기록: 자릿수 확장 / 접두사 분할 / 안전한 공백 재사용 중 하나를 고르고 왜 나머지를 버렸는지 MEMORY 결정 로그에 남긴다. 자릿수 확장을 고를 경우 EOS-43과 EOS-100이 공존할 때 정렬·파싱이 깨지지 않음을 테스트로 동결한다\n③ 실패 주입 검증: 상한 도달 상태와 공백 재사용 시도를 실제로 주입해 CLI가 의도한 대로 거부하거나 안전한 번호를 제안하는지 확인한다. 정상 입력에서 통과하는 것은 보호의 증거가 아니다\n④ 공백 재사용 경로를 만들 경우: 그 번호가 과거 문서·커밋에서 참조된 적 있는지 자동 검색해 0건일 때만 제안한다. 사람이 눈으로 고르는 경로는 ARCH-13·OPS-15 사고의 재생산이다"
  - "④ [승계 2026-09-10 · 병합 충돌 실측] 번호 공간이 좁아지면 **충돌이 실제로 난다** — 그리고 해소 경로가 없다. 실측: `claude/status-38gu4d`에 main을 병합하니 `HARN-97`이 두 태스크(main의 이 태스크 · 그 브랜치의 취소된 `HARN-97-org-transfer-identifier-drift`)에 배정돼 `backlog.py validate` exit 1. 두 태스크는 **서로 다른 브랜치에서 각각 `add`**됐고 그 시점에 상대는 trunk에도 원격 claim 대장에도 없었다 — 번호 충돌 검사(HARN-10)는 조회 가능한 것만 보므로 인플라이트 브랜치의 `add`는 구조적으로 못 본다. 그러므로 ①·②를 어떻게 결정하든 **브랜치 간 동시 add**는 남는 축이다. 이 축에 대해 두 가지를 acceptance에 편입한다: ⓐ validate의 remedy 문면이 \"다음 빈 번호로 개명하라\"인데 `backlog.py`에 **rename 서브커맨드가 없다** — 고칠 수 없는 위반을 지적하는 거부는 사람이 손편집으로 우회하게 만든다(CLAUDE.md \"거부의 우회 금지\"가 막으려는 상태를 하네스 자신이 유발한다). rename을 열든, 병합 충돌 해소 절차를 문서로 못박든, 둘 중 하나를 집행 지점으로 정한다 ⓑ 해소 시점에 `HARN` 접두사는 **99개 중 97개 사용 중**이었다(빈 번호 `75`·`77`뿐). 즉 상한 도달은 ARCH·EOS만이 아니라 HARN에도 이미 왔다 — ①의 전수 열거에 HARN을 포함하고, ②의 방향 결정은 \"지금 당장은 막히지 않는다\"는 전제를 **재확인한 뒤**에 한다. 그 사고에서 취소된 중복 태스크 쪽을 접은 판단 근거와 승계 축 3건은 MEMORY 2026-09-10 결정 로그에 있다."
