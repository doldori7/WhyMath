notes: "[실측 2026-09-09 · 판정 기준 main 94d1f28a] 태스크 ID 정규식이 models.py:109에서 2자리 숫자만 허용한다: ^[A-Z][A-Z0-9]{0,7}-\\d{2}(-[a-z0-9]+(-[a-z0-9]+)*)?$ . 그래서 접두사당 최대 99개이며, 전수 집계 결과 ARCH(최대 99)와 EOS(최대 99) 두 접두사가 상한에 도달했다. EOS-100을 add하려다 형식 위반으로 거부당해 발견했다.\n\n[지금 당장은 막히지 않는다] 두 접두사 모두 중간 번호에 공백이 있다(EOS는 61개 사용·38개 공백). 이번 세션은 EOS-43(저장소 전수 검색 참조 0건 확인)으로 우회 등재했다. 그러나 공백 채우기는 위험이 따른다 - 과거에 쓰였다가 삭제된 번호를 재사용하면 문서·커밋의 참조가 결정 불가가 된다. ARCH-13·OPS-15 중복 배정 사고와 같은 축이다.\n\n[정정 방향 후보] ①정규식을 \\d{2,3}으로 확장(과거 ID 전부 그대로 유효·상한만 올라감) ②접두사 분할(EOS를 도메인별로 쪼갬) ③공백 재사용을 CLI가 안전하게 제안(과거 참조 전수 검색을 자동화해 0건일 때만 제안). ①이 가장 싸지만 자릿수 혼재(EOS-43 vs EOS-100)가 정렬·파싱에 주는 영향을 확인해야 한다 - 하네스 CLI·selector·문서 링크·CI 스크립트에서 이 정규식을 읽는 지점 전수를 먼저 세어야 한다.\n\n[왜 지금 등재하나] 상한 도달은 조용한 실패가 아니라 exit 1로 즉시 드러나므로 급하지 않다. 다만 그 순간 세션은 우회 번호를 고르게 되고, 그 선택이 검증 없이 이뤄지면 중복 배정 사고가 된다 - 우회가 관행이 되기 전에 정본 경로를 만든다.\n\n[정정 2026-09-10] 브랜치 간 동시 add로 실제 번호 충돌 발생 — rename 경로 부재와 HARN 접두사 상한 도달(97/99)을 이 태스크의 축으로 편입(MISC-29 세션 실측)"
