id: HARN-30-pr-delivery-state-observability
title: "PR 배송 상태 미관측 — 체크런 0건·미머지 PR이 조용히 방치되고, get_status는 이 저장소에서 항상 0을 낸다"
track: infra-debt
stage: S4
subject: cross
layer: infra
status: done
priority: 2
owner: claude
depends_on: []
requires_gates: []
acceptance:
  - "① 무변별 신호 명문화 — mcp__github__pull_request_read method=get_status는 이 저장소에서 **모든 PR에 total_count: 0**을 반환한다(commit status API이고 이 저장소는 check runs를 쓴다). 실측 대조: 체크런 16건이 확실한 PR #773조차 get_status는 0. 세션이 'CI가 안 돌았다'고 오판하는 경로이므로 판정에 쓰지 말 것을 build_harness.md(또는 CLAUDE.md 프로세스 금기)에 등재하고, 대신 쓸 신호(get_check_runs / actions_list 브랜치 필터)를 함께 적는다 — 금지만 적고 대안을 안 적으면 다음 세션이 같은 함정에 다시 걸린다"
  - "② 실제 미발화 사례 원인 규명 — PR을 열었는데 체크런이 0건인 상태가 실재한다(실측: PR #779가 57분간 0건이었고 origin/main 병합 푸시로 해소 · #751 whymath-webpage-plan은 1일 넘게 0건). ci.yml의 on.pull_request는 선언돼 있으므로 원인을 실측 규명한다 — 앱 토큰 유래 PR open 이벤트의 트리거 억제인지, Actions 큐 지연인지, 다른 것인지. **추론으로 등재하지 말 것**(이 태스크의 등재 근거 자체가 첫 가설이 반증된 데서 나왔다)"
  - "③ 관측 좌석 — 세션 브리핑 또는 harness CLI가 '이 계정 열린 PR 중 체크런 0건'과 '체크런 green인데 미머지'를 구분해 노출한다. 두 상태의 처방이 다르다(전자=트리거를 깨워야 함, 후자=사람 결정 대기). 미해결 브랜치 스캐너(2026-08-11 #785가 결함 4종 수정)와 **다른 축**이다 — 그건 브랜치를, 이건 PR 배송을 본다"
  - "④ HARN-23과의 경계 — HARN-23은 done 시점에 PR *참조*가 있는지만 보고 acceptance ⑥에서 'PR 실재 검증은 범위 밖(망각을 막지 위조를 막지 않는다)'을 명시했다. 이 태스크는 위조가 아니라 **배송 실패**(PR은 진짜인데 CI가 안 돌거나 머지가 안 됨)를 본다. HARN-23의 미채택 근거였던 'GitHub API 조회는 오프라인·프록시에서 fail-open'을 어떻게 다룰지 판정한다 — fail-open이면 상시 무력 보호가 되므로(CLAUDE.md 2026-07-27 금기) 조회 실패를 '측정 실패'로 보이게 하거나 좌석 자체를 포기하거나 둘 중 하나를 명시 선택한다"
  - "⑤ 변별력 양방향 — 체크런 0건 PR과 체크런 green PR 양쪽에서 서로 다른 신호가 나는지 실측. 한쪽에서만 확인하고 통과 선언 금지"
  - "⑥ 범위 밖 동결 — 남의 세션이 연 PR을 대신 밀어붙이지 않는다(관측·노출까지) · ci.yml 트리거 변경(workflow_dispatch 추가 등)은 원인 규명 전 채택 금지 · 브랜치 삭제·회수 축(#785 소유)"
  - "⑦ [실측 2026-08-31] ① 완료 — get_status 무변별을 build_harness.md 금기로 등재하고 대안 신호 3종(check-runs API·actions/runs?head_sha·MCP get_check_runs)과 전수 점검 도구를 함께 적었다. 재확인: 체크런 16건 PR에서도 get_status는 total_count 0."
  - "⑧ [② 원인 미확정 — 정직 기록] 이 브랜치 커밋 22건 중 11건에 실행이 생성되지 않았다. **반증한 가설 3종**: ⑴ 워크플로 파일 스코핑 — 전 워크플로 조회로도 0건(ci.yml 한정 아님) ⑵ 동시 실행 한도 — 미발화 시점 동시 실행 0·3·4건, 발화 시점 0·0·4건으로 **상관 없음** ⑶ 체크런 보고 지연 — 수 시간 뒤 재조회도 0건. 남은 후보는 GitHub 측 이벤트 전달 누락이며 저장소 감사 로그 권한이 없어 확인 불가다. **추론으로 등재하지 않는다**(태스크 자체 규칙) — 원인은 미확정으로 남기고, ③의 관측 좌석으로 증상을 상시 노출하는 것으로 대응한다."
  - "⑨ [③④⑤ 완료] 관측 좌석 = scripts/ops/pr_delivery_audit.py. NO_CHECKS/REQUIRED_FAILING/REQUIRED_PENDING/CONFLICT/BEHIND/READY_UNMERGED 6상태를 **처방과 함께** 노출(상태만 주면 다음 세션이 다시 판단해야 하고 그 판단이 이 태스크가 고치려는 오판 지점이다). ④ fail-open 판정: 조회 실패는 '이상 없음'이 아니라 **측정 실패**로 exit 1 — 필수 체크 0건 조회도 측정 실패로 처리한다. ⑤ 양방향 동결 = tests/infra/test_pr_delivery_audit.py 10건 + 뮤테이션 5종 전건 검출(O1은 최초 생존 → required 빈 엣지로 변별력 강화)."
