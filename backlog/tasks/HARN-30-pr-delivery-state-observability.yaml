notes: "발견 경위: AI 튜터 r2 PR #779가 auto-merge(SQUASH)를 걸었는데도 57분간 머지되지 않아 조사. 체크런 0건이었고 origin/main 병합 푸시로 CI가 발화(0→1)해 해소·머지됐다. 조사 중 처음 쓴 신호(get_status)가 이 저장소에서 무변별임을 대조로 발견 — 체크런 16건인 #773에서도 0을 낸다. 첫 가설('MCP 앱 토큰으로 연 PR은 CI가 영영 미발화')은 전수 확인에서 **반증**됐다: 미머지 브랜치 18건 중 CI 미발화는 1건뿐(ADMIN-02 #734, 현재 blocked로 파킹)이고 8건은 PR 미생성·8건은 PR 닫힘이었다. 그래서 이 태스크는 '만성 미머지의 근본 원인'이 아니라 **드물지만 무증상인 배송 실패 + 그것을 오판하게 만드는 도구 함정**으로 좁혀 등재한다. 브랜치 축 판정은 docs/reviews/unmerged_branch_verdict_2026-08-11.md(#785)가 소유.\n\n[정정 2026-08-31] ① 등재 · ② 가설 3종 반증 후 미확정 기록 · ③④⑤ 도구·테스트 착지"
