  - "① 라우터→provider 호출 경로에 seed를 실제로 스레딩한다(Ollama options.seed 등) — 좌석(GenerationLog.seed BigInteger·EOS-55 착지)은 이미 있고 값이 전무한 상태의 해소. 스레딩이 구조적으로 불가한 provider가 있으면 그 사실을 경로별로 명시하고 NULL을 유지한다(날조 금지·EOS-55 정직 원칙 승계)"
  - "② '작동한 비율' 보고: seed 적재율을 경로별(pregenerate·accumulate)로 산출해 리포트가 말하게 한다 — 좌석 실재≠적재를 200 응답으로 오인하지 않기 위함. 분모 0은 0%가 아니라 '측정 불가(분모 0)'로 렌더(EOS-57 reach_report 선례)"
  - "③ 결정론 재생성 계약 테스트: 같은 seed·같은 input_snapshot 재투입이 같은 출력을 내는지 동결. 모델이 비결정적이라 성립하지 않으면 그 사실 자체를 측정으로 남기고 계약을 '재현 불가 자인'으로 축소한다(성립하지 않는 계약을 통과로 위장 금지)"
