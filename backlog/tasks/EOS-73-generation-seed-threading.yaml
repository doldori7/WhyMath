notes: "출처: HARN-38 ① EOS-50 중복 대조의 *잔여분*(docs/reviews/eos_number_collision_root_cause_2026-08-31.md §6-2). 원 EOS-50-generation-log-prompt-seed(kiki 머신 브랜치 2026-08-26 등재)의 acceptance 3항을 main EOS-55(done·#912) 착지분과 전수 대조한 결과 ①③은 완전 흡수(EOS-55가 오히려 더 강하게 — 해시가 아니라 prompt/system 전문 저장), ②만 부분 미이행이라 그 잔여만 승계 등재한다. 실측 근거: provenance_bridge.py:151-152·prewarmer.py:117이 'seed 스레딩이 없어 기본 None' 자인 · db/models/provenance.py:173 주석 '현행 두 경로는 seed 미사용=NULL' · 백로그 전수 검색 결과 이 잔여를 소유한 태스크 부재. 원 EOS-50 ②가 함께 요구한 'DSL 생성 경로 적재'는 전제 무효 판정 — l3/dsl은 라우터·프로바이더 import 0건의 결정론 컴파일러라 LLM 호출 자체가 없어 GenerationLog 대상이 아니다(variable_engine.generate(seed=)는 변수 바인딩 난수 seed로 별개 축). prompt 축은 이미 실적재된다(llm_generator.py:585 _prompt_version() 자산 내용 해시) — 미이행은 seed 축 하나. 병렬 세션은 이 잔여를 등재하지 않았다(그쪽 브랜치 EOS-71/72 2건뿐) — 이 태스크는 본 세션 고유분이다. [재번호 2회] EOS-71→EOS-72→EOS-73: 병렬 세션의 EOS-71·EOS-72 선점을 CLI가 연속 실거부해 제안 번호를 채택했다."
