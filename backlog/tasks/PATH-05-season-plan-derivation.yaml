  - "①GET /v1/me/season-plan 신설 — 파생·읽기 전용. 주 입력은 PATH-06 진도율(국면 판정), 보조 입력은 PATH-04 코퍼스(회차 안내)·target_exam_date. 출력 = 현재 국면(진도율 밴드) + 범위 배분(성취기준 코드 집합) + 우선순위 + 다음 회차 안내. study_plan 테이블·마이그레이션 신설 0을 리뷰 게이트로 확인(§2-④ 경로는 상태가 아니라 파생)"
  - "②배분 규칙은 신규 알고리즘 0 — 약점 우선 + 선수 위상 순서로 order_learning_path(PATH-01 통합 좌석)를 국면별 범위로 스코프해 재사용"
  - "③★반게임화 동결 — 잔여 일수를 카운트다운·초조 연출·독촉에 쓰지 않음(00_index.md:41). 회차 안내가 카운트다운으로 변질되지 않음을 테스트로 동결. 점수·등급·합격 예측 필드 부재(§2-②) + 또래비교·백분위 필드 부재(§2-⑩) + 학년 라벨 학생 대면 부재(PATH-06 표현 규칙 승계)"
  - "④내신 구간(4월·6말~7월)은 range_scope 빈 상태를 정직하게 노출 — 차원 6 데이터 부재를 가짜 배분으로 덮지 않음"
