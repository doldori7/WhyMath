notes: "발견 경위(2026-09-03): HARN-56 acceptance ①(룰셋 실측)을 Kiki가 실행하자 부수적으로 드러났다. 라이브 required_status_checks가 **6건**인데 문서 REQUIRED_CHECKS 블록은 **16건**을 선언한다 — 미강제 10건: changes / **backend — lint·type·test** / mobile / concept-reach / web / **infra-contracts** / docker-build / **harness-integrity** / declared-unwired-audit / corpus-authoring. 승인 축도 어긋난다(문서 '최소 1명·stale dismiss·CODEOWNERS' vs 라이브 required_approving_review_count=0·dismiss_stale=false·code_owner=false). strict_required_status_checks_policy=true·required_review_thread_resolution=true·required_linear_history=true는 문서와 정합.\n\n**같은 계급 3회차다.** (1)2026-07-26: 문서가 3종만 나열하고 backend lint 누락 → PR #606이 1 failed로 머지·main red. (2)같은 실측에서 그 3종조차 enforcement_level=off·checks=[]로 통째 미강제(OPS-08). (3)이번. 매번 같은 잡(backend — lint·type·test)이 빠진다.\n\n**왜 기존 방어가 못 잡았나 — 이것이 이 태스크의 핵심**: test_required_checks_doc.py는 '문서 ↔ ci.yml'을 동결한다. 두 축 다 **저장소 안**이다. 라이브 GitHub 설정은 저장소 밖이라 어떤 테스트도 보지 않는다. 즉 문서가 완벽하고 ci.yml이 완벽해도 **설정이 비어 있으면 전부 통과**한다 — CLAUDE.md '검증 장치를 만들고 배선 확인 없이 완료 선언 금지'의 저장소 경계 밖 변형이다.\n\n**새 사실**: 문서는 'Branch Protection API는 이 토큰으로 접근 불가(Resource not accessible by integration)'로 기록하나, **Kiki 토큰의 gh api repos/.../rules/branches/main 은 EXIT=0으로 읽힌다**(2026-09-03 실측). 즉 자동 탐지의 읽기 경로가 존재한다 — 다만 그 토큰이 CI에 없으므로 '조회는 사람·판정은 기계' 분업이 현실적 설계다.\n\n시정 자체(체크 10건 등록·승인 수)는 게이트 G-required-checks-live-drift-fix[kiki]. 이 태스크는 **재발 탐지**를 소유한다 — 시정만 하면 4회차가 온다.\n\nHARN-56과의 관계: merge queue가 검증할 체크 집합은 라이브 required 집합이다. 지금 켜면 큐가 **6건만** 검증한다. HARN-56 (2)는 시정 후의 16건을 기준으로 해야 한다."
