acceptance:
  - "① 드리프트 탐지기 신설 — 'gh api repos/doldori7/WhyMath/rules/branches/main' 출력(JSON)을 입력으로 받아 문서 REQUIRED_CHECKS 블록과 대조하고 exit 0/1로 판정하는 CLI를 만든다. **입력은 파일 경로로 받는다** — 샌드박스·CI에는 관리자 토큰이 없어 스스로 조회할 수 없다(2026-07-26 문서가 'Resource not accessible by integration' 실측 기록). 조회는 Kiki가, 판정은 기계가 한다는 분업이 이 태스크의 설계 전제다"
  - "② strict 정책·승인 수도 함께 대조 — required_status_checks 목록뿐 아니라 strict_required_status_checks_policy·required_approving_review_count·dismiss_stale_reviews_on_push·require_code_owner_review를 문서 선언과 대조한다. 2026-09-03 실측에서 승인 수도 어긋나 있었다(문서 '최소 1명' vs 라이브 0). 체크 목록만 보면 이 축을 놓친다"
  - "③ 변별력 실측 — 정상 JSON에서 exit 0, **결함 주입 JSON**(체크 1건 제거·strict를 false로·승인 수 0으로) 각각에서 exit 1임을 테스트로 동결한다. 정상 입력에서만 초록인 탐지기는 탐지기가 아니다(CLAUDE.md 2026-09-01). 특히 빈 목록·빈 JSON·필드 부재에서 '위반 0 통과'가 되지 않는지 확인한다"
  - "④ 실행 리듬 배선 — 이 탐지기가 *언제* 돌지 정한다. CI가 스스로 조회할 수 없으므로 자동 상시 실행이 불가능하다는 것이 정직한 제약이다. 후보: SessionStart 브리핑에 '마지막 룰셋 확인일 N일 경과' 리마인드 / 사람 게이트로 분기 1회 / done 게이트에 부착. 어느 것이든 '만들었지만 아무도 안 돌린다'가 되지 않게 집행 지점을 acceptance와 별항으로 명시한다"
  - "⑤ 문서 정정 — branch-protection-setup.md에 2026-09-03 재발 사실을 기록한다. **라이브에 맞춰 문서를 낮추지 않는다** — 문서는 의도이고 라이브가 결함이다. 또한 '이 토큰으로 API 접근 불가' 기술을 정정한다: Kiki 토큰의 gh api로는 읽기가 실제로 된다(2026-09-03 실측)"
