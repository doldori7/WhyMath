  - "범위 밖 동결 — ARCH-23(qa_pipeline의 continue-on-error 실제 제거)은 이 태스크가 대신하지 않는다. 이 태스크는 '강제 상태를 선언·감시하는 계약'만 만들고, qa_pipeline 스텝은 pending-task:ARCH-23으로 등재해 유예를 명시한다."
