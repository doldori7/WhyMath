  - "① 현행 실측 고정(2026-08-11 r2 §3 D5 재현·주장 확인 또는 반증): ProblemAttempt(db/models/activity.py:137-205)에 session_id는 있으나 **assessment_id 컬럼이 없다**(전수 grep). POST /v1/me/assessments/assemble(api/me.py:2869)은 AssessmentType.실전모의고사 행 + pattern_diagnosis JSONB(헤더 kind=blueprint_test_set 1건 + 문항 kind=blueprint_item N건)로 세트를 앉히고 completed_at=None으로 둔다. PATCH /assessments/{id}/complete(api/me.py:2481-2503)는 _close_owned_resource로 completed_at 시각만 갱신하고 결과 산출 코드 0. 백로그에 '시행·폐루프'를 소유한 태스크 0건. 반증되면 범위 재조정"
  - "② 정합 설계 본체 — 귀속 관측 리포트(신규 스키마 0·마이그레이션 0·엔드포인트 0): ASM-01 harness/assessment_seat_reach_report.py의 DB형 4단 분리를 답습(collect_*(AsyncSession 주입·ORM 쿼리빌더만) → build_report(순수) → render/json(정렬 고정) → main CLI(exit 0/2·게이트 아님)). 낼 것 = ⑴실전모의고사 행 수와 각 세트 선언 문항 수(pattern_diagnosis 헤더 파싱) ⑵세트 문항 id들에 대한 problem_attempt 존재 여부 ⑶**그 시도가 이 세트에서 나왔는지 판별 불가**를 unattributable 명시 상태로 표기 ⑷completed_at이 찍혔으나 결과 산출물이 0인 '빈 완료' 세트 건수 ⑸같은 청사진의 중복 세트 건수(ASM-04가 자인한 멱등 창 미설정의 실제 영향 — 0일 수도 있다)"
  - "③ 정직 표기: '귀속 0건'으로 적으면 '아무도 안 풀었다'와 구분되지 않는다 — 세트 문항에 시도가 있으나 귀속 판별이 불가한 상태를 별도 버킷으로 계상한다(ops/cost_probe 이중 회계 선례). pattern_diagnosis 헤더가 없거나 형태가 다른 행은 조용히 버리지 않고 별도 계상(조용한 유실 금지 — ARCH-18 3분류 관례)"
  - "④ 게임화 금기 하드 제약: 점수·등급·평균·표준편차·문항별 정답률·성취도 등급을 **산출하지 않는다**(v1 §2-① 승계·CLAUDE.md). 이 리포트가 내는 것은 성적이 아니라 분석의 *가능성* 여부다. 예측 5필드는 스키마상 이미 부재(ASM-07 봉인)이며 이 리포트도 읽지 않는다"
