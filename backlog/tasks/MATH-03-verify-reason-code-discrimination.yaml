acceptance:
  - "① 현행 무변별 실측 고정: 백엔드가 IdentityVerdict 4상태(symbolic_equivalence.py:123-130)를 VerifyStepState 3상태로 접고(verify_step.py:180) 자유문 reason만 남기며, 모바일이 steps를 아예 파싱하지 않아(coach_models.dart:330-332) 학생 화면에 '확인 보류 일부' 한 문장만 도달함을(coach_signal_card.dart:140-143) 재현한다. 손실이 두 군데(백엔드 접힘 + 클라 폐기)에서 일어남을 실측으로 분리한다 — 한쪽만 고치면 변별력이 회복되지 않는다"
  - "② 사유 코드 구조화(직교 필드): VerifyStepResult에 reason_code(폐쇄 enum) 필드를 추가한다. state 3상태는 불변 — 4·5상태로 늘리면 BKT·코치·집계·모바일 모델이 전부 흔들린다. step_type이 이미 직교 전파되는 것과 같은 패턴. [2026-08-11 재검증] 리포 내 선례가 생겼다 — l3/equivalent/rephrase.py:126,134가 reason_code(구조적 taxonomy) + reason(사람용 문장) 병렬 필드를 이미 실장했다(NS-04·QUAL-03, 2026-08-10 착륙). 그 필드 명명·직렬화 형태를 그대로 답습해 신규 패턴 발명을 0으로 만든다. 초안 7종: parse_error·undecidable·non_algebraic_step·empty_input·heterogeneous_form·subset_ambiguous·variable_mismatch — 전 분기가 이미 코드에 존재하므로 신규 판정 로직 0(라벨링만)"
  - "③ 클라 문구 분기 + 교수학 톤 제약: SolutionVerificationResult에 unverifiable_by_reason 카운트를 싣고(steps 전체는 싣지 않는다 — 정답 미누출 노출 계약 유지) 모바일이 3분기 문구로 표시한다. 고칠 수 있는 것(parse_error·empty_input)과 고칠 게 없는 것(non_algebraic_step)과 단정하지 않는 것(undecidable 계열)을 구분한다. 부정적 피드백 강화 금지·정답 미제공. 위젯 테스트로 동결(coach_signal_card_test.dart 확장) — NLP-01 acceptance ③ 동형 패턴. 운영용 7종과 학생 노출 3분기의 비대칭을 코드 주석에 명시한다(검증기 내부를 학생에게 노출하지 않는다)"
  - "④ 측정: unverifiable_by_reason 분포를 리포트에 노출한다. 이것이 '학생이 실제로 어디서 막히는가'의 첫 실측이며, parse_error 비중이 곧 MATH-01(표기 권위)과 자연표기 확장(math_engine_gap_review.md §5-③)의 발화 조건 데이터다. 분모 없는 0 금지 — '전이 N건 중 M건'으로 표시"
  - "⑤ 변별력: parse_error를 유발하는 입력과 non_algebraic_step을 유발하는 입력이 서로 다른 카운터·서로 다른 학생 문구를 내는지 실측한다. 성공/실패 양쪽에서 같은 값을 내면 검증이 아니라 위장이다 — 이 태스크는 정확히 그 위장을 고치는 것이므로 이 항목이 red면 태스크 자체가 실패다"
  - "⑥ 범위 밖 명시 + 불변식 동결: (a) 오류 위치(문자 오프셋) 지시는 별도 파서를 요구하고 그건 AST 5계층 축이라 범위 밖(math_dsl_part4_ast_review.md §① — 현 결정 하에서는 영구 유보에 가깝다). (b) parse_check_latex의 bool 계약은 바꾸지 않는다(assemble.py:56 OCR 신뢰도 강등 소비자가 bool을 쓴다). (c) VerifyStepState 3상태 불변과 BKT·evidence_weight 입력 경로 불변을 회귀 테스트로 동결 — 이번 슬라이스는 라벨 부착이지 판정 변경이 아니다. (d) reason_code는 '왜 판정 못 했는가'(검증 메타데이터)이지 ReasoningStep '이 단계가 어떤 추론인가'(도메인 모델)가 아니다 — 이 태스크는 D5를 앞당기지 않는다"
