acceptance:
  - "① 실패 재현 — 이관 후 harness-audit가 상시 red임을 실측으로 고정한다. 관측: run 34425627951(2026-09-10T01:28Z · event=push · main 28a90846 · actor=github-merge-queue[bot])의 잡 \"통합 흐름 진단\"이 `측정 실패 — 필수 체크 0건(규칙 미조회/권한 부족). 이상 없음이 아니다` + EXIT=1로 종료했다. 원인은 워크플로 156행이 옛 owner 리터럴을 인자로 넘기고(`pr_delivery_audit.py doldori7/WhyMath`), 도구의 curl에 `-L`이 없어 GitHub의 301 응답 본문(dict)을 규칙 목록(list)으로 파싱해 required가 공집합이 되는 것이다. 착수 시 스텁으로 301 응답을 주입해 같은 문구가 재현되는지 먼저 확인한다."
  - "② 저장소 지목을 자기서술로 교체 — .github/workflows/harness-audit.yml이 넘기는 인자를 리터럴 owner에서 `${{ github.repository }}`로 바꾼다. 같은 저장소의 pr-auto-resync.yml이 이미 그 방식을 쓴다(`REPO: ${{ github.repository }}`). 이렇게 하면 다음 이관에서도 자동으로 따라간다 — 이름을 새 owner로 바꿔 적는 것은 같은 사고를 한 번 더 예약하는 것이다."
  - "③ 원인 구분 — 도구가 리다이렉트를 따르게 하고(curl `-L`), 규칙 응답이 list가 아닐 때 \"필수 체크 0건\"으로 뭉개지 않고 HTTP 상태와 응답 본문 앞부분을 남긴다. 현행 문구는 서로 다른 원인 3종(저장소 이동 · 권한 부족 · 진짜 0건)을 같은 글자로 보이게 한다 — CLAUDE.md \"측정·수집 도구를 성공 경로만 보고 설계 금지\" ②(실패 원인이 남는가)의 위반이다. fail-closed 자체는 유지한다(조회 실패를 이상 없음으로 넘기지 않는 설계는 옳게 작동했다 — 그래서 이 사고가 보였다)."
  - "④ 런북 문자열의 정본 갱신 — scripts/harness/ruleset_drift.py·ruleset_pin_plan.py의 docstring이 Kiki에게 안내하는 gh 명령이 옛 owner를 가리킨다. 이 문자열은 사람이 복사해 실행하는 경로이므로(CLAUDE.md 실행용 블록 규칙) 정본으로 고친다. 경계: scripts/ops/pr_merge_readiness.py의 같은 성격 문자열은 HARN-82가 소유한 파일이라 손대지 않는다."
  - "⑤ 변별력 — 뮤테이션으로 각 수정이 실제로 보호가 되는지 확인한다. 최소 4종: ⓐ워크플로 인자를 리터럴 owner로 되돌린다 ⓑcurl의 `-L`을 제거한다 ⓒnon-list 응답의 원인 보존을 제거해 옛 문구로 되돌린다 ⓓ전수 스캔의 대상 수집을 0건으로 만든다(공허한 통과 검출). 각 주입은 적용 실재(`mutated != original`·치환 count)를 단언하고, 원복은 cp 백업으로 하며 바이트 동일을 확인한다(git 계열 원복 금지). 픽스처가 각 절을 실제로 밟는지도 확인한다 — 301 본문이 없는 픽스처로는 ⓑ가 살아남는다."
  - "⑥ 경계 명시 — 이 태스크는 실행 표면(워크플로 인자·도구 코드·런북 문자열)만 다룬다. HARN-96 ⑥(정본 참조 갱신)이 소유하는 docs·README·배지, CODEOWNERS의 개인 계정 지정, merge queue 전제 재판정(HARN-98·HARN-56), pr_merge_readiness.py(HARN-82)는 범위 밖이다. MEMORY.md·backlog·docs/reviews의 옛 owner 언급은 과거 사실의 기록이므로 고치지 않는다 — 이력을 현재로 덮어쓰면 판정 시점이 사라진다."
  - "⑦ **④·⑥의 경계 정정 — 파일 2개를 추가로 건드렸다(구현 중 판단 · 2026-09-10).**\n\n[무엇을] ⓐ scripts/ops/pr_merge_readiness.py 의 사용 예 1줄 ⓑ .github/workflows/pr-auto-resync.yml 의 헤더 주석 1문단.\n\n[왜 뒤집었나] ⑤가 요구한 전수 가드를 만들자 이 두 곳이 마지막 잔여물로 남았다. 남겨 두려면 가드에 면제를 넣어야 하는데, 만료 없는 면제는 이 저장소가 금지하고(CLAUDE.md \"만료 없는 유예·제외 금지\") 만료를 붙이면 아무도 안 고치는 유예가 하나 더 생긴다. 반면 두 곳 다 **사실 정정 1건**이지 판단이 아니다 — ⓐ는 사람이 복사해 실행하는 명령이 사라진 경로를 가리키던 것이고, ⓑ는 \"이 저장소는 개인 계정이라 merge queue를 쓸 수 없다\"는 **지금은 거짓인 서술**이다.\n\n[남의 몫은 건드리지 않았다] ⓐ에서 HARN-82가 소유한 축(필수 체크 6종 vs 16종 docstring)은 손대지 않았다. ⓑ에서도 merge queue 도입·재판정은 하지 않고, 실측 사실(owner.type=Organization · PUT /pulls/{n}/merge가 405 `Changes must be made through the merge queue`)만 병기한 뒤 재판정 주체를 HARN-56으로 명시했다.\n\n[대안을 왜 안 골랐나] \"새 owner 이름으로 바꿔 적기\"는 다음 이관에서 같은 사고를 예약한다. 그래서 워크플로는 `$GITHUB_REPOSITORY`, gh 런북 문자열은 gh가 현재 저장소로 치환하는 `repos/{owner}/{repo}/...` 형태로 바꿨다 — 이름을 쓰지 않는 것이 이 태스크의 요지다."
