acceptance:
  - "① UserProfile에 auth_provider·provider_subject 2컬럼(nullable) + (auth_provider, provider_subject) 유니크 — 신규 테이블 0. OAuthIdentity.subject(api/auth.py:102)가 현재 받아서 버려지는 상태의 해소. 마이그레이션 1건(백필 없음)."
  - "② resolve_user(api/auth.py:138) 조회 우선순위를 (provider, subject) → email_hash 폴백으로. 폴백으로 찾은 기존 사용자에게는 (provider, subject)를 채우고 email_hash를 현재 이메일로 갱신 → 다음 로그인부터 provider 이메일 변경이 계정을 끊지 않는다."
  - "③ 무중단 회귀 — subject가 없는 기존 행이 폴백 경로로 그대로 로그인되고, 같은 사용자가 두 번째 로그인에서 subject를 획득함을 동결."
  - "④ cross-provider 자연 연결 계약을 코드에 못 박는다 — '이메일을 검증하는 provider만 자연 연결에 참여한다'를 build_oauth_providers docstring + 동결 테스트로. 미검증 provider 추가 시 테스트가 먼저 깨지게 한다(계정 탈취 벡터 차단)."
  - "⑤ PII 축 무변화 동결 — provider_subject는 provider 내 불투명 id이고 이메일이 아니다. 평문 이메일 미저장(email_hash만)을 회귀로 유지."
  - "⑥ 범위 밖: 사용자 주도 이메일 변경 UI · 계정 병합(이미 두 계정이 생긴 경우) · 연구자 역할(r2 §2-①) · 휴면 계정 복구(v1 §2-⑧ 승계)."
