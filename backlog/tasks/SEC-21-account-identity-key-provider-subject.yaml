notes: "docs/architecture/account_security_gap_review_r2.md G1→D8. 실측: resolve_user(api/auth.py:138)가 email_hash(:132 sha256 소문자 이메일) 단일 키로 upsert하고, OAuthIdentity.subject(:102)는 docstring이 '후속 계정 연결용'이라 쓰는데 UserProfile에 provider·subject 컬럼이 0건이다(inkang_provider는 인강 업체명으로 다른 축). _SELF_EDITABLE(api/users.py:74) 16필드에 이메일이 없어 변경 경로도 0. v1 §2-③의 '비밀번호 찾기는 구조적 무해당' 판정은 옳았으나 그 판정이 전제한 '이메일 영구 불변' 가정이 검증된 적이 없다 — 소셜 계정 이메일이 바뀌면 신규 계정이 생기고 기존 학습 이력에 접근할 수단이 0이다(우선순위 1 학생 웰빙). 부수 위험: resolve_user docstring(:141)이 '같은 이메일=provider 무관 같은 계정'을 설계 의도로 선언하는데 OAuthIdentity에 email_verified가 없어 provider의 이메일 검증 여부가 계약에 없다.\n\n[정정 2026-09-01] eos_priority null → P2: 판정표 N/이월 — 2027 이월(폐기 아님·선언 §6-5). EOS-80 일괄 백필"
