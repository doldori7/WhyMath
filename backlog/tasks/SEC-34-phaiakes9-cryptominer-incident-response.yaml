notes: "발견 경위(2026-09-10): MP-02 첫 회차가 ROCm 4.07 GiB 할당 실패로 10/10 생성 실패했다. `/llm-perf-doctor` 카탈로그의 1순위 처방(고아 프로세스 정리)이 듣지 않아 배제를 4단으로 진행했고 — 고아 0건 · 컨텍스트 정상 · Pool Nonpaged 1.97 GB · WSL 종료 시 +1.9 GB뿐 — 커밋 326.4 GB인데 프로세스 366개 private 합이 19.4 GB라는 **격차**만 남았다. 그 시점 판정은 \"원인 미규명 · 재부팅\"이었고 실제로 재부팅으로 256.7 GB가 회복됐다.\n\n그러나 재부팅은 대증이었다. Kiki가 이어서 예약 작업을 점검해 `GoogleUpdateTaskSYSTEM`·`GoogleUpdateTask`가 보안 검사 예외 추가 · 외부 스크립트 다운로드·실행 · 채굴 의심 파일 실행을 하고 있었음을 확인했고, 종료 후 공유 커밋 약 152.8 GiB를 회수했다. **즉 성능 미스터리의 정체는 침해였다.**\n\n[왜 오래 안 보였나] 이 형태는 성능 문제로 위장된다 — 프로세스 목록에도 커널 풀에도 안 잡히고(공유 커밋), 증상은 \"메모리 부족\"이라는 엉뚱한 얼굴로 나오며, 재부팅하면 일시적으로 정상으로 돌아간다. 2026-08-22 기록의 \"커밋 235GB의 정체를 모른다\"가 같은 지문이었을 가능성이 높다 — 그렇다면 약 3주간 감염 상태로 운영된 셈이다.\n\n[우선순위 근거] CLAUDE.md 의사결정 우선순위상 ①학생 안전·웰빙 ②법적·윤리 준수가 성능·개발속도보다 앞선다. 이 태스크는 자격증명 로테이션과 학생 데이터 노출 판정을 먼저 두고, 탐지 배선을 마지막에 둔다.\n\n[정정 2026-09-10] 봉쇄 실측 확보 — 프로세스 종료 152.845 GiB 회수·자동실행 2개 비활성화 검증 완료, 잔여(백신·격리·보안예외 원복·로테이션) 명시\n\n[정정 2026-09-10] 선별 격리 13종 완료·검증 스크립트 실측 반영 — 위장 경로 구조와 검증 한계 명시\n\n[정정 2026-09-10] 격리 스크립트 코드 리뷰 — 설계 강점 10건 확인, MSERT 탐지 전용 인자 지적, 범위 밖 4건 명시"
