notes: "2026-09-09 발견 — Kiki가 '조직 관리자가 Claude GitHub App을 다시 설치함'을 알려 실측하다 이관을 확인. 이 세션은 API가 끊겨 등재만 하고 종료(Kiki 판단).\n\n[취소 2026-09-09] HARN-96-canonical-repo-migration-kiki-s-broom(priority 1 · claude/g-merge-queue-strict-relax-rm3cmc)과 중복 — backlog.py add의 의미 중복 탐지가 잡았고 실물 대조로 확인했다. HARN-96이 더 넓고(시크릿·룰셋·CI 배선·컷오버·구 저장소 처분) 우선순위도 높으며, 2026-09-09 정정항 ⑨에서 '별도 복사본이 아니라 Transfer'임을 이미 스스로 교정했다. 두 태스크를 나눠 두면 이관 작업이 갈라진다.\n\n[HARN-96으로 승계할 것 — 그쪽 acceptance에 없는 축 3건]\n① 동결 가드의 사각: tests/infra/test_pr_auto_resync.py:399-404가 `assert \"owner.type\" in text and \"User\" in text`로 branch-protection-setup.md를 동결한다. 문서를 아무도 안 고치면 **문서가 거짓이 된 뒤에도 GREEN**이다(문자열 존재만 검사). 반대로 문서를 Organization으로 고치면서 \"User\"를 지우면 그 단언이 RED가 되어 테스트 갱신을 강제한다 — 즉 이 가드는 부수적으로 이빨이 있으나, 아무도 손대지 않는 시나리오에서는 상시 무력이다. HARN-96 ③/⑥ 수행 시 이 테스트도 새 사실에 맞게 바꾸고, 바꾼 뒤 주입으로 RED를 확인한다.\n② ruleset_drift.py 튜플 편입: scripts/harness/ruleset_drift.py:291-294가 \"저장소가 조직으로 이관되면 그때 이 튜플에 merge_queue를 추가한다\"고 예약해 둔 트리거가 발동했다. .github/branch-protection-setup.md:318도 같은 문장이다. HARN-96 ③(merge queue 옵션 확인)과 연결되나 튜플 편입 자체는 그쪽에 명시돼 있지 않다.\n③ 실행 경로 하드코딩 8곳(문서 포함 156파일): scripts/ops/pr_merge_readiness.py:20 · scripts/ops/pr_delivery_audit.py:23 · scripts/harness/ruleset_drift.py:22,74 · scripts/harness/ruleset_pin_plan.py:15,20,22 · .github/workflows/harness-audit.yml:156. HARN-96 ⑥이 'README·배지·docs URL'을 다루나 실행 경로는 별도다. **미측정(단정 금지)**: gh api가 301을 따라가는지 이 세션은 확인하지 못했다(CI 실행 관측 불가) — 착수 세션이 먼저 실측하고, 따라가더라도 식별자는 정정한다.\n\n[미완 인계] PR #1075(반복 실수 3회차 규칙 등재 · CLAUDE.md v0.2.20)의 CI 결과·머지 상태를 이 세션은 확인하지 못했다 — API가 끊겨서다. 착수 세션이 먼저 확인한다."
