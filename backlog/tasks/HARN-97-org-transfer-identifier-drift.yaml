acceptance:
  - "① 실측 고정(2026-09-09): 저장소가 개인 계정에서 조직으로 이관됐다 — `doldori7/WhyMath` → `kiki-s-broom/WhyMath`, `owner.type` User → **Organization**, repo id 1237870848 동일(이관이지 신설 아님). 계기 = 조직 관리자의 Claude GitHub App 재설치. 실측 방법 = REST `repos/doldori7/WhyMath`가 301 Moved Permanently를 내고, 검색 API가 같은 id를 새 full_name으로 돌려준다. git(fetch·ls-remote)은 리다이렉트를 투명 처리해 정상 동작한다 — **git은 되고 API는 안 되는 비대칭**이 이 드리프트의 특징이다.\n② merge queue 가용성 전제가 뒤집혔다(설계상 예약된 재평가 트리거 발동): `scripts/harness/ruleset_drift.py:291-294`가 \"merge_queue는 의도적으로 여기 없다 — 조직 소유 전용이라 이 저장소(owner.type=User)에서는 켤 수 없다 … **저장소가 조직으로 이관되면 그때 이 튜플에 추가한다**\"라고 적어 둔 조건이 충족됐다. `.github/branch-protection-setup.md:318`도 같은 문장이다. 즉 이것은 사고가 아니라 **미리 못박아 둔 재확인 지점의 정상 발동**이다.\n③ 거짓이 된 산출물 전수: ⓐ `.github/branch-protection-setup.md:298-318` — `owner.type = User (개인 계정 doldori7)` 표가 사실과 다르다 ⓑ `scripts/harness/ruleset_drift.py:291-294` 미편입 근거 주석 ⓒ CLAUDE.md v0.2.18 \"가용성 확인 절차\" 규칙의 사고 경위 전제 ⓓ `docs/reviews/pr931_merge_block_root_cause_2026-08-31.md`. 각각을 정정하거나 \"2026-09-09 이관으로 전제 변경\" 단서를 병기한다.\n④ 동결 가드의 사각 — `tests/infra/test_pr_auto_resync.py:399-404`의 `assert \"owner.type\" in text and \"User\" in text`는 문서가 **거짓이 된 뒤에도 GREEN**이다(문자열 존재만 검사하므로). 세상이 바뀌어 문서가 틀려지는 축을 이 가드는 구조적으로 못 본다. 정정과 함께 이 단언도 새 사실에 맞게 바꾸고, 바꾼 뒤 **주입으로 RED를 확인**한다(정상 입력에서 초록인 것은 보호의 증거가 아니다 · CLAUDE.md 2026-09-01).\n⑤ 식별자 하드코딩 156파일 — 그중 실행 경로 8곳: `scripts/ops/pr_merge_readiness.py:20` · `scripts/ops/pr_delivery_audit.py:23` · `scripts/harness/ruleset_drift.py:22,74` · `scripts/harness/ruleset_pin_plan.py:15,20,22` · `.github/workflows/harness-audit.yml:156`. **미측정 사항(단정 금지)**: `gh api`가 301을 따라가는지 이 세션은 확인하지 못했다 — CI 실행을 볼 수 없어서다. 착수 세션은 그것부터 실측하고, 따라가더라도 문서·docstring의 식별자는 정정한다(따라가는 것과 옳은 것은 다르다).\n⑥ 세션 접근 경로 — 이 세션은 GitHub API가 끊겼다: 옛 이름은 301, 새 이름은 \"access not enabled for this session\", `add_repo`는 \"cross-tier adds are not supported … session already has repos from owner(s) [doldori7]\"로 거부. 해소 = `kiki-s-broom/WhyMath`를 **초기 소스로 하는 새 세션**. 이 사실을 `docs/standards/parallel_sessions.md` 또는 build_harness에 적어 다음 세션이 같은 벽에 부딪히지 않게 한다.\n⑦ 미완 인계 — PR #1075(반복 실수 3회차 규칙 등재 · CLAUDE.md v0.2.20)의 CI 결과·머지 상태를 이 세션은 **확인하지 못했다**. 열려 있는지 green인지 미상이다. 착수 세션이 먼저 확인한다.\n⑧ HARN-56과의 경계 — merge queue **도입 자체**는 `HARN-56-merge-queue-adoption`(in_progress · claude/status-f9lp65)의 몫이다. 이 태스크는 도입을 하지 않는다. 이 태스크의 범위는 *이관으로 거짓이 된 기록과 끊긴 배선의 정정*이며, 그 세션에 전제 변경 사실을 전달하는 것까지다. 게이트 `G-merge-queue-enable-ruleset`(waived)의 재판정도 HARN-56 쪽이다."
