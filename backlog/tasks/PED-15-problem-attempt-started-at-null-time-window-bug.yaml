acceptance:
  - "① 원인 실측 확인 — api/coach.py::_apply_completion과 api/me.py::submit_attempt 양쪽 다 ProblemAttempt.started_at을 채우지 않음(PED-14 조사 중 발견)을 재확인. duration_seconds가 채워지는 ended_at과 달리 started_at은 두 writer 어디서도 대입되지 않는다"
  - "② 영향 범위 확정 — wh1_evaluation.py의 accuracy_conds/calibration_conds/transfer 3개 쿼리 블록(R15 결합판정·⑥ Brier·⑦ 전이점수)이 since/until이 지정될 때만 ProblemAttempt.started_at >= / <= 로 필터한다. NULL >= X는 SQL에서 falsy라 시간창 지정 호출은 항상 0행(가짜 NO_DATA로 위장) — since/until이 둘 다 None인 기본 호출(현재 대부분의 실사용 경로로 추정)은 영향 없음을 실측으로 구분한다"
  - "③ 해법 후보 비교 — (a) 두 writer에 started_at 실제 대입(coach.py는 dialogue.started_at 이미 있어 자연스러움·me.py는 클라가 안 주면 서버 now로 폴백할지 결정 필요) (b) 이 3개 쿼리 블록만 PED-14 선례(ended_at 사용)를 따라 필터 컬럼을 ended_at으로 교체 — 둘 중 하나를 택하되 과거 이미 적재된 attempt 행의 started_at 백필 필요 여부까지 판단"
  - "④ 회귀 0 — R15/Brier/전이점수 기존 no-window(since=until=None) 호출 결과가 수정 후에도 동일해야 한다(전체 스위트로 확인)"
  - "⑤ 변별력 테스트 — since/until 지정 시 기존에는 0건이 나오던 케이스가 수정 후 정확한 건수를 반환하는지 assert(수정 전 상태를 재현하는 회귀 테스트를 먼저 추가해 실패시킨 뒤 고치는 순서 권장)"
