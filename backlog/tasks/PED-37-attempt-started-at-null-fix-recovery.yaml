acceptance:
  - "① 고립 실측 고정(2026-09-07 main 98925b0e): 원 태스크 PED-15-problem-attempt-started-at-null-time-window-bug(done)가 origin/claude/subject-problems-theory-check-7n9n72(621b11f9 · 구현 커밋 27faee2d)에만 존재하고 main의 PED-15는 다른 태스크(growth-evidence-endpoint-client-wiring)라 ID 충돌로 유실됐다. 버그는 main에서 생존 실측: api/coach.py::_apply_completion(ProblemAttemptORM 생성부·ended_at만 대입)·api/me.py::submit_attempt(ProblemAttempt 생성부·duration_seconds·ended_at만 대입) 두 writer 모두 started_at 미대입 · harness/wh1_evaluation.py가 ProblemAttempt.started_at으로 시간창 필터 8곳 · privacy/retention.py:80이 (ProblemAttempt, \"started_at\")을 파기 기준으로 사용 → since/until 지정 호출은 상시 0행, PII 보존기한 파기는 지금까지 0건. 재현: git grep -n 'ProblemAttempt.started_at' origin/main -- src/backend/whymath_backend/harness/wh1_evaluation.py"
  - "② 이식 방식 = 파일 단위(브랜치가 main보다 228커밋 낡아 통째 머지 금지 — NLP-04 선례). 원 번호 PED-15 재사용 금지(main에서 다른 태스크가 점유). 원 해법: coach.py는 dialogue.started_at 이관·me.py는 ended_at−duration_seconds 역산(클라 미제공 시 서버 now 폴백 여부는 원 acceptance ③ 결정 승계). 백필 없음. main의 현재 writer 구조(coach.py ProblemAttemptORM·me.py ProblemAttempt 생성부)에 맞춰 재적용하고 브랜치 diff를 그대로 붙이지 않는다"
  - "③ 집행 지점(정본화와 별항): 두 서빙 writer가 실제 요청 경로에서 started_at을 채우는지 통합 테스트로 증명 + 변별력 테스트 — since/until 지정 시 수정 전 0건이던 케이스가 정확한 건수를 반환(수정 전 RED를 먼저 재현한 뒤 GREEN). retention.py 파기 대상 산출이 started_at 기준으로 실제 행을 세는지 별도 assert"
  - "④ 회귀 0: no-window(since=until=None) 호출 결과 동일 + 전체 백엔드 스위트(부분 스위트 통과를 전체 통과 근거로 보고 금지). 소급 파기 여부는 코드가 아니라 Kiki 결정 — 게이트 G-attempt-retention-purge-backfill-decision(같은 감사에서 신설)이 소유하며 이 태스크는 그 결정을 기다리지 않는다"
  - "②-a 시각 귀속 정정(PR #1020 codex P2 — ② 원 해법 중 me.py 축을 대체한다): ended_at−duration_seconds 역산을 쓰지 않는다. 실측(main 96790b46): api/me.py:754가 ended_at=datetime.now(UTC)로 **수신 시각**을 넣고 AttemptSubmitRequest(:647)에는 started_at·ended_at 필드가 아예 없다(duration_seconds만). 따라서 역산 결과는 '발생 시각'이 아니라 now−duration = **업로드 시각 기준**이며, 지연·오프라인 제출에서 R15·Brier·전이점수 시간창이 동기화 지연만큼 통째로 밀린다. 게다가 32_learning_history.md §EOS-48-1이 problem_attempt.started_at/ended_at을 '클라 신고 발생 시각', ingested_at을 '수신 시각'으로 명시 분리했으므로 서버 now 파생값을 그 컬럼에 넣는 것은 같은 문서 §EOS-48-2의 '수신 시각 복제 = 날조' 금지에 정면으로 걸린다. 올바른 이식: ⓐ AttemptSubmitRequest에 클라 신고 started_at(선택)을 신설해 그대로 적재 ⓑ 서버 수신 시각은 ingested_at에 넣는다 ⓒ 클라가 신고하지 않으면 started_at은 NULL=미기록으로 둔다(서버 now 폴백 금지 — 그 폴백이 바로 이 지적의 대상이다). coach.py 축의 dialogue.started_at 이관은 발생 시각끼리의 이관이라 ② 그대로 유효하다"
