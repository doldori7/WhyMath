notes: "발견 경위(2026-09-07): 세션이 PR #1025를 머지하려다 REST 405 'Repository rule violations found / 16 of 16 required status checks are expected'를 2회 맞았다. 원인 규명 과정에서 pr_merge_readiness.py를 읽었는데, 그 docstring은 '필수 체크 6종(중앙값 6.5분)뿐이고 최장 잡 backend — lint·type·test(~30분)는 필수 목록에 없다'고 적고 있었다. 그런데 같은 도구를 실행해 규칙을 라이브 조회하니 16종이었고 그 느린 잡이 필수에 들어 있었다. 405 에러 문구의 '16'과도 일치한다.\\n\\n왜 중요한가: 그 docstring은 단순 설명이 아니라 이 저장소의 머지 전략 근거다 — '필수만 기다리면 6.5분이라 base 전진 확률 16%, 전체를 기다리면 28.6분이라 70%'라는 계산이 완화 방안 전체를 떠받친다. 느린 잡이 필수가 된 순간 그 계산의 분자가 바뀌므로, 전략을 읽고 따르는 세션은 있지도 않은 최적화를 믿게 된다. 도구 코드는 라이브 조회라 정상 동작하므로 이것은 무증상이다 — 판정은 맞고 산문만 틀렸다.\\n\\n인접: HARN-32가 그 전제를 세운 태스크이고, 머지 큐 도입(HARN-56)이 착지하면 이 축의 실효성 자체가 달라진다. 다만 이 태스크는 그 둘과 독립적으로 성립한다 — 산문이 실측과 어긋난 것을 고치는 일이라 다른 태스크의 결과를 기다리지 않는다."
