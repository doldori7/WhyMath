acceptance:
  - "① 원인 고정: scripts/ 내 subprocess 호출 4곳(remote_claims.py:154·backlog.py:932·pathscope.py:80·store.py:275)이 text=True 만 쓰고 encoding= 을 지정하지 않아, 파이썬이 locale.getpreferredencoding()(한국어 Windows=cp949)으로 git의 UTF-8 출력을 디코드하다 UnicodeDecodeError를 낸다. 전건에 encoding='utf-8' 을 명시한다(errors 정책도 함께 결정 — git 출력은 UTF-8이 정본이므로 replace 보다 strict 실패가 나은지 판단해 근거를 남긴다)."
  - "② 오류 마스킹 제거: 현행은 reader 스레드에서 UnicodeDecodeError가 터지고 호출측은 stdout=None 을 만져 AttributeError 가 되며, 경고에는 'error:AttributeError' 만 남아 진짜 원인(인코딩)이 보이지 않는다. 실패 경로가 근본 예외 타입을 보고하도록 고친다(침묵 실패 금지 규칙의 '예외 타입명 로그 포함'은 지켜졌으나 그 타입이 원인을 오도했다 — 마스킹도 관측 결함이다)."
  - "③ 변별력(양방향): cp949 로케일을 강제한 상태에서 한글이 섞인 git 출력을 주면 수정 전 코드가 red 이고 수정 후 green 인 회귀 테스트를 신설한다. 성공/실패 양쪽에서 같은 값을 내는 검사는 금지(변별력 없는 검증 스텝 금지 규칙)."
  - "④ 상시 무력 해소 확인: HARN-11 미머지 done 탐지는 fail-open 설계라 이 결함 아래서 Kiki 머신에서는 '항상' 무력이었다. 수정 후 Kiki 머신에서 start 실행 시 'error:AttributeError' 경고가 사라지고 탐지가 실제 동작함을 실측으로 확인한다(자가검증 스텝 동봉)."
  - "⑤ CI 배선 확인: 신설 테스트가 실제로 CI 잡에서 실행되는지 확인한 뒤 완료로 친다(tests/infra 는 과거 199건이 어떤 잡도 실행하지 않던 전력이 있다 — OPS-03/OPS-11)."
  - "⑥ 범위 밖: scripts/ 밖(src/backend 등)의 subprocess 호출 전수 감사·git 이외 외부 도구 출력 인코딩 일반화는 포함하지 않는다(필요 시 별도 태스크)."
