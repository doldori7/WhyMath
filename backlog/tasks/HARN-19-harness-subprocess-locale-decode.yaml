title: "하네스 git 서브프로세스 로케일 디코드 붕괴 — cp949 환경에서 HARN-11 미머지 done 탐지가 상시 무력"
track: infra-debt
stage: S4
subject: cross
layer: infra
status: todo
priority: 1
owner: claude
