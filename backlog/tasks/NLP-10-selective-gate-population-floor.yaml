acceptance:
  - "① 실측 고정 — NLP-09가 파생 게이트를 미지수 이름에서 개수로 옮기면서 `classify_gradability`의 B버킷(`numeric_short_answer_candidate`)이 7,130 → **154**로 줄었다(HEAD 실물 대조). 우선순위가 A→C→B라 C(symbolic)로 승격된 6,976건이 B에서 빠진 결과이며, 채점 품질로는 개선이다(약한 수치 휴리스틱 → SymPy 검산).\n② 위험 규명 — CI 게이트 `selective_grading_demotion_eval`은 A/B 각 75건을 표본으로 뽑는다(`--n-defective 150 --n-clean 150`을 75/75로 분할). B 모집단이 154건이면 여유는 **2.05배**뿐이다. NLP-09 이전에는 95배였다. 앞으로 파생 가능 범위가 더 넓어질수록(이 저장소가 지향하는 방향이다) B는 더 줄고, 75건 미만이 되는 순간 이 게이트는 통과가 아니라 **표본 부족으로 실행 불가**가 된다.\n③ 판정 — 셋 중 하나를 실측으로 고른다: (ⓐ) 표본 수를 줄여도 Wilson 상한이 규약(오검출 ≤0.02)을 증명하는가 — `anchor_detection_channel_eval`이 이미 \"도달 가능성 자체를 매 실행 재검사\"하는 선례를 갖고 있다 (ⓑ) B버킷 정의를 넓혀 모집단을 회복하는가 (ⓒ) A/B 분할 비율을 모집단 비례로 바꾸는가.\n④ 집행 지점(정본화와 별항) — 판정이 무엇이든 **모집단 부족을 조용한 실패로 두지 않는다**. CLI가 실행 전 B 모집단 크기를 확인하고 표본 요구를 못 채우면 \"게이트 통과\"가 아니라 명시적 exit 1 + 별도 stderr로 구분해 낸다(`anchor_detection_channel_eval`의 도달 가능성 재검사와 같은 패턴). 회귀 테스트로 그 분기를 동결한다 — 모집단을 75 미만으로 주입했을 때 RED가 나는지 확인한 뒤에만 보호로 친다."
