notes: "[사고 경위 2026-09-10 · 2회차] OPS-72 착지 보고에서 세션이 검증 **증거**를 실행용 코드펜스에 담아 냈다 — 커밋 메시지 줄 하나(`b64f470d  OPS-72: ... (#1065)`)와 `git cat-file -e origin/main:<경로>  → 존재` 두 줄. Kiki가 그 펜스를 통째로 붙여넣어 PowerShell에서 3건이 터졌다: ParserError(괄호 `(#1065)`를 식으로 파싱) 1건 + `fatal: too many arguments`(`→ 존재` 주석이 git의 두 번째 인자가 됨) 2건. 읽기 전용 명령이라 피해 0.\n\n[왜 태스크인가 — \"다음엔 조심한다\"가 아닌 형태여야 한다] 이것은 **동일 유형 2회차**다. 1회차는 2026-08-31 HARN-38 세션(`$ git ls-tree`와 그 출력을 한 펜스에 담아 보고 → CommandNotFoundException 2건, 역시 조회 명령이라 피해 0). 그때의 대책이 CLAUDE.md 「실행용 블록과 증거 블록의 분리」 산문 규칙이었다. **그 산문 규칙이 실패했다.** CLAUDE.md 「실수 관리」는 반복 실수의 대책이 규칙·코드·태스크 중 하나여야 한다고 규정하며, 규칙 축은 이미 소진됐으므로 코드 축이 필요하다.\n\n[규칙이 왜 실패했는지 — 재량이 남아 있었다] 1회차 규칙의 문면은 \"증거·출력 인용은 실행용과 **눈으로 구별되게** 표시\"였다. 무엇이 \"구별되게\"인지가 저자 재량이라, 세션은 펜스를 쓰면서 라벨만 붙여도 준수라고 읽을 수 있었다. 2026-09-10 CLAUDE.md v0.2.20이 이 재량을 없앤다(증거는 펜스에 **넣지 않는다** — 인용문 `>` + 라벨). 이 태스크는 그 밝은 선을 **기계가 보는 표면에서** 집행한다.\n\n[한계를 먼저 적는다] 실제 실패 표면은 채팅 출력이고 CI는 채팅을 보지 못한다. 이 태스크가 덮는 것은 저장소에 커밋된 런북·커맨드 문서뿐이다. 다만 그 표면도 실재하는 사고 경로다 — 런북은 Kiki가 그대로 붙여넣는 1차 표면이고, 같은 날 PR #1093 본문에도 동일 패턴이 들어갔다(즉 이 형태는 커밋되는 텍스트에서도 재생산된다). 그러므로 \"부분 방어\"임을 acceptance ④에 못 박고 착지 문서에 표로 남긴다.\n\n[숙주는 신규 도구가 아니다] `scripts/ops/check_ps_scripts.py`가 OPS-57에서 이미 `docs/**/*.md`의 powershell 펜스를 훑고, 인용문 안 펜스까지 본다. 새 도구를 만들 이유가 없다 — 규칙 추가다. 인접 태스크: OPS-57(done · 코드펜스 편입)·OPS-60(todo · 런타임 실패 규칙 3종 승계). OPS-60과 병행 가능하나 같은 파일을 건드리므로 착수 시 겹침을 확인한다."
