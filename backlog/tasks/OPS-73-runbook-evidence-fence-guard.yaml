acceptance:
  - "① 규칙 신설 — 실행용 코드펜스에 **출력·주석 혼입 금지**를 `scripts/ops/check_ps_scripts.py`에 추가한다. 검출 대상 3종: (a) 프롬프트 접두(`$ `·`PS>`·`PS C:\\...>`) (b) 화살표 주석(`→`·`←` 뒤에 한국어 판정어가 오는 줄 — `→ 존재`·`→ 성공`) (c) 명령이 아닌 출력으로 보이는 줄(커밋 해시+메시지 형태 `^[0-9a-f]{7,40} `). 대상은 기존 `iter_powershell_blocks`가 이미 훑는 `docs/**/*.md`의 powershell 펜스 + `.claude/commands/*.md`\n② 변별력 양방향 실측 — 규칙마다 위반 샘플이 exit 1, 정상 샘플이 exit 0을 내는지 `tests/infra`로 동결한다. 기존 런북 자산 전건을 먼저 돌려 green인지 확인한 뒤에만 CI 차단으로 승격한다(OPS-57 ③·OPS-60 ⑤와 동일 규약). 정상 입력에서 통과하는 것은 보호의 증거가 아니다\n③ 오탐 우선 — `→`는 한국어 산문에서 흔하다. 주석(`#`) 안의 화살표와 문자열 리터럴 안의 화살표는 면제하고, 좁히는 쪽을 택한 뒤 **놓치는 형태를 도구 출력에 명시**한다(OPS-60 ⑥ 규약). 오탐이 있는 가드는 사람이 끄게 만든다\n④ 판정 범위의 정직한 명시 (필수 · 이 태스크의 핵심 한계) — **이 가드는 이번 사고의 실제 실패 표면을 덮지 못한다.** 사고는 세션이 *채팅으로* 낸 증거 블록에서 났고, CI는 채팅도 PR 본문도 보지 않는다. 이 가드가 덮는 것은 *저장소에 커밋된* 런북·커맨드 문서뿐이다. 그러므로 착지 시 도구 docstring과 리뷰 문서에 \"잡는 것 / 못 잡는 것\"을 표로 적어 과신을 막는다(OPS-57 ⑤⑥ 선례). 채팅 축의 유일한 방어선은 CLAUDE.md 규칙이며, 그 규칙은 이미 2회 실패했다는 사실을 함께 적는다\n⑤ 인접 표면 검토 — PR 본문 템플릿·`docs/reviews/**`에도 같은 형태가 실재하는지 전수 스캔하고(2026-09-10 PR #1093 본문이 그 실례다) 발견분을 같은 규칙으로 정정한다. 스캔 0건이면 \"내가 찾은 방법으로는 0건\"이라고 범위를 밝혀 적는다"
