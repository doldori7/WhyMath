acceptance:
  - "① 실측 고정 — 정답 해설 오진단 497건 중 **94건(18.9%)**이 `weak-signal-mixed`/`weak-signals-only`다(`harness/misconception_false_positive_eval.py` 분류). 최대 항목은 `division-by-zero` 70건 — `signals=('분모','0')`인데 \"몫의 미분법에 따라 분자와 **분모**를 각각 미분해 조합하면 f'(-1)의 값은 **0**이다\" 같은 완전히 올바른 해설이 confidence 1.0으로 잡힌다. `angle-sum-non-triangle`(`('내각','180')`) 24건도 \"n각형의 **내각**의 합은 (n-2)·**180**°\" 해설이 걸린다. 나눗셈 오개념·다각형 오개념과 아무 관계가 없다.\n② 원인 — v1.3이 약한 signal(숫자-only·단일 ASCII)에 **경계 검사**를 붙여 토큰 내부 오매칭(`'0'∈'10'`)은 막았지만, **거리**는 보지 않는다. `'분모'`와 `'0'`이 한 문장 안 아무 데나 있으면 공출현 AND가 성립한다. 초기 거리 실측(표본 6건): 정탐 3·3·5·5 / 오탐 11·31 — 간격이 있어 보이나 **표본이 작아 임계 확정 불가**다. 착수 시 정답 해설 494건과 recall 프로브로 분포를 전수 측정해 정한다.\n③ 설계 — `MISC-25`가 만든 근접 창(`_CORRECTION_LOOKBEHIND`/`_CORRECTION_LOOKAHEAD`·`_is_weak_signal`)과 **같은 도구를 신호 공출현에 적용**한다: 약한 signal은 내용성 signal에서 N자 이내일 때만 매치로 센다. 재구현 0 — 이미 `_is_weak_signal`이 있고 절 분리(`_clauses`)도 있다. **파급 주의**: 이것은 `_match_one`의 confidence 산식이 아니라 `matched` 집합을 바꾸므로 `matched_signals` 텔레메트리와 부분매칭(0.5) 경계가 함께 움직인다 — `MISC-22`(정규식 가산)·`MISC-24`(모호 정규식)가 각각 별도 태스크였던 것과 같은 무게다.\n④ 집행 지점(정본화와 별항) — 착지 후 `misconception_false_positive_eval`을 재실행해 CI ratchet(`ci.yml`의 `--max-fp-ratio 0.07`)을 **내려 잠근다**. 내리지 않으면 개선이 회귀 방지로 전환되지 않는다. 동시에 `anchor_detection_channel_eval`·recall 프로브로 **정탐이 죽지 않았는지** 확인한다 — 오진단만 보면 \"전부 미매치\"라는 과잉 수정이 6.5%→0%로 보인다."
