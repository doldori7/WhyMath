  - "② 비교 로직은 shadow로만 확장한다: A버킷은 정확일치(+안전한 정규화: 공백·전각반각만·의미 변형 정규화 0 — NFKC는 ③→3·x²→x2로 의미를 변형하므로 금지, 화이트리스트 정규화만), B버킷은 SymPy 수치 동치(l3/symbolic_equivalence.identity_status 재사용 — 새 확률모델 0). identity_status의 undecidable/parse_error는 정답/오답 어느 쪽도 아닌 판정 불가 버킷으로 분리 계상한다(이중 회계 승계 — Wilson 분모 오염 방지). attempt writer·BKT 입력에는 무영향(NLP-02 acceptance③ 동결 승계)"
  - "③ 강등전 판정: 결함 검출률 Wilson 95% 하한과 무결함 오검출(정답을 오답으로 오판) Wilson 95% 상한을 병기해 CLI exit 0/1로 판정한다. 오검출 상한이 학생 안전(#1 우선순위)과 직결되므로 검출률 하한보다 오검출 상한 기준을 더 엄격히 둔다 — 근거 문헌 없으면 superhuman_verification_standard.md S5(≤2%)를 초기값으로 채용하고 band_calibrated=false 선례처럼 정직 표기한다"
  - "④ REC-07 결정 입력 대체: REC-07 acceptance①의 판단 근거를 'REC-05 3버킷 수치' 단독에서 '이 게이트의 PASS/FAIL + 두 Wilson 값'으로 대체한다(REC-05는 폐기되지 않음 — 모집단 산정 입력으로 계속 쓰인다)"
  - "⑤ 범위 밖 동결: 게이트가 PASS해도 이 태스크는 채점 권위를 이관하지 않는다 — 클라 배선·attempt 입력 소비·is_correct 대체 전부 0. PASS/FAIL은 REC-07의 입력일 뿐 실행이 아니다"
