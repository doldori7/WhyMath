  - "⑥ 접근 주체 축소 — v0는 학생 본인 토큰 경로만 연다(보호자 전용 경로는 MGMT-01 법정대리인 인증 모델 후행). 축소 사유를 docstring에 명시."
  - "⑦ 범위 밖: 동의 scope 확장·약관 버전 스탬프(v1 D7·MGMT-02) · 실 법정대리인 본인확인(MGMT-01) · 재확인 주기 숫자 · 보호자 전용 접근 경로."
