notes: "[판정 2026-08-31 · 폐기] acceptance ①의 둘 중 폐기를 택했다. 근거 4건: ①소비처 0건 — 저장소 전체 참조 4건이 전부 자기참조(정의·models.__all__·__init__ import·__all__). ②정본 충돌 — EOS-44(#877 머지·설계 확정)가 DRAFT→IN_REVIEW→APPROVED→PUBLISHED→DEPRECATED→RETIRED 6단계를 정본으로 확정했고 PUBLISHED→DRAFT 금지를 명문화했다. 11단계를 배선하면 같은 대상에 상태 머신이 둘 생긴다 — 단계 수도 이름도 전이도 다르다. acceptance ③이 막으려는 이중 상태머신 그 자체다. ③노출 판정의 정본은 이미 배선돼 있다 — ReviewStatus(pending/approved/rejected) + is_review_status_cleared(approved만 True·fail-closed·CONT-01 값 수준 단일 권위)를 l6/_shared.is_review_cleared와 problem.is_published가 소비한다. ④축 혼재 — 11단계 중 parsed/validated/verified는 결정론 컴파일러의 처리 단계(함수 호출 순서가 이미 표현)이고 used/analyzed/improved는 학습 이벤트·개선 루프이지 노출 판정이 아니다. [동결] tests/backend/l3/dsl/test_lifecycle_single_source.py 12건 — 옛 심볼 부재만이 아니라 l3/dsl에서 *출판 거버넌스 어휘를 가진 Enum*을 금지해 이름을 바꾼 재도입도 잡는다. 결함 주입 3종 전부 red(옛 이름 되살림 / PublishState로 개명 되살림 / 정본 문서의 전이 규칙 삭제), 복원 바이트 동일. [문서] 03d §9.2 원 도식은 파이프라인 서사로 유효해 남기고 부기로 정본 표를 병기했다. 검토_18 §23 채택. 문서의 generated→schema_validated→…→published 상태머신 제안과 정확히 겹치는 미완 조각 — enum은 export만 되고 소비처 0건(2026-08-25 실측). EOS-44 설계 문서에서 lifecycle 정본이 정해진 뒤 착수. [재번호 2026-08-31·HARN-38] 원 ID = EOS-51-content-lifecycle-state-wiring(kiki 머신 브랜치에서 2026-08-26T08:39:56 KST 등재). main의 EOS-51-verification-design-freeze가 4일 뒤(2026-08-30T06:37:55 UTC) 같은 번호로 등재되며 충돌. 본문 무변경 이관. 번호 채택 경위: 병렬 이중 등재(본 세션 EOS-70 / claude/failure-definition-signature-scmzdu EOS-72)를 원격 대장 선등재분 EOS-72로 통일하고 EOS-70을 철회. 재대조 실측(2026-08-31): l3/dsl에 라우터·프로바이더 import 0건 — 이 계층은 결정론 컴파일러라 LLM 호출이 없다는 사실이 ①의 배선/폐기 판단 재료. 구 YAML은 2026-08-31 브랜치 삭제로 소멸."
