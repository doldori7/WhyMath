notes: "발견 경위(2026-09-10): HARN-02 착지 직후 SessionStart 브리핑이 이 오류를 그대로 출력했다. HARN-02는 pr_delivery_audit.py 한 곳의 리다이렉트 미추종을 고쳤고 실행 표면의 옛 owner 리터럴을 없앴지만, **이 파일은 owner를 리터럴로 갖고 있지 않다** — `git remote get-url origin`에서 파싱한다. 그래서 HARN-02가 만든 옛-owner 스캔 가드에 걸리지 않았고, 클론의 origin URL이 옛 주소인 한 계속 301을 받는다.\n\n교훈이 하나 있다: 이관 결함의 축은 **두 개**다 — ⓐ이름을 리터럴로 박아 둔 것(HARN-02가 처리) ⓑ리다이렉트를 따라가지 않는 것(이 태스크). ⓐ만 고치면 ⓑ는 옛 URL을 가진 모든 클론에서 그대로 남는다. HARN-02의 가드는 ⓐ만 본다.\n\n[겹침 고지] scripts/ops/pr_merge_readiness.py는 HARN-82(claude/g-export-prediction-disclosure-m8adzc · blocked)의 소유 파일이다. 이 태스크가 건드리는 것은 curl 인자 한 줄이고 HARN-82의 축(필수 체크 6종 vs 16종 docstring)과 겹치지 않는다. HARN-02에서도 같은 파일의 사용 예 1줄을 같은 사유로 고쳤다."
