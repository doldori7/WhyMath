acceptance:
  - "① 현행 실측 고정: ci.yml:290의 notation_coverage 게이트가 매 PR 실제로 돌고 green인데, 그 지원집합이 근거로 지목하는 5종(src/mobile/lib/features/chat/domain/math_notation.dart · src/mobile/test/notation_canonical_test.dart · math_notation_audit_test.dart · math_text_test.dart · docs/architecture/notation_semantics_layer.md)이 전부 부재함을 재현한다(주장 확인 또는 반증 — 하나라도 실재하면 범위 재조정). 게이트의 측정 기계(토큰 추출·래칫·--control-empty-support)는 진짜로 변별력이 있다 — 가짜인 것은 지원집합의 출처 주장뿐이라는 점을 severity에 반영"
  - "② 근거를 데이터로 승격: notation_coverage.py의 KATEX_PROVEN_MACROS 출처 산문 주석을 _PROVEN_MACRO_EVIDENCE(매크로 → 실증 파일 경로) 매핑으로 바꾸고, data/notation_support_manifest.json에 provenance 블록({claim, evidence_path, status})을 넣는다. 산문 주석을 파싱하지 않는다(취약) — 근거를 기계 판독 데이터로 만든다"
  - "③ 참조 무결성 검사 신설: 모든 evidence_path의 실재를 단언하는 테스트를 tests/backend/l3/에 추가하고 backend 잡이 실제로 실행함을 확인한다(OPS-10 test_test_suite_wiring 규약). 기존 test_unproven_symbols_not_included는 allowlist를 넓히는 것만 막고 이미 든 항목의 근거 실재는 보지 않는다 — 이 축을 보는 검사는 저장소에 0건이다"
  - "④ 회계 정직화: 근거 부재 항목을 삭제하지 않고 status='unproven'으로 격리하고, 지원집합 파생에서 제외한다. 그 결과 늘어난 코퍼스 누락은 의식적 수동 편집으로 data/notation_missing_baseline.json에 계상한다(자동 갱신 금지 원칙 유지). 리포트에 'unproven 출처 파생 심볼 N건'을 별도 줄로 노출한다 — 공백을 숨기지 않고 세는 것이 목표다"
  - "⑤ 변별력: ②의 매핑에서 경로 하나를 실재 파일로 바꾸면 green, 부재 파일로 되돌리면 red가 실측되는지 확인한다. 그리고 이 검사를 현행 코드에 처음 적용하면 즉시 red여야 한다 — 지금 전 항목이 유령이므로 red가 안 나오면 검사 자체가 무변별(위장)이다"
  - "⑥ 범위 밖 명시 + 결정 기록: NS-02(Dart 표기 파이프라인) 본체의 재구현·회수는 이 태스크에 포함하지 않는다. 미병합 브랜치 claude/shadow-data-s3-pilot-nh5kbz의 실재·회수 가능성만 실측하고 '회수' 또는 '포기'를 결정해 기록한다 — 어느 쪽이든 고아 정본 참조는 남기지 않는다. 착륙 발화 조건은 math_engine_gap_review.md §5-②"
