notes: "사고 경위: 2026-09-01 관여도 트리아지 게이트 clear 런북 실행 중 Kiki 머신에서 UnicodeEncodeError 2건 — gates list(U+23F3)·amend --help(U+2014). 파이프를 걸면 stdout이 콘솔이 아니라 파이프가 되어 Python이 로케일 인코딩(cp949)으로 인코딩한다. 한국어 Windows에서 하네스 CLI 출력을 파이프·리다이렉트로 받는 모든 사용이 같은 조건이다. 같은 유형 3회차 — 2026-07-17 logconfig 기동 실패(외부 도구의 읽기 인코딩), HARN-19 git 출력 디코딩(우리가 파싱하는 출력), 이번은 우리가 내는 출력. 앞 둘은 규칙과 코드로 막았으나 출력측 축은 비어 있었다. 우회 수단은 PYTHONUTF8 환경변수(런북 6-1b)이나 사람이 매 창에서 기억해야 하므로 항구 대책이 아니다. HARN-56·57은 타 세션 사용 중이라 CLI가 58을 제안했다.\n\n[취소 2026-09-01] 중복 등재 회피 — OPS-53-cp949-cli-output-safety-audit(todo)이 같은 문제를 이미 소유한다. 접근이 달라(그쪽=문자 금지 스캐너, 이쪽=stdout UTF-8 재구성) 별건으로 보였으나 같은 문제의 대안 해법이므로 한 소유자로 합치는 편이 옳다. 이쪽 축과 2026-09-01 실측 사고는 OPS-53 acceptance에 amend로 이관했다."
