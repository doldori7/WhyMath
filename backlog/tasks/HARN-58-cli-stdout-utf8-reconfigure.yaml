acceptance:
  - "① 재현 먼저 — 파이프/리다이렉트 상황에서 현행 CLI가 실제로 죽는지 실측한다(PowerShell cp949에서 gates list·--help 2건 실측됨 2026-09-01). 재현 없이 고치면 무엇을 고쳤는지 알 수 없다"
  - "② stdout/stderr을 UTF-8로 재구성 — 진입점에서 reconfigure(encoding='utf-8', errors=...) 또는 동등 수단. 정본 windows_utf8_setup.md §1이 'CP949를 애플리케이션 내부에서 지원하려 하지 말 것'이라 했으므로 cp949 대응이 아니라 출력측 UTF-8 고정이 방향이다"
  - "③ 변별력 — 로케일을 cp949로 강제한 서브프로세스에서 파이프 출력이 성공하는지 대조한다. 수정 전 실패·수정 후 성공 양방향을 실측하지 않으면 이 테스트는 위장이다"
  - "④ 배선 확인 — 신규 테스트가 CI(tests/harness 잡)에서 실제로 실행되는지 대조한다. 저장소에 존재함 ≠ 돌아감"
  - "⑤ 런북 측 회귀 방지 — 이 수정이 착지하면 eos_relevance_triage_gate_runbook.md §6-1b의 UTF-8 강제 블록이 여전히 필요한지 재판정하고, 불요해지면 문서에서 제거하거나 '보험'으로 명시한다(만료 없는 유예 금지)"
