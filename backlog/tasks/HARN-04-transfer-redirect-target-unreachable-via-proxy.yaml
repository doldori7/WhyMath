# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: HARN-04-transfer-redirect-target-unreachable-via-proxy
title: "리다이렉트를 따라가도 목적지가 막힌다 — 숫자 ID 경로를 에이전트 프록시가 거부해 CCR 세션의 PR 상태 판정이 여전히 불능"
