acceptance:
  - "저작권 게이트를 주 노출 경로에 — 기본 CAT 후보 SQL(api/me.py:1813)에 Problem.source_type.notin_(METADATA_ONLY_SOURCES) 추가. 수능 분기(me.py:1757)와 정확히 같은 상수를 재사용해 판정 기준 이원화를 회피(단일 권위). l6/_shared.py:141이 'L6의 모든 응용 모드가 차단한다'고 선언하는데 is_exposable 호출자에 api/me.py가 0건이고, 학생 앱이 실제로 쓰는 경로가 그 기본 분기다. 현 코퍼스 100% 자체생성이라 실손실은 0 — 결함 수정이 아니라 규약 대칭·defense-in-depth이며 그 사실을 과장 없이 기록한다"
  - "검수 축 활성화(신규 필드 0) — corpus_audit_eval 판정(PASS/FAIL/min-n 미달)을 코퍼스 단위로 Problem.review_status에 결정론 각인. 현재 실측 None 2,647/2,647이며 읽는 코드도 쓰는 코드도 0건이라, Wilson PASS 코퍼스와 min-n 미달 killer(120<200)가 런타임에서 무변별이다. 각인 값은 사람의 인상이 아니라 측정 게이트 판정만(사람 입력 경로 0 — 검증 권위 서열)"
  - "is_review_cleared를 is_exposable와 별도 함수로 신설해 L6 6모드 + 기본 CAT에 배선 — 두 함수를 합치지 않는 것이 설계의 핵심이다. is_exposable는 법적 축(협상 불가·의사결정 우선순위 #2)이고 검수는 운영 축(정책·완화 가능)이라, 하나로 뭉치면 나중에 운영 사유로 법적 게이트를 느슨하게 하는 압력이 생긴다"
  - "L6 후보 절단 해소 — api/gating.py:70 _CANDIDATE_FETCH_LIMIT=1000 < 코퍼스 2,647이고 created_at DESC 정렬 후 절단이라 최신 1,000건 밖 1,647문은 어떤 L6 모드에서도 후보가 될 수 없다. 최소한 절단 발생 자체를 관측(잘린 건수)하고, 상한 상향 또는 SQL 사전축소(수능 분기 선례) 중 성능 실측에 근거해 택한다. 조용한 절단을 남기지 않는 것이 요건"
  - "변별력 실측 — 메타데이터 전용 출처(평가원/EBS/교과서) 행 1건과 검수 FAIL 코퍼스 문항 1건을 주입해 후보에서 실제로 빠지는지 확인. 주입 없이 통과하는 테스트는 위장이다"
