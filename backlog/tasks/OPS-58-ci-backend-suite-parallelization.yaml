  - "⑤ 구조적 잔여분 명시 — 이 태스크는 경합 *창*을 줄일 뿐 경합 자체를 없애지 못한다. 근본 해법(merge queue 또는 up-to-date 요구 해제)은 저장소 관리자 설정이라 게이트로 분리한다."
