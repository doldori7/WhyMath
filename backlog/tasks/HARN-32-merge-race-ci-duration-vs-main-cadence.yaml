notes: "발견 경위: 2026-08-11 HARN-23(PR #780) 머지 과정에서 mergeable_state 가 dirty→blocked→dirty 로 반복 전이하는 것을 관측. 로컬 merge-tree 는 계속 EXIT=0이라 GitHub 판정과 갈렸다. 병렬 세션 3곳에서 같은 증상이 독립 관측됨(#776 병합 라운드 4회 소진 · #777 자동 머지가 main 전진 경쟁에 계속 짐 · #773 뒤처짐·충돌 반복) — 단, 그 세션들의 진단은 그들의 주장이므로 근거로 쓰지 않고 CI 소요·머지 간격을 이 세션이 직접 측정해 ①에 넣었다. HARN-23 자신은 문서·하네스만 건드려 CI 1.4분이라 auto-merge 로 한 번에 붙었다 — 경합을 피한 것이 아니라 CI 가 짧아서 운이 좋았던 쪽이다.\n\n[실측 보강 2026-08-11 · 이 태스크의 등재 PR #807 자신을 머지하는 과정] 착수 세션은 아래 2건을 출발점으로 삼을 것. (1) **가설 ⑶이 후보에서 유력으로 승격**: 등재 시 '⑶ up-to-date 요구는 보통 behind 를 내지 dirty 를 내지 않는다'고 적었으나, 실제 관측된 형태는 dirty 가 아니라 **머지 API 405 거부**였다 — 'Repository rule violations found / 6 of 6 required status checks are expected / 13 of 13 required status checks are expected'. 체크가 실패한 게 아니라 **expected** 다: 브랜치가 behind 라 필수 체크가 병합 커밋 기준으로 재평가되는데 그 커밋에는 체크가 없다. 즉 이 저장소에 up-to-date 요구가 실재한다는 강한 증거다. 단 **확정은 아니다** — 브랜치 보호/ruleset 설정을 직접 조회하지 않았고 그 조회가 ②의 몫이다. (2) **CI 길이와 무관하게 발생한다**: 등재 당시 '문서·백로그 PR은 CI가 짧아 경합 창에 안 걸린다'고 본 것은 낙관이었다. PR #807은 CI 전체가 **1분 19초**(12:41:22→12:42:41, 체크런 16건 success 6·skipped 10·failure 0)였는데도 405를 맞았다. 지배 변수는 CI 소요가 아니라 **up-to-date 요구 + 시간당 2.1건 머지**의 조합이므로 ①의 '백엔드 PR은 반반' 프레이밍은 문제를 과소평가한다 — 실제 영향 범위는 모든 PR이다. 해소 경로도 실측됨: origin/main 재병합(충돌 0·union 정상 작동) → push → auto-merge(SQUASH) → 13:08:23 머지.\n\n[정정 2026-08-31] 원인 확정(strict policy 실측) + 프레이밍 정정(필수 6.5분 vs 전체 28.6분) + 완화책 단일 채택"
