notes: "발견 경위: 2026-08-11 HARN-23(PR #780) 머지 과정에서 mergeable_state 가 dirty→blocked→dirty 로 반복 전이하는 것을 관측. 로컬 merge-tree 는 계속 EXIT=0이라 GitHub 판정과 갈렸다. 병렬 세션 3곳에서 같은 증상이 독립 관측됨(#776 병합 라운드 4회 소진 · #777 자동 머지가 main 전진 경쟁에 계속 짐 · #773 뒤처짐·충돌 반복) — 단, 그 세션들의 진단은 그들의 주장이므로 근거로 쓰지 않고 CI 소요·머지 간격을 이 세션이 직접 측정해 ①에 넣었다. HARN-23 자신은 문서·하네스만 건드려 CI 1.4분이라 auto-merge 로 한 번에 붙었다 — 경합을 피한 것이 아니라 CI 가 짧아서 운이 좋았던 쪽이다."
