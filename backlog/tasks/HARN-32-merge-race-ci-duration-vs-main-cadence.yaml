# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: HARN-32-merge-race-ci-duration-vs-main-cadence
title: "병합 경합 — 백엔드 PR의 CI 소요(~28분)가 main 머지 중앙 간격(~31분)과 맞먹어 완주 시점마다 base가 전진해 있다"
track: infra-debt
stage: S4
subject: cross
layer: infra
status: in_progress
priority: 2
owner: claude
depends_on: []
requires_gates: []
acceptance:
  - "① 실측 고정(2026-08-11 측정·재현 명령 동봉): CI 소요는 백엔드 건드리는 PR 12건이 21.6~28.4분, 문서·하네스만인 PR은 1.1~1.4분이다(mcp github actions_list · ci.yml · event=pull_request · completed 30건에서 run_started_at→updated_at). main 머지 간격은 최근 20건·9.6시간 구간에서 최소 1.9분·중앙값 30.7분·평균 28.7분·최대 61.2분 = 시간당 2.1건이다(git log origin/main --first-parent --format=%ct 를 epoch로 정규화). 즉 백엔드 PR은 CI가 끝나는 시점에 base가 이미 전진해 있을 확률이 대략 반반이다. 이 두 수치를 다시 재는 명령을 태스크 산출물에 남겨 재현 가능하게 한다"
  - "② 원인 판정(추론 등재 금지 — CLAUDE.md 환경 사실 규칙): 실측된 것은 증상뿐이다 — 로컬 git merge-tree --write-tree --name-only origin/main HEAD 가 EXIT=0(충돌 없음)인데 GitHub mergeable_state 는 dirty(2회 연속 조회 동일, PR #780 03:1x 실측). 후보 원인 3가지를 실측으로 갈라낸다: ⑴ GitHub 병합 판정이 .gitattributes 의 merge=union 을 적용하지 않음 ⑵ 캐시된 mergeability 가 stale ⑶ 브랜치 보호의 up-to-date 요구(단 이건 보통 behind 를 내지 dirty 를 내지 않는다). 어느 것인지 확정하기 전에는 완화책을 고르지 않는다"
  - "③ 완화책은 측정 후 선택(측정 없는 도입 금지): 후보 = GitHub merge queue 도입 / CI 분할·단축(백엔드 잡이 병목) / 공유 append 파일 구조 변경(MEMORY.md 결정로그·backlog/events.ndjson 을 세션·일자 단위 파일로 쪼개 동시쓰기 자체를 줄임) / auto-merge 표준화(green 즉시 머지로 경합 창 제거). ②의 판정 결과가 지목하는 축만 고른다. 여러 개를 한꺼번에 넣지 않는다 — 어느 것이 들었는지 ⑤가 판정 불가가 된다"
  - "④ 경계 별항(중복 소유 회피 — 등재 전 전수 확인함): HARN-30(PR 배송 상태 미관측)은 체크런이 0건인 배송 실패와 get_status 도구 함정을 소유한다 — 이 태스크는 체크런이 정상으로 돌았는데 완주 시점에 base 가 전진하는 경합을 본다(3번째 상태). docs/reviews/unmerged_branch_verdict_2026-08-11.md(#785)는 브랜치 회수 축, OPS-29 는 CI 강제 상태 선언 축이다. 셋 다 겹치지 않음을 착수 시 재확인한다"
  - "⑤ 변별력 양방향: 완화책 적용 전후로 CI 완주 시점 behind 비율 이 실제로 달라지는지 실측한다. 적용 후만 재고 통과 선언 금지 — 성공/실패 양쪽에서 같은 값을 내는 검사는 위장이다(2026-07-17 규칙). 표본은 이 저장소의 실제 PR 흐름에서 취한다"
  - "⑥ 범위 밖 동결: 남의 세션이 연 PR 을 대신 밀어붙이기 · CI green 아닌 상태의 우회 머지 · ②의 원인 규명 전에 .gitattributes 병합 정책 손대기 · 브랜치 보호 규칙 변경(사람 결정 · OPS-08 선례)"
  - "⑦ [실측 확정 2026-08-31] ② 원인 판정 완료 — 가설 ⑶(up-to-date 요구)이 **확정**됐다. GET /repos/doldori7/WhyMath/rules/branches/main 실측: required_status_checks.strict_required_status_checks_policy=true, required_review_thread_resolution=true, required_approving_review_count=0. 가설 ⑴(merge=union 미적용)·⑵(stale 캐시)는 채택하지 않는다 — strict 하나로 405 'N of N required status checks are expected' 증상이 전부 설명된다."
  - "⑧ [실측 정정] ①의 프레이밍이 차단 시간을 과대평가했다 — 머지를 막는 것은 전체 CI가 아니라 **필수 체크 6종**이고, 최장 잡 backend — lint·type·test(~30분)는 **필수 목록에 없다**. 실측 중앙값(표본 9): 필수 완주 6.5분 · 전체 완주 28.6분 · **회수 가능 22.2분**. main 머지 간격 중앙값 40.7분(표본 19) → base 전진 확률 필수만 16% vs 전체 70%. 재현 = scripts/analysis/measure_merge_gate_latency.py"
  - "⑨ [완화책 채택 — ③의 단일 선택] '필수 green 즉시 머지'를 판정하는 도구(scripts/ops/pr_merge_readiness.py, exit 0/1)를 채택했다. merge queue·CI 분할·.gitattributes 변경은 **채택하지 않는다**(⑥ 범위 밖 사람 결정 + 여러 개 동시 투입 금지). 양방향 변별력 동결 = tests/infra/test_pr_merge_readiness.py 9건 + 뮤테이션 5종 전건 검출(N1 필수/비필수 구별 제거 → 22분 회수 소멸, N3 skipped 불충족 → doc-only 영구 차단)."
  - "⑩ [⑤ 한계 명시] 적용 후 behind 비율 재측정은 **미완**이다 — 도구를 방금 만들어 이후 PR 흐름에서만 표본이 나온다. 예측치(16% vs 70%)는 실측 분포에서 계산한 것이지 적용 후 실측이 아니다. 다음 세션이 measure_merge_gate_latency.py로 재측정해 채운다."
