  - "④ B분류 3건 선처리 권고: l3.equivalent.josa(한국어 조사 판별·과목 무관)를 수학 패키지 밖으로 이동하면 baseline 없이 3건이 소멸한다 — 이 태스크에서 하거나 분리하거나 판정해 기록"
  - "⑤ [1차 상환 2026-08-31] ④ B분류 완료 — josa를 whymath_backend/lang/(신설 중립 패키지)로 **물리 이동**했다. 스캔 위반 15→**12건**, import-linter ignored 20→**19**, 계약 3건 KEPT. 분류표만 고치지 않고 파일을 옮긴 이유: import-linter는 모듈 경로로 판정하므로 l3.equivalent.* 접두가 남는 한 계약은 그대로 걸린다. 회귀: tests/backend/lang+l3/equivalent 1,040 passed · l3/render 54 passed."
  - "⑥ [정지 사유 — ① 착수 불가·설계 판단 필요] A분류 12건은 **Protocol 확장 결정 없이는 acceptance ③을 위반한다**. SubjectAdapter는 evaluate_answer·detect_misconception·validate_problem 3종뿐인데, 남은 호출부가 쓰는 것은 verify_solution(전이별 결과)·verify_step(VerifyStepResult/State)·symbolic_equivalence(IdentityVerdict)로 **단계 수준·기호 동치 축**이다. 이를 evaluate_answer 하나로 접으면 ③이 명시 금지한 '상태 재해석(unverifiable을 fail로 접기)'이 정확히 발생한다. Protocol 자신의 docstring이 메서드 추가를 '이 능력이 Physics·Chemistry·History에도 반드시 존재하는가?'로 게이팅하므로, **단계 검증·기호 동치를 계약에 넣을지는 설계 결정**이며 기계적 리팩터가 아니다. 그 결정 전에 착수하면 되돌리기 어려운 계약을 잘못 넓힌다."
