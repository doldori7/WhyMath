notes: "S3-24-shadow-recovery-bucket-b(버킷B⑤)에서 분리 등록 — 9건 중 diff가 가장 크다고 명시된 항목. [2026-08-09 사전조사 발견] pubspec.yaml:44-46 주석: flutter_math_fork는 MOB-09가 '사용처 0·선언만 있던 상태'로 이미 제거했고 '기능 착수 시 재도입'·'수식 입력은 MathLive WebView 임베드로 이미 커버 — 별도 렌더 라이브러리 미필요 상태가 유지되고 있다'고 명시. 즉 이 항목은 main이 이미 내린 아키텍처 결정과 정면으로 상충할 수 있다. [2026-08-09 재조사] 원 소스 브랜치 claude/shadow-data-s3-pilot-nh5kbz가 origin에서 완전히 삭제됨(git fetch·ls-remote 전부 실패, 원 커밋 75c3dda도 fetch 불가) — '원본 diff 재적용'은 이제 불가능. [2026-08-09 Kiki '재구현' 승인 이후에도 별도 미결 — 의도적으로 unblock 보류] S3-24/S3-25 나머지 15개 항목은 '원본 소실 → 재구현' 승인으로 unblock했으나, 이 항목엔 그 승인이 다루지 않은 추가 질문(main의 기존 아키텍처 결정을 뒤집을지)이 걸려 있어 같은 승인으로 자동 해소됐다고 보지 않는다. Kiki에게 이 항목만 별도로 한 번 더 확인 후 unblock할 것. [2026-08-10 전제 정정 — 원본은 접근 가능하다] 이 태스크의 acceptance를 '원본 diff 없음 → 재설계'로 쓴 것은 **내 오판이었다**. 원 브랜치가 origin에서 삭제된 것은 사실이나, 그로부터 git fetch가 실패한다는 이유만으로 '원본 접근 전면 불가'로 단정했고 다른 접근 경로를 시험하지 않았다. 실제로는 **GitHub API로 원 커밋에 완전히 접근된다**(repos/<owner>/<repo>/commits/<sha> — 메시지·파일목록, detail=full_patch로 유니파이드 diff까지). 2026-08-10 실측 확인했고, main도 #748에서 '회수 경로는 GitHub API 고정'으로 정본화했다. ⑤ 원S3-21 원 커밋 SHA: 75c3dda. 따라서 이 항목은 '처음부터 재설계'가 아니라 **원본을 읽고 현재 main 위에 이식하는 회수**로 다루라 — 원본의 UX 디테일·테스트를 그대로 살릴 수 있다. [2026-08-10 재조사 — 질문이 명확해졌다. 이제 Kiki 결정만 남았다] 원 커밋 75c3dda를 GitHub API로 받아 대조한 결과, 이 항목은 '수식 렌더 라이브러리를 새로 도입할까'가 아니라 **이미 만들어져 있던 표기 계층을 되살릴까**의 문제다. 원본이 신설한 것: shared/math/math_notation.dart(184줄 — plainMathToLatex: caret/ASCII→LaTeX 변환·순수·의미추론 0, segmentMathText: 프로즈/수식 세그먼트 한글 경계 분해) + shared/widgets/math_text.dart(131줄 — MathText 위젯, flutter_math_fork KaTeX 조판, 조각별 onErrorFallback 원문 폴백 = fail-closed·크래시 0) + chat_screen·coach_emphasis_text·problem_screen 배선 + 테스트 17건. 해결하려던 실기기 증상(2026-07-22 Kiki #5): 학생 화면에 'x^2'·'f^(\\prime)'·'\\lbrack' 같은 **컴퓨터/LaTeX 표기가 raw로 노출**됨. **핵심 — MOB-09의 flutter_math_fork 제거 근거가 순환이었다**: MOB-09는 '사용처 0'을 이유로 제거했는데, 사용처가 0이었던 것은 그 사용처를 전부 만든 원 커밋이 미병합 브랜치에 고립돼 있었기 때문이다. 즉 '미필요'가 입증된 게 아니라 '아직 안 들어왔다'가 '필요 없다'로 기록된 것이다. **결정 필요**: (A) 표기 계층을 회수한다 → flutter_math_fork 재도입 + 위 4파일 이식, 그러면 S3-41·NS-02·NS-01이 순차로 해금된다(이 3건은 depends_on으로 이 태스크에 묶어뒀다). (B) 회수하지 않는다 → 그 경우 학생 화면의 raw LaTeX 노출을 어떤 다른 수단으로 해결할지 정해야 하고(MathLive WebView는 *입력*용이라 대화·발문·선택지 렌더는 커버하지 못한다 — 원본이 배선한 3개 화면이 바로 그 자리다), S3-41·NS-02·NS-01은 폐기 대상이 된다. 권고: (A). 근거 — ①증상이 실기기에서 확인된 실제 학생 노출 문제이고 ②구현·테스트가 이미 완성된 상태로 존재하며(회수 비용 < 재설계 비용) ③fail-closed 설계라 파싱 실패 시 원문 폴백으로 안전하다. 다만 이건 아키텍처 결정이라 내가 단독으로 뒤집지 않는다."
