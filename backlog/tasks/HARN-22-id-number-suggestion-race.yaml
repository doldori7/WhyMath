acceptance:
  - "① 재현 고정: 두 세션이 각각 backlog.py add를 돌릴 때, 어느 쪽도 아직 푸시하지 않았으면 가드가 **같은 빈 번호를 양쪽에 제안**함을 테스트로 동결한다. 가드는 관측(로컬 + 원격 브랜치 스캔·HARN-15)만 하고 **번호를 예약하지 않으므로** TOCTOU 구간이 존재한다 — 이것이 설계상 성질임을 먼저 테스트로 명시한다"
  - "② 집행 지점: 완화책을 고르고 그 지점을 별항으로 적는다. 후보 — (a) 원격 예약 ref(refs/heads/claims/* CAS 선례·HARN-09)로 번호를 선점 (b) 번호를 세션 고유 오프셋/해시 기반으로 분산해 충돌 확률을 낮춤 (c) 예약은 포기하고 **머지 시점 충돌 탐지**를 강화(현행 validate가 이미 잡으므로, PR 생성·머지 전에 origin/main과 대조하는 선제 검사를 add/validate에 추가). 어느 것을 택하든 '어디서 강제되는가'를 명시한다"
  - "③ 변별력: 완화책이 실패 상태에서 실제로 실패하는지 양방향 확인한다 — 두 세션 시나리오를 픽스처로 재현해 완화 전에는 같은 번호가 나오고 완화 후에는 갈리는지 확인한다. 성공/실패 양쪽에서 같은 값을 내면 위장이다(2026-07-17)"
  - "④ 정직한 경계: 예약을 도입하지 않기로 결정하면 그것을 by-design으로 문서화하고, 대신 '충돌은 머지 시점에 반드시 잡힌다'는 보장을 테스트로 고정한다. 완화 불가를 조용히 남기지 않는다(침묵 실패 금지)"
  - "⑤ CI 실행 여부 확인: 신규 테스트가 CI에서 실제로 수집·실행되는지 실측한다(tests/harness 또는 tests/infra 소속 판정 포함 — OPS-03·OPS-10·OPS-11 '저장소에 존재함'과 '돌아감'은 다르다). 판정은 exit code로"
