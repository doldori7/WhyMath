notes: "docs/architecture/ai_recommendation_module_gap_review_2.md §2 G1. NLP-02가 착지시킨 shadow 채점의 파생 게이트(derive_verify_inputs)는 conditions_parsed[*].formal의 자유기호가 정확히 {x}일 때만 입력을 만드는데, 코퍼스 2,647문항 중 conditions 보유는 30건이고 그 30건 전부 formal=null이다(2026-08-04 실측) → 파생 가능 문항 0건. 즉 attempt가 아무리 쌓여도 verdict 0이며, 1차 문서 §5-①의 발화 조건('서버가 채점 권위를 가질 수 있음이 확인됐을 때')이 구조적으로 충족될 수 없다. 반면 객관식 1,616건(61.1%)은 answer가 choices 원소와 1,616/1,616 정확 일치해 서버 채점이 자명하고, 단답형 1,031건도 answer_format이 전건 수치형이다 — 채점 가능성은 attempt 없이 코퍼스만으로 잴 수 있다."
