  - "② 권위 실체화(이관): l5/ocr/verify.py의 private _latex_to_sympifiable를 l3/symbolic_equivalence.py의 public 순수 함수로 이관하고 L5는 그것을 호출한다. notation_contract.md §3이 이미 to_sympy_source를 '입력 정규화 단일 권위'로 선언했으므로 새 추상이 아니라 선언과 코드의 불일치를 코드 쪽에서 닫는 것이다. import-linter layers 계약(L5→L3 정방향)을 실측 확인"
  - "③ 3자 교차 골든: data/notation_contract.json에 latex_cases 블록을 추가(신규 계약 파일 0 — VIZ-02 ① '기존 계약 파일을 단일 진실원으로 확장' 선례)하고 tests/backend/l3/test_notation_contract.py(py) ↔ src/web/graphing-calculator/test/notation_contract.test.js(js) ↔ src/mobile/test/latex_to_plain_test.dart(dart·신규 편입)가 같은 fixture를 읽는다. dart/js 어느 쪽도 fixture 부재를 skip으로 흡수하지 않는다(파일 부재=실패 — test_notation_contract.py:31 pytest.skip 함정 회피). 웹은 canonical 문자열 일치가 아니라 mathjs 동일 수치로 검증한다(렌더 전용 경계·notation_contract.md §1 불변)"
  - "④ CI 트리거 구멍 봉인: ci.yml 경로 필터 backend·mobile·web 셋 모두에 data/notation_contract.json을 추가한다. 현재 data/만 고친 PR은 세 잡을 전부 skip해 교차 골든이 PR에서 돌지 않는다(2026-08-03 실측 — 2026-07-21 schemas/ 사각 보완과 동형). 이걸 빼면 이 태스크가 만든 게이트가 MATH-02가 지적하는 유령이 된다"
  - "⑤ 변별력: latex_cases의 canonical 한 줄을 의도적으로 틀리게 바꿔 py·js·dart 셋이 전부 red가 되는지 실측 → 복원해 green 실측. 한 언어라도 green을 유지하면 그 언어는 계약을 읽지 않는 것이다. 성공/실패 양쪽에서 같은 값을 내면 검증이 아니라 위장이다"
  - "⑥ 범위 밖 명시 + 경계 동결: (a) 3벌 구현을 1벌로 줄이지 않는다 — Dart가 Python을 import할 수 없어 원리적으로 불가하며 이 태스크가 줄이는 것은 권위이지 구현체 수가 아니다. (b) 원문 LaTeX 전송 + 백엔드 재변환 shadow는 API 계약 변경이라 범위 밖(발화 조건 math_engine_gap_review.md §5-①). (c) latex_cases는 입력→산출 쌍만 담고 조건 분기를 넣지 않는다(재작성 규칙 트리 금지 — math_dsl_evolution.md anti-goal). (d) NLP-03과의 경계: 이 태스크는 단계 문자열 1개의 표기 정규화(str→str)이고 NLP-03은 1 제출→N 단계 분해(str→list[str])다. \\displaylines의 래퍼 해체는 여기, 행 구분자 \\\\ 분해는 NLP-03"
