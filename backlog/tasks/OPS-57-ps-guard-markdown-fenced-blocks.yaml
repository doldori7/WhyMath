notes: "출처: 2026-08-31 LIC-02 siyavula URL 프로브. 원격 세션은 PowerShell 실행 검증이 구조적으로 불가(Windows 부재)하므로 정적 가드가 유일한 방어선인데, 그 가드가 런북 코드펜스를 안 본다. CLAUDE.md '측정·수집 도구를 성공 경로만 보고 설계 금지'·'변별력 없는 검증 스텝 금지'의 도구화. 2026-08-31 추가 관측(4번째 결함): 대화형 붙여넣기에서 `if {...}` / `else {...}`가 여러 입력으로 나뉘면 PS가 if를 완결 문으로 파싱해 else가 고아가 되고(CommandNotFoundException) 검증 스텝이 통째로 미실행된다 — 규칙 (d)로 추가 검토: 런북 코드펜스의 if/else 다중행 구조 경고. acceptance 수정 CLI(HARN-24)가 다른 세션 진행 중이라 notes로 남긴다.\n\n[정정 2026-09-01] eos_priority null → P1: 하네스 전제 — 런북 명령 가드. EOS-80 일괄 백필\n\n[정정 2026-09-01] 2026-09-01 관여도 트리아지 게이트 clear 런북에서 결함 7건 발생(라이브 3·리뷰 4). 그중 3건이 이 가드가 기계로 잡을 수 있는 형태다. OPS-57이 이미 '런북 코드펜스 미검사'를 소유하고 있으므로 신규 태스크 대신 여기에 편입한다"
