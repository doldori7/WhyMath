notes: "[착수 시점 — 2026-09-07 Kiki 판정] '배치 보류' 선택. MGMT-01(법정대리인 본인확인)·MGMT-02(약관·처리방침)와 같은 부류의 외부 변호사 검토이므로 2026-07-27 지시('변호사 회신 등 외부 작업이 미완성 제품의 병목이 되는 것 반대')와 같은 배치로 묶는다. unblock 트리거 = 공개 β 준비 착수 (MGMT-01·MGMT-02와 동일 문구·동일 시점). 같은 변호사에게 3건을 한 번에 의뢰하면 서비스 배경 설명 중복이 제거된다.\\n\\n[유예의 만료 지점 — CLAUDE.md '만료 없는 유예·제외 금지'] 이 보류는 무기한이 아니다. 두 트리거 중 먼저 오는 쪽에서 재확인한다: ⓐ 공개 β 준비 착수(기본) ⓑ 예측 5필드에 값을 채우는 코드가 처음 추가되는 시점 — 그 순간 판정 근거 3번('실피해 0의 창')이 무효가 되고 잠정 봉인이 진짜 열람 제약으로 바뀌므로 자문 우선순위가 즉시 올라간다.\\n\\n[준비물 완비] docs/legal/export_prediction_disclosure_counsel_brief.md (MGMT-04·PR #1038) — 질문 Q1~Q7·답변별 코드 귀결·회신→구현 매핑 3분기·첨부 색인. 착수 시 이 문서를 그대로 들고 가면 되고 다시 작성하지 않는다.\\n\\n[게이트 상태] G-export-prediction-disclosure는 pending 유지가 맞다 — waive가 아니다. 자문은 공개 β 전에 반드시 수행돼야 하고 waive하면 그 요구 자체가 사라진다. 다만 gates 하위 명령에 notes 수정 경로가 없어(list/add/clear/waive뿐) 이 보류 사실을 게이트 자체에는 적지 못했다 — 이 태스크가 그 기록을 대신한다(MGMT-01/02 선례 동형).\n\n[차단 2026-09-07] 공개 β 준비 착수까지 배치 보류 — 2026-09-07 Kiki 판정(선택지 3택 중 ①). MGMT-01·MGMT-02와 동일 배치·동일 트리거. 만료 지점 2종(먼저 오는 쪽): ⓐ공개 β 준비 착수 ⓑ예측 5필드 writer 최초 추가 시점(그 순간 '실피해 0' 논거 무효). 준비물은 완비 — docs/legal/export_prediction_disclosure_counsel_brief.md (MGMT-04·PR #1038)."
