  - "⑥ 범위 밖 명시: concepts API 클라 배선·flashcards 학생 노출 화면 신설·prerequisites/learning-path 클라 소비 활성화는 포함하지 않는다(활성화가 아니라 가시화 — NLP-01·REC-01과 동형). GET /concepts/search는 학생 직접 경로에 노출하지 않는다 — ARCH-11(subgraph depth guard, blocked) 해제 전까지 nlp_module_gap_review.md §5-⑤ 판정을 승계한다. prerequisites/learning-path의 요청량·개인화 축 관측은 REC-01(ai_recommendation_module_gap_review.md D1 승계) 소관이고 이 태스크는 개념 콘텐츠·그래프 표면 자체의 도달 관측만 다룬다 — api/me.py 경로 중복은 path_overlap=warn(비block) 정책상 허용 범위"
