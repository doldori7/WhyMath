notes: "2026-08-04 실측. 미머지 브랜치 정리 중 git push --delete 40건이 전건 HTTP 403(Server: cloudflare·Request-Id 있는 게이트웨이 응답, 로컬 릴레이 127.0.0.1 아님). 변별 테스트로 원인 특정: 세션이 직접 생성한 tmp-delete-probe-ignore도 생성은 성공(exit 0)·삭제만 403 → 브랜치별 권한이 아니라 ref 삭제 연산 자체의 정책 차단. 같은 41건을 Kiki 로컬에서 실행해 전건 성공(손실 0·보호대상 전건 생존 검증). CLAUDE.md에 이미 등재된 refs/claims/* 403 상시 실패(2026-07-27·HARN-07)와 같은 계열. 번호 주의: 최초 HARN-15로 등재했다가 미머지 브랜치 q8tvcx의 HARN-15-id-collision-cross-branch-scan과 충돌 발견해 되돌리고 HARN-16으로 재등재(HARN-15가 지목한 결함에 그 자신이 걸린 사례)."
