  - "④ 재발 차단 장치: 새 계약 fixture를 data/에 추가할 때 트리거 등재를 강제하는 장치를 함께 둔다(예: data/*.json 계약 목록 ↔ ci.yml 필터 대조 검사). 이것이 없으면 다음 계약에서 그대로 재발한다 — 산문 규칙은 대책이 아니다"
  - "⑤ 집행 정합: 봉합 후 각 계약의 소비 테스트가 실제로 그 잡에서 실행되는지 확인한다(저장소에 존재함 ≠ 돌아감 — OPS-03·OPS-10·OPS-11 선례). tests/infra/test_test_suite_wiring.py 규약 준수. 판정은 exit code로 한다(-q·| tail 금지)"
  - "⑥ 범위 밖: 계약 내용의 실태 정합(access_matrix #8은 COLLAB-05 소관)·계약 테스트를 infra-contracts로 이관(백엔드 의존성 필요·29초 경량 잡 설계를 깬다)·새 CI 잡 신설·다른 잡(mobile/data-pipeline)의 필터 확장은 이 태스크 범위 밖"
