  - "② 판독 CLI 신설 — ops/defect_report_digest.py(가칭): 카테고리별 집계 + 문항별 집계 + 상위 신고 문항 랭킹. 기존 ops/*_report.py 패턴(recommendation_reach_report·pedagogy_content_slot_reach_report)을 그대로 답습하고 새 판정 로직을 만들지 않는다. 정직 회계 — 테이블 미존재(마이그레이션 미적용)와 0건 접수를 다른 값으로 낸다(qa_pipeline 축 9의 이중 회계 규약 재사용)."
  - "③ 프라이버시 — DefectReport는 user_id 컬럼 자체가 없고 자유서술도 없다(category 폐쇄 6종 + problem_id만). 즉 PII가 구조적으로 0이므로 집계·출력에 마스킹 설계가 불요하다. 이 사실을 CLI docstring에 근거와 함께 명시하고, 향후 필드가 늘어 이 전제가 깨지면 드러나도록 스키마 전제를 테스트로 동결한다."
  - "④ 범위 밖 동결 — HTTP admin 표면(/v1/admin/*)·관리자 콘솔 UI·신고 처리 상태 전이(PATCH)는 포함하지 않는다. 43(관리자 CMS) 재판정 트리거는 여전히 미도달이며 이 태스크가 CMS를 앞당기지 않는다. append-only 계약도 그대로 유지한다(tests/backend/api/test_reports.py TestAppendOnly)."
  - "⑤ 변별력 실측(양방향) — 신고 행을 주입하면 리포트에 그 문항이 나타나고, 지우면 사라지는지를 둘 다 실측한다. 그리고 declared_unwired_audit 대장에 _OFFLINE_REPORT로 등재해 '운영자 수동 실행이 의도'임을 선언한다(미분류면 그 게이트가 exit 1)."
