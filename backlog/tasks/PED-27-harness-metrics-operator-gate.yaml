notes: "docs/architecture/gamification_module_gap_review_r3.md §2 G1 · §4 D8. PED-08이 학생 안전 라우트(/growth-evidence)를 신설했으나 원시 라우트가 '문자 그대로 동일한 게이트'(둘 다 ConsentedUser · api/me.py:3069 vs :3261)로 원시 16지표+gaming_suspect 낙인 라벨+내부 전용 2종(diagnosis_agreement_rate·tokens_per_turn)을 학생 토큰에 반환한다. r2 D5가 이 표면을 동결한 근거('ops·리포트가 원시값으로 소비하는 표면')는 오탐 — 실측하면 ops 2종은 HTTP를 안 타고 compute_wh1_surrogate_metrics를 직접 호출한다(surrogate_baseline_report.py:314 · pilot_kpi_baseline.py:809). 라우트 주석 자신도 'ops/스크립트가 직접 호출'을 명시(api/me.py:3060-3061). Flutter 호출 0. 즉 HTTP 소비자 0건이고 유일한 호출자는 계약이 보호하려던 그 학생. 세 슬라이스(PED-08 acceptance ⑩ · S4-19 wh1_evaluation.py:1839 · PED-15)가 각각 인지하고 각각 회피만 했다 — 반복 실수 11회차 '인지하고 우회'. 형태=운영자 게이트 강등(Kiki 확정 2026-08-11 — 삭제는 되돌리기 비용·응답 축소는 우회로 존치)."
