# =============================================================================
# student_profile.schema.yaml — 학생 프로필 (StudentProfile)
# =============================================================================
# 엔티티 목적:
#   학생 개개인을 그가 속한 교육 맥락에 맞춰 콘텐츠를 정렬하기 위한 *정적 입력* 자산.
#   국가·학년·학교·활성 교과서·그림자 커리큘럼·목표·학습 선호를 담는다.
#   학생의 *동적* 학습 상태(BKT 확률·IRT theta 등)는 여기 들어오지 않는다 —
#   그것은 L2 의 MasteryState/LearnerState 소관.
#
# 소유 7계층 (경계 명시 — 중요):
#   L1 데이터 기반이 *보유*한다.
#   - L2 학습자 모델은 이를 *읽기만* 한다 (수정 금지). BKT 사전 분포 보정·추적 범위
#     결정에 활용. 위치·학교·교과서 변경은 L1 책임.
#   - L6 응용 모드(자동 커리큘럼 정렬 엔진)가 이를 *소비*한다.
#   7계층 의존 방향: L2·L6 는 L1 을 호출할 수 있으나 L1 데이터를 구현·소유하지 않는다.
#
# 관련 데이터 카드 / 아키텍처:
#   docs/architecture/01_data_foundation.md  자산 12번 (자동 커리큘럼 정렬 입력)
#   docs/architecture/02_learner_model.md    "StudentProfile — L1 보유, L2는 읽기"
#
# 민감정보 분류:
#   미성년자 PII 포함. CLAUDE.md 절대 금기 — 암호화 저장, 분석·마케팅 외부 공유 금지,
#   학교·학년으로 개인 식별 가능한 분석 결과 외부 노출 금지. 14세 미만 동의 절차 준수.
#
# 상태: 명세 단계. Phase 1 구현 대상 (고1 내신 첫 진입 트랙과 직결).
# =============================================================================

entity: StudentProfile
layer: L1                       # 보유는 L1. 소비는 L2(읽기)·L6(정렬 엔진)
owned_by: L1
read_by: [L2, L6]
storage: "PostgreSQL 16 (민감정보 — 암호화 저장)"
primary_key: student_id
phase_scope: "Phase 1 — 고1 내신 트랙"

fields:

  # --- 식별 ---------------------------------------------------------------
  student_id:
    type: string
    required: true
    description: PK. 학생 식별자. 미성년자 PII와 직접 연결되는 키 — 취급 주의.

  # --- 기본 위치 (국가·학년·교육과정) -------------------------------------
  country_code:
    type: string
    required: true
    description: ISO 3166-1 alpha-2. Phase 1 은 'KR'.
    example: "KR"

  grade:
    type: string
    required: true
    description: >-
      학년. L2 가 이 값을 읽어 BKT 사전 분포 P(L0) 초기값을 보정한다
      (예: 고1이 중3 성취기준을 다룰 때 사전지식 확률 상향).
    example: "고1"

  curriculum:
    type: string
    required: true
    description: 적용 교육과정.
    example: "2022 개정"

  # --- 학교 정보 (학교알리미 연동) ----------------------------------------
  school_code:
    type: string | null
    required: false
    description: >-
      학교알리미 연동 학교 식별자. 이 코드로 학교별 채택 교과서를 자동 조회해
      active_textbook_isbn 을 채운다 (학교알리미 자산이 "학교→교과서" 자동 채움을 떠받침).
    relation:
      references: "school_textbook_adoption.school_code  (학교알리미 자산 — .claude/agents/data-engineer.md)"

  school_name:
    type: string | null
    required: false
    description: 학교명. PII 민감도 — 외부 노출 금지.

  region_code:
    type: string | null
    required: false
    description: 시도교육청 코드.

  # --- 활성 교과서 --------------------------------------------------------
  active_textbook_isbn:
    type: string | null
    required: false
    description: >-
      현재 학교에서 쓰는 검정교과서의 ISBN. 12단계 교과서 매핑 파이프라인의
      출력(TextbookMapping)과 연결된다. school_code 로 자동 채움 가능.
    relation:
      references: "TextbookMapping.isbn  (textbook_mapping.schema.yaml)"

  # --- 그림자 커리큘럼 (학원·인강 진도) -----------------------------------
  shadow_curriculum_progress:
    type: "map<string, string> | null"
    required: false
    description: >-
      학원·인강 진도 — 학교 진도와 *별개로* 학생이 실제로 어디까지 배웠는지.
      key 는 성취기준 코드 또는 concept_id, value 는 진도 상태.
      ⚠️ 학원·인강 *자료*를 데이터화하는 게 아니다 (CLAUDE.md 금기) — 학생이
      직접 입력한 "어디까지 배웠다"는 진도 *사실*만 담는다.
    example: {"[10공수1-02]": "완료", "UC.calc.limit.definition": "진행중"}

  # --- 목표 --------------------------------------------------------------
  goals:
    type: "map<string, string>"
    required: false
    default: {}
    description: >-
      학습 목표. 내신 목표 등급·수능 목표 등 (고1 내신 첫 진입과 직결).
      L2 가 LearnerState 에 함께 실어 L4 교수학 엔진에 전달한다.
      ⚠️ 목표는 학생 동기 맥락일 뿐 — CLAUDE.md "정답을 빠르게를 KPI로 사용 금지"에
      따라 L4 는 이 목표를 정서적 압박으로 강화하지 않는다.
    example: {"naesin_target_grade": "2등급", "suneung_target": "미정"}

  # --- 학습 선호 ----------------------------------------------------------
  learning_preferences:
    type: LearningPreferences
    required: false
    description: 선호 시간대·세션 길이·시각화 선호 등. 아래 구조.
    element_schema: LearningPreferences

  # --- 동의·운영 메타 (민감정보 처리) -------------------------------------
  consent_data_usage:
    type: boolean
    required: true
    default: false
    description: >-
      풀이 데이터를 학습/개선에 활용하는 데 대한 명시적 동의 여부.
      CLAUDE.md 절대 금기 — 동의 없이는 풀이 데이터를 학습에 사용 금지.
      false 면 user solution pipeline 이 이 학생 데이터를 학습용으로 쓰지 않는다.

  guardian_consent:
    type: boolean | null
    required: false
    description: 14세 미만일 경우 학부모 동의 여부 (PIPA 준수).

  created_at:
    type: datetime
    required: true
    description: 프로필 생성 시각.

  updated_at:
    type: datetime
    required: true
    description: 프로필 최종 수정 시각. 위치·학교·교과서 변경은 L1 만 수행.

# =============================================================================
# LearningPreferences — 학습 선호 (중첩 구조)
# =============================================================================
LearningPreferences:
  description: 학생의 학습 선호. L4·L5 가 세션 설계·시각화 제시에 참고.
  fields:
    preferred_time_slots:
      type: list<string>
      required: false
      default: []
      description: 선호 학습 시간대.
    preferred_session_length_min:
      type: integer | null
      required: false
      description: 선호 세션 길이(분).
    visualization_preference:
      type: string | null
      required: false
      description: 시각화 선호도 (L5 시각화 자산 제시 참고).

# -----------------------------------------------------------------------------
# 엔티티 간 관계 요약
# -----------------------------------------------------------------------------
relationships:
  - target: "TextbookMapping (textbook_mapping.schema.yaml)"
    via: "active_textbook_isbn ↔ TextbookMapping.isbn"
    kind: "N:1 — 학생의 활성 교과서. school_code 로 자동 채움 가능"
  - target: "school_textbook_adoption (학교알리미 자산)"
    via: "school_code"
    kind: "N:1 — 학교 식별자로 채택 교과서 조회 → active_textbook_isbn 자동 채움"
  - target: "MasteryState (mastery_state.schema.yaml)"
    via: "student_id"
    kind: >-
      1:N — 한 학생에 개념별 MasteryState 레코드들이 부착됨. 단, MasteryState 는
      L2 가 보유·생산하는 *동적 상태*이고 StudentProfile 은 L1 의 *정적 프로필* —
      서로 다른 계층. student_id 로만 연결된다.
  - target: "LearnerState (02_learner_model.md — L2 출력)"
    via: "grade·curriculum·active_textbook_isbn·shadow_curriculum_progress·goals 가 LearnerState 로 *복사*됨"
    kind: >-
      읽기 전용 사본 — L2 는 이 정적 정보를 LearnerState 에 실어 L3·L4 로 전달할
      뿐, 소유·수정하지 않는다 (7계층 경계).

# -----------------------------------------------------------------------------
# 계층 경계 규칙 (02_learner_model.md "L1 → L2 관계")
# -----------------------------------------------------------------------------
layer_boundary_rules:
  - "L1 이 StudentProfile 을 보유·수정한다 (위치·학교·교과서 변경)."
  - "L2 는 StudentProfile 을 *읽기만* 한다 — 추적 범위 결정, BKT 사전 분포 보정, LearnerState 동봉."
  - "L2 가 생산하는 것은 동적 상태(MasteryState·LearnerState)이지 정적 프로필이 아니다."
  - "L6 자동 커리큘럼 정렬 엔진이 StudentProfile 을 소비한다 (정렬 *엔진* 로직은 L6, *입력 자산*만 L1)."
