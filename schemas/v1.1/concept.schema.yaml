# =============================================================================
# concept.schema.yaml — 개념 노드 (Concept)
# =============================================================================
# 엔티티 목적:
#   수학 개념 하나를 그래프 노드로 표현한다. "왜 이 개념을 배우는가"를 구조로
#   답하기 위한 자산의 최소 단위. 표시이름(한·영·일)은 노드에 내장하지 않고 locale
#   계층(data/corpus/concept_graph_v1/locales/{lang}.json)이 canonical_id로 조인해
#   보유한다(2026-07-02 P2d·Part 9·Concept Purity). 노드는 순수 개념 식별·의미만 지고,
#   선수개념·흔한 오개념·시각화 카드를 *참조*로 연결한다.
#
# 소유 7계층:
#   L1 데이터 기반 (보유·조회 API까지). 그래프 순회·학습 경로 생성은 L4/L6 소관 —
#   L1은 노드·엣지 데이터와 단순 조회만 책임진다.
#
# 관련 데이터 카드:
#   docs/data/concept_graph.md  (필드 상세·ID 규약·검증 invariant의 정본)
#
# 관계 요약:
#   - Concept --(prerequisite_concept_ids)--> Concept   (자기참조, Edge와 중복 저장)
#   - Concept --(standard_codes)--> AchievementStandard  (NCIC truth source — FK)
#   - Concept --(visualization_card_keys)--> L5 시각화 자산  (L1은 참조 키만 보유)
#
# ⚠ 오개념 연결은 Concept 노드 내장 금지(Concept Purity):
#   Concept ↔ Misconception 관계는 별도 misconception_relation 엔티티에서만 관리한다.
#   검토 문서 §10·§25·§68-7 반영 — 2026-08-26 MISC-12.
#   - concept_id 키 공간은 curriculum_entry / textbook_mapping과 *공유* (join 가능해야 함)
#
# 상태: 명세 단계. Phase 1 구현 대상 (고1 미적분 영역 ~100개념).
#       실제 코드 구현(Neo4j 적재·Pydantic 모델)은 본 명세의 범위 밖.
#
# ⚠ 런타임 드리프트 노트 (2026-07-21 전면 정합성 검토):
#   아래 storage(Neo4j 5.x)·문자열 PK(concept_id) 가정은 *현 런타임과 다르다*.
#   런타임 정본 = src/backend/whymath_backend/db/models/concept.py — PostgreSQL 단일
#   평면(Neo4j 런타임 미도입), PK=concept_id(UUID·gen_random_uuid) + canonical 문자열
#   'math.<area>.<slug>'는 code(Text·unique) 컬럼으로 병행 보유. 신규 작업은 런타임
#   정본 기준으로 설계하고, 본 파일은 필드 의미 명세로만 읽을 것.
# =============================================================================

entity: Concept
layer: L1
storage: Neo4j 5.x          # 배포 토폴로지 DB 블록 (docs/architecture/00_overview.md 5블록)
primary_key: concept_id
phase_scope: "Phase 1 — 고1 미적분 영역 ~100개념"

fields:

  concept_id:
    type: string
    required: true
    description: >-
      concept_id(canonical). 개념 노드의 PK이자 curriculum_entry·textbook_mapping과 공유하는 키.
      교육과정·언어·렌더러 무관 의미론 형식 'math.<area>.<slug>'(Part 9 준수). 2026-07-02 P2d로
      기존 '{TRACK}-{AREA}-{NNN}'(학년대 결합·비의미론)에서 *전환*(breaking). 추적성은
      source_id·aliases로 보존(아래) — 옛 axis 코드·옛 UC·src_id로 롤백·하위호환 join.
    pattern: "^math\\.[a-z]+(-[a-z]+)*\\.[a-z0-9]+(-[a-z0-9]+)*$"
    format: "math.<area>.<slug>  (area=교육과정-독립 영역어·slug=name_ko 결정론 로마자화)"
    examples:
      - "math.place-value.su-gaenyeomgwa-segi"
      - "math.equation.ichabangjeongsikgwa-ichahamsuui-gwangye-2"
      - "math.calculus.mibunui-jeongui"
    notes: >-
      area는 category(레벨 접두사 제거 후 토픽)를 AREA 코드로 매핑(idmap._TOPIC_AREA_MAP·전수)한 뒤
      교육과정-독립 영역어로 사상(idmap._AREA_SLUG_MAP·GEO→geometry 등), slug는 name_ko를
      hangul_romanize로 결정론 음역(외부 lib 0). (area, slug) 충돌은 (tier, src_id) 정렬로
      '-2'/'-3' 접미. 옛 '{TRACK}-{AREA}-{NNN}'·'UC.…'는 aliases에 보존(교육과정축 오버레이·롤백).

  source_id:
    type: string
    required: true
    description: >-
      원천 데이터셋 src_id(예 'N1'·'HK01'·'H:12대수01-01'). 재ID 전 식별자 보존 —
      canonical_id가 src_id에서 *파생*되었음을 추적(롤백·재현).
    example: "H:12미적Ⅰ01-01"

  aliases:
    type: list[string]
    required: false
    default: []
    description: >-
      옛 키 별칭 목록 — [교육과정축 코드('{TRACK}-{AREA}-{NNN}'·옛 P2a 정본), 레거시
      UC('UC.<domain>.<topic>.<slug>'), src_id]. 새 canonical_id로 전환한 뒤에도 옛 키·원천 키로
      join/조회 가능하게 보존(하위호환·matrix 개념축 오버레이). *재ID된* 개념(원천 코퍼스)은 axis·UC를
      반드시 보존하고, 시드 단계 *신규* 후보(source_id==concept_id)는 빈 목록일 수 있다.
    example: ["HIGH-CALC-001", "UC.calc1.a01.h-12-01-01", "H:12미적Ⅰ01-01"]

  # 표시이름(name_ko/en/ja)은 노드에서 제거됐다(2026-07-02 P2d·Part 9·Concept Purity) —
  # locale 계층(locales/{lang}.json·canonical_id 키)이 단일 진실. 노드는 표시문자열을 지지 않는다.

  domain:
    type: string
    required: true
    description: 영역명. NCIC 영역명 어휘와 정렬 (예 '미적분', '수와 연산').
    example: "미적분"

  grade_band_hint:
    type: string
    required: false
    description: >-
      전형적 도입 학년군. NCIC grade_band 어휘 재사용
      ('중학교 1~3학년군', '고등학교' 등). 단정이 아닌 힌트 — 매트릭스가 정밀 학년을 가짐.
    example: "고등학교"

  prerequisite_concept_ids:
    type: list[string]
    required: false
    default: []
    description: >-
      선수개념의 concept_id 목록. Edge(relation=prerequisite)와 *중복 저장* —
      그래프를 거치지 않는 조회 편의를 위함. 진실은 Edge, 이 필드는 캐시.
    references: concept.concept_id   # 자기참조 FK

  visualization_card_keys:
    type: list[string]
    required: false
    default: []
    description: >-
      L5 시각화 자산 키. L1은 *참조만* 보유하고 렌더링은 L5 책임.
      L5 시각화 자산은 별도 일정 — dangling 참조 가능, 검증은 경고 처리.
    references: "L5 visualization asset key (docs/architecture/05_interaction.md)"

  standard_codes:
    type: list[string]
    required: false
    default: []
    description: >-
      매핑된 NCIC 성취기준 코드. truth source 연결 — 이 개념이 어떤 성취기준에
      대응하는지. data_pipeline/ncic/models.py의 AchievementStandard.code를 가리킨다.
    references: AchievementStandard.code   # FK → src/data-pipeline/data_pipeline/ncic/models.py
    pattern: "STANDARD_CODE_PATTERN (NCIC) — 예 '[10공수1-01-01]', '[9수01-01]'"
    example: ["[10공수1-05-02]"]

  notes:
    type: string
    required: false
    description: 전문가 검수 메모. 개념 합치기·쪼개기 이력도 여기에 기록(ID 안정성 §3.5).

# --- 라이선스 승계 (concept_graph.md §1.1) ------------------------------------
license:
  asset_nature: "WhyMath 자체 자산"
  inherited_obligation: >-
    standard_codes가 NCIC에서 유래하므로 그래프 외부 노출·라이선싱 시 NCIC
    공공누리 1유형 출처 문구 동봉 필수. data_pipeline.concept_graph.models.SOURCE_CITATION
    상수로 강제 (NCIC 모듈과 동일 패턴).

# --- 검증 invariant (concept_graph.md §5 — data_pipeline tests 구현됨) --------
validation_invariants:
  - "concept_id가 'math.<area>.<slug>' 규약 준수 (id_conformance)"
  - "concept_id에 학년/트랙 토큰·NCIC 코드조각 부재 — 교육과정 무관 (curriculum_independence)"
  - "concept_id 유일 — canonical 충돌 0 (id_unique)"
  - "source_id 비공백 + 재ID된 개념은 옛 axis 코드 AND 옛 UC AND src_id 별칭 보존 (alias_roundtrip)"
  - "모든 category가 _TOPIC_AREA_MAP에 매핑 (area_map_total — 미매핑 0·침묵 폴백 금지)"
  - "locales/ko.json 키 == 노드 concept_id 집합·전건 name_ko 비공백 (locale_parity — 별도 검증)"
  - "ids.yaml registry 키 == 노드 concept_id 집합·필드/이관 정합 (registry_parity — 별도 검증)"
  - "prerequisite_concept_ids의 각 ID가 실재 (cross-node 참조)"
  - "dangling visualization_card_keys → 경고 (에러 아님)"
  - "concept 노드에 misconception_codes 등 오개녬 필드가 내장되어 있지 않음 (concept_purity)"
  - "고립 노드(엣지 0개) → 경고"
