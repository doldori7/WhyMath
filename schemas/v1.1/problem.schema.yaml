# =============================================================================
# problem.schema.yaml — 문제 (Problem)
# =============================================================================
# ⚠️ 구본 명세(비정본) — 2026-07-28 판정 (docs/architecture/problem_bank_gap_review.md §3 D1)
#   구현 정본은 src/backend/whymath_backend/schema/problem.py — 본 파일은 미구현이며 필드
#   체계가 상이하다. 아래 "저작권 안전선"의 평가원 기출 인용 스탠스는 2026-05-28 저작권
#   가이드 v2.0(metadata-only 전환)으로 대체되었다 — 평가원·EBS·검정교과서는 구조
#   메타데이터만 보유하고 본문은 담지 않는다(schema/problem.py `_METADATA_ONLY_SOURCES`).
# =============================================================================
# 엔티티 목적:
#   학생에게 출제되는 수학 문제 한 개. 출처·저작권·IRT 난이도 모수·활성 개념·
#   풀이 경로 ID·유형 클러스터 ID·다국어 변형을 담는다. 교과서 매핑은 "어떤
#   성취기준/개념인지"를 알려주는 인덱스일 뿐 — 문제의 *공급원*은 이 자체 코퍼스다
#   (교과서 예제·연습문제는 일절 담지 않는다).
#
# 소유 7계층:
#   L1/L3 — 문제 데이터 자산의 보유는 L1, 신규 문제 *생성*과 풀이 경로 연결은 L3.
#   (00_overview.md 컴포넌트 매트릭스에서 문제 코퍼스를 L1+L3 로 표기한 이유.)
#
# 관련 데이터 카드 / 아키텍처:
#   docs/architecture/01_data_foundation.md  자산 4(평가원 기출)·6(LLM 학습 데이터셋)
#   docs/architecture/03_content_generation.md  (다중 풀이 생성·SolutionPath)
#   .claude/agents/data-engineer.md  kice_problems 테이블 DDL
#
# 저작권 안전선:
#   ✅ 평가원 기출 — 교육적 인용 범위 내 본문 인용·해설 (인용 OK)
#   ✅ NuminaMath(Apache 2.0)·OmniMath(공개)·miniF2F(MIT) — 자유
#   ✅ 자체 생성 문제 — WhyMath 자산
#   ❌ 검정 교과서 예제·연습문제 — 일절 미수집 (자체 코퍼스 동등 문제로 대체)
#   ❌ EBS 교재 본문·학원 자료 — 미수집
#   copyright 필드로 출처·라이선스를 문제 단위 추적.
#
# 상태: 명세 단계. Phase 1 구현 대상.
# =============================================================================

entity: Problem
layer: "L1/L3"
storage: "PostgreSQL 16 (problems) + pgvector(문제 임베딩 동거 — 유사 문제 검색·슬98)"
primary_key: problem_id
phase_scope: "Phase 1 — 평가원 기출 5년치 + NuminaMath/OmniMath + 자체 생성"

fields:

  # --- 식별 ---------------------------------------------------------------
  problem_id:
    type: string
    required: true
    description: PK. 문제 식별자.

  problem_text:
    type: string
    required: true
    description: >-
      문제 본문 (자연어 + LaTeX 수식). 평가원 기출은 교육적 인용 범위 내에서만
      담는다. 검정 교과서 문제는 절대 여기 들어오지 않는다.

  answer:
    type: string
    required: false
    description: 정답. 객관식 번호 또는 값/식.

  # --- 출처·저작권 (문제 단위 추적) ---------------------------------------
  copyright:
    type: ProblemCopyright
    required: true
    description: 출처·라이선스 메타. 아래 구조. 저작권 안전선의 추적 단위.
    element_schema: ProblemCopyright

  # --- 분류 메타 ----------------------------------------------------------
  exam_type:
    type: string | null
    required: false
    description: "평가원 기출인 경우 시험 종류 (예: '수능', '6월모평', '9월모평')."

  year:
    type: integer | null
    required: false
    description: 출제 연도 (평가원 기출).

  subject:
    type: string | null
    required: false
    description: "과목 (예: '수학', '미적분', '확률과 통계')."

  problem_number:
    type: integer | null
    required: false
    description: 시험 내 문항 번호 (평가원 기출).

  # --- IRT 난이도 모수 (L2 학습자 모델이 추정·소비) ----------------------
  irt_parameters:
    type: IRTParameters
    required: false
    description: >-
      IRT 문항 모수. Phase 1 은 1PL(난이도 b)만, Phase 2 변별도 a, Phase 3 추측 c.
      모수 추정에는 다수 학생 응답 행렬이 필요 — Phase 1 β 단계에서는 불안정하므로
      difficulty_label(휴리스틱 라벨)을 우선 사용. 아래 구조.
    element_schema: IRTParameters

  difficulty_label:
    type: enum | null
    required: false
    description: 휴리스틱 난이도 라벨. IRT 모수가 안정되기 전 출제·필터링용.
    enum: [easy, medium, hard, killer]

  # --- 활성 개념 (primary / secondary / arithmetic_only) ------------------
  active_concepts:
    type: ActiveConcepts
    required: true
    description: >-
      이 문제가 활성화하는 개념들. 풀이의 핵심인 주개념, 보조 개념, 단순 계산에만
      쓰이는 개념을 구분해 담는다. 모두 Universal Concept ID. 아래 구조.
    element_schema: ActiveConcepts

  standard_codes:
    type: list<string>
    required: false
    default: []
    description: 매핑된 NCIC 성취기준 코드. 모든 콘텐츠는 성취기준 코드 1개 이상 태그(CLAUDE.md).
    relation:
      references: "AchievementStandard.code  (src/data-pipeline/data_pipeline/ncic/models.py)"
      pattern: "STANDARD_CODE_PATTERN"

  # --- 풀이 경로 연결 -----------------------------------------------------
  solution_path_ids:
    type: list<string>
    required: false
    default: []
    description: >-
      이 문제에 대해 L3 가 생성한 SolutionPath 들의 ID. 한 문제에 여러 풀이 경로
      (대수적·기하적 등 6가지 접근). 다중 풀이 노출(L4 절대 원칙 4)의 데이터 토대.
    relation:
      references: "SolutionPath.solution_path_id  (solution_path.schema.yaml)"
      cardinality: "1:N"

  # --- 유형 클러스터 -----------------------------------------------------
  type_cluster_id:
    type: string | null
    required: false
    description: >-
      문제 유형 클러스터 식별자. 임베딩 기반 군집(HDBSCAN/UMAP — PRD v1.1 흡수
      스택)으로 "같은 유형의 문제"를 묶은 결과. 어댑티브 출제·유형별 연습에 사용.

  techniques:
    type: list<string>
    required: false
    default: []
    description: "이 문제가 요구하는 풀이 기법 태그 (예: ['discriminant', 'inequality'])."

  # --- 다국어 변형 -------------------------------------------------------
  language_variants:
    type: "map<string, ProblemLanguageVariant>"
    required: false
    default: {}
    description: >-
      언어별 문제 변형. key 는 언어 코드(ko/en/ja 등), value 는 해당 언어의
      problem_text·answer. 원문과 동일 문제의 번역·현지화 (다국 매트릭스와 정합).
      Phase 1 은 ko 중심, 다국어는 Phase 3.
    element_schema: ProblemLanguageVariant

  embedding:
    type: list<float>
    required: false
    description: >-
      문제 임베딩 벡터. 유사 문제 검색·유형 클러스터링용. 임베딩 모델은
      OpenAI text-embedding-3-large (PRD v1.1 흡수 스택). pgvector 동거 저장(슬98).

  created_at:
    type: datetime
    required: true
    description: 문제 등록 시각.

# =============================================================================
# ProblemCopyright — 출처·저작권 메타
# =============================================================================
ProblemCopyright:
  description: 문제 단위 저작권 추적. 저작권 안전선 준수의 핵심.
  fields:
    source_type:
      type: enum
      required: true
      description: 출처 유형.
      enum:
        kice_past_exam:   "평가원 기출 — 교육적 인용 범위 (인용·해설 OK)"
        numina_math:      "NuminaMath — Apache 2.0 (자유)"
        omni_math:        "OmniMath — 공개"
        mini_f2f:         "miniF2F — MIT (Lean 형식화)"
        self_generated:   "WhyMath 자체 생성 — 자체 자산"
    license:
      type: string
      required: true
      description: "라이선스 명 (예: 'Apache 2.0', 'MIT', '교육적 인용', 'WhyMath 자체')."
    source_url:
      type: string | null
      required: false
      description: 원자료 URL.
    attribution_text:
      type: string | null
      required: false
      description: 출처 표시 의무가 있는 경우 동봉할 문구.
    citation_scope_note:
      type: string | null
      required: false
      description: >-
        인용 범위 메모 — 평가원 기출의 경우 "본문 그대로 재배포 금지, 인용·해설만"
        같은 제약을 명시. CLAUDE.md 저작권 금기 준수의 문서화.

# =============================================================================
# IRTParameters — IRT 문항 모수 (L2 가 추정·소비)
# =============================================================================
IRTParameters:
  description: >-
    IRT 문항 모수. L1 은 필드를 보유하고 L2 학습자 모델이 다수 응답으로 추정한다.
    Phase 1 1PL → Phase 2 2PL → Phase 3 3PL 단계 도입.
  fields:
    difficulty_b:
      type: float | null
      required: false
      description: 난이도 모수 b (1PL/Rasch — Phase 1). 보통 -3~+3.
    discrimination_a:
      type: float | null
      required: false
      description: 변별도 모수 a (2PL — Phase 2). Phase 1 에는 null.
    guessing_c:
      type: float | null
      required: false
      description: 추측 모수 c (3PL — Phase 3). Phase 1~2 에는 null.
    n_responses:
      type: integer
      required: false
      default: 0
      description: 모수 추정에 쓰인 응답 수. 적으면 모수 불안정 — difficulty_label 우선.
    last_calibrated_at:
      type: datetime | null
      required: false
      description: 모수 최종 보정 시각.

# =============================================================================
# ActiveConcepts — 활성 개념 (primary / secondary / arithmetic_only)
# =============================================================================
ActiveConcepts:
  description: >-
    문제가 활성화하는 개념을 역할별로 구분. 모두 Universal Concept ID
    (concept.schema.yaml 와 동일 키 공간).
  fields:
    primary:
      type: list<string>
      required: true
      description: 주개념 — 이 문제 풀이의 핵심이 되는 개념.
      relation:
        references: concept.concept_id
    secondary:
      type: list<string>
      required: false
      default: []
      description: 보조 개념 — 풀이에 필요하지만 핵심은 아닌 개념.
      relation:
        references: concept.concept_id
    arithmetic_only:
      type: list<string>
      required: false
      default: []
      description: >-
        단순 계산에만 쓰이는 개념 — 이 문제의 학습 목표가 아니라 도구로만 등장.
        어댑티브 출제 시 "이 개념을 평가하려는 문제"에서 제외하기 위한 구분.
      relation:
        references: concept.concept_id

# =============================================================================
# ProblemLanguageVariant — 언어별 문제 변형
# =============================================================================
ProblemLanguageVariant:
  description: 한 문제의 특정 언어 버전.
  fields:
    problem_text:
      type: string
      required: true
      description: 해당 언어의 문제 본문.
    answer:
      type: string | null
      required: false
      description: 해당 언어의 정답 표기.

# -----------------------------------------------------------------------------
# 엔티티 간 관계 요약
# -----------------------------------------------------------------------------
relationships:
  - target: "AchievementStandard (NCIC, src/data-pipeline/data_pipeline/ncic/models.py)"
    via: "standard_codes"
    kind: "N:M — 문제가 NCIC 성취기준에 태그됨 (콘텐츠는 성취기준 1개 이상 태그 — CLAUDE.md)"
  - target: "Concept (concept.schema.yaml)"
    via: "active_concepts.primary / secondary / arithmetic_only"
    kind: "N:M — 문제가 활성화하는 개념 노드들 (역할별 구분)"
  - target: "SolutionPath (solution_path.schema.yaml)"
    via: "solution_path_ids ↔ SolutionPath.problem_id"
    kind: "1:N — 한 문제에 여러 풀이 경로 (6가지 접근)"
  - target: "MasteryState (mastery_state.schema.yaml)"
    via: "irt_parameters 가 L2 의 IRT theta 추정과 짝을 이룸"
    kind: >-
      간접 — Problem.irt_parameters(문항측 모수)와 MasteryState.irt_theta(학생측
      능력)가 같은 IRT 모델의 양면. L2 가 문제 응답으로 양쪽을 함께 갱신.
  - target: "TextbookUnit (textbook_mapping.schema.yaml)"
    via: "공유하는 standard_codes·concept_ids 를 통한 간접 연결"
    kind: >-
      간접 — 교과서 단원이 "어떤 성취기준/개념인지" 인덱스를 주면, 그 키로 이
      Problem 코퍼스에서 동등 문제를 조회 (textbook_mapping.md §4.2 — 교과서 문제 대체).

# -----------------------------------------------------------------------------
# 검증 invariant (명세 — 테스트 미구현)
# -----------------------------------------------------------------------------
validation_invariants:
  - "copyright.source_type 가 enum 5종 밖이면 거부"
  - "copyright.source_type='self_generated' 외에는 source_url 또는 attribution_text 권장"
  - "standard_codes·active_concepts 의 모든 코드가 NCIC/개념 그래프 키 공간에 실재"
  - "difficulty_label 이 4종 enum 밖이면 거부"
  - "검정 교과서·EBS·학원 출처 source_type 없음 (저작권 안전선 — 애초에 enum 에 없음)"
  - "모든 문제가 standard_codes 또는 active_concepts.primary 중 하나 이상 비어있지 않음"
