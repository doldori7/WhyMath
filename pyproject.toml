# 레포 루트 lint 정본 (OPS-15)
#
# 왜 이 파일이 생겼는가
# --------------------
# 이 저장소는 패키지 루트가 `src/backend`·`src/data-pipeline` 두 곳이고, lint 설정도
# 그 두 pyproject에만 있었다. 그래서 **`src/` 밖은 저장소 표준이 적용된 적이 없다** —
# ruff는 파일마다 조상 디렉터리에서 설정을 찾는데 레포 루트에 아무것도 없으니
# `tests/infra`·`tests/harness`·`tests/data_pipeline`·`scripts`·`infra`·`conftest.py`가
# 전부 **ruff 기본값**(line-length 88 · select E4,E7,E9,F)으로 검사돼 왔다.
#
# 즉 OPS-11·12·13·14가 lint를 "배선"했지만 **기준이 저장소 표준이 아니었다**.
# "장치는 있는데 *잘못된 설정으로* 배선됨" — 배선 유무만 보는 기존 검사
# (`test_lint_coverage`·`test_infra_lint_wiring`)가 구조적으로 못 잡던 축이다.
# 2026-07-28 실측: 표준 적용 시 N802 192건 + 나머지 44건이 드러났다.
#
# black에도 같은 함정이 있었다 — 루트에 설정이 없으면 경로를 두 개 이상 준 순간
# 프로젝트 루트 탐지가 레포 루트로 올라가 **기본값 88자로 조용히 강등**된다
# (OPS-14 실측: `src/data-pipeline`의 clean한 77파일이 89파일 FAIL로 뒤집혔다).
# 이 파일이 그 강등을 원천 제거한다.
#
# 범위 주의: `src/backend`·`src/data-pipeline`은 **자기 pyproject가 더 가까워** 그쪽
# 설정이 이긴다(ruff·black 모두 최근접 설정 우선). 이 파일은 그 밖을 덮는다.
# 세 파일의 line-length·select는 의도적으로 동일하게 유지한다 — 갈리면 무의미하다.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# src/backend·src/data-pipeline의 pyproject와 **동일**해야 한다. 규칙이 갈리면
# 같은 코드가 위치에 따라 다르게 판정돼 표준이라는 말이 무의미해진다.
select = ["E", "F", "I", "N", "B", "W"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py312"]
