# EOS 검증 앵커 세트 v1 — G0 동결본 (1급 등록 · EOS-56)
#
# 지위
# ----
# 12월 내부 검증(EOS 전환)의 **측정 조인 축** 정본이다. 앵커 = "성취기준 코드의 동결된
# 묶음"이며, 원자·오개념·문항·op-code 자산은 전부 이 코드 축으로 앵커에 귀속된다.
#
# 동결 근거
# ---------
#   · 게이트: G-eos-g0-verification-design-freeze (2026-08-30 Kiki 서명 clear)
#   · 설계 정본: docs/standards/eos_verification_design_v1.md §1-1(앵커 6개 확정)·§2(앵커 표)
#   · 실측 근거: docs/reviews/eos_anchor_asset_audit_2026-09.md (EOS-52 자산 실사)
#
# 단방향 관례 (CLAUDE.md "YAML=소스 · DB=산출물")
# ----------------------------------------------
# 이 파일이 소스다. DB·리포트·감사 스크립트는 전부 이 파일을 **읽기만** 한다. 역방향
# (DB에서 앵커 정의를 되읽어 이 파일을 갱신)은 금지 — 이중 진실 원천이 된다.
#
# scope 축 — 왜 8건이 실려 있는가
# --------------------------------
# G0에서 확정된 12월 검증 대상은 **6개(A1~A6)**다. A7·A8은 2027-01 이월인데도 여기 남기는
# 이유는, 이월이 *데이터*여야 하기 때문이다 — 목록에서 지우면 "왜 대학 앵커가 빠졌는가"의
# 근거(전환 설계서 옵션 ② 명시 손실: 대학 범위 자동검증 한계선의 12월 확인)가 코드·문서
# 어디에도 남지 않고, EOS-52 실사 문서(8앵커 기준)의 재현도 깨진다.
#   december_2026     — 12월 검증 대상 (6건 · G0 확정)
#   deferred_2027_01  — 2027-01 이월 (2건 · 오개념·문항·기계판정 채널이 전부 0에서 시작)
#
# 필드
# ----
#   codes     — 동결 성취기준 코드셋. 학교급은 2022 개정(data/corpus/standards_v1),
#               대학은 와이매스 자체작성(data/corpus/standards_university_v1).
#   excluded  — 인접 코드를 **왜 뺐는지** 명시(재현 가능성). 경계가 문서에만 있으면
#               6개월 뒤 아무도 A4에서 인수분해를 뺀 이유를 복원할 수 없다.
#   baseline  — 기준선 앵커(A3·A4·중등). F-Ⅰ(HIT 중앙값 > 12분/CU) 판정 대상.
#   depth     — 깊이 앵커(A4 단독). 폐쇄루프 완결 판정 대상.
#   production_cu / review_cu — §2 표의 생산·인간 검수 CU 물량(이월분은 null).
#
# 무결성 게이트
# -------------
# codes 전건이 성취기준 코퍼스에 실재하는지 CI가 매 PR 검사한다(코드 소멸 시 적색):
#   tests/backend/l1/test_eos_anchor_registry.py
# 트리거 배선: .github/workflows/ci.yml 의 backend 경로 필터가 `data/corpus/` 를 포함하므로
# 성취기준 코퍼스 단독 수정 PR에서도 이 검사가 실행된다(게이트가 자기 입력 변경에 깨어난다).
#
# 소비 지점 — 집행 별항 (EOS-56 acceptance ③)
# -------------------------------------------
# "정본화 ≠ 집행"이므로, 이 파일을 *실제로 읽는 코드*를 여기 열거한다. 등록만 해 두고 아무도
# 읽지 않으면 하드코딩 상수가 사실상의 정본으로 남는다.
#
#   [착지] scripts/analysis/eos_anchor_asset_audit.py — ANCHOR_DEFS 상수 소멸. 이 파일을 읽어
#          8앵커를 감사한다(EOS-52 실사 문서 재현성 유지). 되살아남 차단 =
#          tests/backend/l1/test_eos_anchor_registry.py::TestAuditScriptReadsTheRegistry
#   [착지] whymath_backend.l1.standards.anchor_registry — 백엔드 읽기 API·판정 CLI(exit 0/1)
#   [착지] tests/backend/harness/test_golden_benchmark.py — 골든 벤치마크의 ANCHOR_IDS 6종이
#          이 등록의 december_2026 집합과 일치하는지 동결(이월 판정도 scope 필드로 한다)
#
#   [후속] whymath_backend.harness.golden_benchmark.ANCHOR_IDS — 아직 모듈 상수다. 지금은 위
#          동결 테스트가 드리프트를 막지만, 런타임 파생으로 바꾸면 상수 자체가 사라진다.
#          import 시점 파일 I/O를 들이는 판단이 필요해 별건으로 남긴다(EOS-60 골든 계약 소유).
#   [후속] 생산 배치 — 앵커별 생성·검수·집계를 도는 배치는 아직 없다. 만들어질 때 앵커 목록을
#          다시 하드코딩하지 말고 이 등록을 읽는다. 좌석: EOS-58(앵커 E2E 생성 증명)·
#          EOS-64(앵커 E2E 야간 골든)·EOS-61(검증 스코어카드 집계)·MISC-07(기계판정 채널).

