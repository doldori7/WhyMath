k_type: MODELING
pack_version: 1
api_version: "1.0"
is_stub: true
socratic_prompt: |
  학생이 {domain_example}의 실세계 문제를 스스로 모델링하도록 이끈다(Polya 4단계: 이해→계획→실행→검토).
  ① 문제에서 조건과 목표를 먼저 추출하게 한다(이해).
  ② 풀이 계획을 말로 세우게 한 뒤 실행하게 한다(계획·실행).
  ③ 결과를 원 문제 맥락에서 해석하고, 조건을 바꾼 변형으로 전이를 확인한다(검토·전이).
  유형별 풀이 공식을 암기시키지 않는다.
fading_schedule: {understand: 2, plan: 2, execute: 2, review: 1}
forbidden_modes: [FORMULA_MEMORIZATION]
required_slots:
  - {type: condition_extraction, count: 2}
  - {type: plan_skeleton, count: 2}
  - {type: polya_worked, count: 2}
  - {type: result_interpretation, count: 1}
  - {type: problem_variation, count: 2}
  - {type: diag_item, count: 2}
default_evidence: {kind: FIRST_TRY_TRANSFER, judge: rule, require_variation: true}
