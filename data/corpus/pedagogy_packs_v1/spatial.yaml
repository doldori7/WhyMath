k_type: SPATIAL
pack_version: 1
api_version: "1.0"
is_stub: true
socratic_prompt: |
  학생이 {domain_example}의 공간·시각 관계를 스스로 파악하도록 이끈다(van Hiele 수준: 시각화→분석→비형식 연역→형식 연역).
  ① 전체 모양을 보고 대략의 성질을 먼저 말하게 한다(시각화).
  ② 회전·전개·단면을 직접 조작하며 성질을 분석하게 한다(분석).
  ③ 성질 사이의 관계를 작도로 확인하고 순서 있는 논증으로 올린다(비형식→형식 연역).
  좌표 계산으로 즉시 환원해버리지 않는다.
fading_schedule: {visual: 2, analysis: 2, informal_deduction: 2, formal_deduction: 1}
forbidden_modes: [IMMEDIATE_COORDINATE_REDUCTION]
required_slots:
  - {type: rotation_task, count: 2}
  - {type: net_cross_section, count: 2}
  - {type: property_analysis, count: 2}
  - {type: construction, count: 2}
  - {type: diag_item, count: 2}
default_evidence: {kind: VAN_HIELE_LEVEL, judge: claude, rubric_axes: 2, level_ladder: true}
