[project]
name = "whymath-data-pipeline"
version = "0.1.0"
description = "WhyMath L1 데이터 파이프라인 — NCIC 성취기준·학교알리미·검정교과서·평가원 기출·OER 수집·정제·검증"
requires-python = ">=3.12"
authors = [
    { name = "WhyMath", email = "contact@whymath.example" },
]

dependencies = [
    # HTTP·크롤링
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    # 정형화·검증
    "pydantic>=2.9.0",
    # PDF 파싱 (NCIC 폴백 경로)
    "pdfplumber>=0.11.4",
    # CLI
    "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
    # 상한 핀 — 2026-05-14 검증된 최신까지 허용 (black 26·mypy 2.1·pytest 9·ruff 0.15
    # 전부 CI 4스텝 통과 확인). 다음 메이저(black 27·mypy 3·pytest 10·ruff 0.16)는
    # 재검증 후 상한을 올린다. 핀의 목적은 CI 재현성 — 도구 자동 업그레이드로 인한
    # 예고 없는 빌드 깨짐 방지.
    "pytest>=8.3.3,<10",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",            # httpx 모킹
    "mypy>=1.13.0,<3",
    "ruff>=0.7.0,<0.16",
    "black>=24.10.0,<27",
    "types-beautifulsoup4>=4.12.0.20240907",
]
# JS 렌더가 필요한 NCIC 페이지에 대한 폴백. 기본 의존성은 아님.
playwright = [
    "playwright>=1.48.0",
]
# Phase 2+ PostgreSQL 적재용. Phase 1 (현재) 미배포 상태 → optional.
postgres = [
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
]

[project.scripts]
whymath-ncic = "data_pipeline.ncic.__main__:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline"]

# ──────────────────────────────────────────────────────────────────────
# 린터·포맷
# ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "W"]
# 한국어 식별자 사용 금지 (N) 비활성: 한국어 docstring·문자열만 쓰고 식별자는 영어
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]   # 테스트 픽스처에 긴 한국어 문자열 허용

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
# 외부 라이브러리(pdfplumber 등)는 타입 스텁 미제공 가능
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ──────────────────────────────────────────────────────────────────────
# 테스트
# ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests/data_pipeline"]
# importlib 모드 — 테스트 디렉토리가 `data_pipeline`과 동명이라도 충돌 없음
# (전통 'prepend' 모드는 tests/data_pipeline을 sys.path에 추가하여 실패)
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--rootdir=../..",
]
markers = [
    "integration: 통합 테스트 (실 네트워크 호출 가능 — 기본 skip)",
]

[tool.coverage.run]
source = ["data_pipeline"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
