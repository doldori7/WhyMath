[project]
name = "korean-math-backend"
version = "0.1.0"
description = "WhyMath 백엔드"
requires-python = ">=3.12"
dependencies = [
    # 웹 프레임워크
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # 데이터베이스
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    # 캐시·큐
    "redis[hiredis]>=5.1.0",
    "celery>=5.4.0",
    # 외부 통신
    "httpx>=0.27.2",
    # LLM
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "ollama>=0.4.0",
    # 벡터 DB·임베딩
    "chromadb>=0.5.15",
    "sentence-transformers>=3.1.0",
    # 인증·보안
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # 관측성
    "langfuse>=2.50.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "structlog>=24.4.0",
    # 데이터
    "pandas>=2.2.3",
    "polars>=1.10.0",
    "great-expectations>=1.0.0",
    # PDF·OCR·시각화
    "pdfplumber>=0.11.4",
    "sympy>=1.13.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mocktail>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "W"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
