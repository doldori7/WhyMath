[project]
name = "korean-math-backend"
version = "0.1.0"
description = "WhyMath 백엔드"
requires-python = ">=3.12"
dependencies = [
    # 웹 프레임워크
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # 데이터베이스
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    # psycopg(sync) — 슬105 PgVectorIndex 전용(벡터 store 좌석에 한정된 sync 드라이버).
    # 앱 본체는 async(asyncpg)이고, 이 sync 드라이버는 VectorIndex Protocol이 sync라 *영속
    # 벡터 인덱스 좌석에만* 도입한다. import는 PgVectorIndex 내부 lazy — 기본(memory) 경로는
    # psycopg 불요. async 앱 엔진은 무변경 (MEMORY 2026-06-10 슬105 결정 로그).
    "psycopg[binary]>=3.1",
    "alembic>=1.13.3",
    # 캐시·큐
    "redis[hiredis]>=5.1.0",
    "celery>=5.4.0",
    # 외부 통신
    "httpx>=0.27.2",
    # LLM
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "ollama>=0.4.0",
    # 벡터 DB(pgvector·Postgres 통합) — 마이그레이션·ORM이 top-level import라 메인 의존성 유지.
    "pgvector>=0.3.0",
    # 임베딩(sentence-transformers·bge-m3→torch 수 GB)은 [embedding] extra로 분리(슬110 #6) —
    # 기본(memory·게이트 off) 경로는 lazy import라 미사용. provider.py가 함수내 lazy import하고
    # mypy는 ignore_missing_imports=true라, extra 미설치 환경에서도 collection·hermetic·mypy green.
    # 인증·보안
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # 관측성
    "langfuse>=2.50.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "structlog>=24.4.0",
    # 데이터
    "pandas>=2.2.3",
    "polars>=1.10.0",
    "great-expectations>=1.0.0",
    # PDF·OCR·시각화
    "pdfplumber>=0.11.4",
    "sympy>=1.13.3",
]

[project.optional-dependencies]
# 임베딩(로컬 bge-m3) — sentence-transformers→torch(수 GB). 의미 매칭(슬104~)·라이브 통합
# 측정에 필요. 기본 배포·hermetic CI는 불요(lazy import·FakeEmbeddingProvider). 설치:
# `pip install -e ".[dev,embedding]"`. (OpenAI 임베딩은 openai 메인 의존성으로 별도.)
embedding = [
    "sentence-transformers>=3.1.0",
]
# L5 OCR(Phase A) — 손글씨 풀이 인식 경량 백엔드. rapidocr(검출·한글 텍스트)·rapid_latex_ocr
# (수식→LaTeX)는 ONNX 런타임 기반(torch 불요). pillow·numpy는 이미지 디코드/크롭(파이프라인
# `_decode_image` lazy import). 기본 배포·hermetic CI는 불요 — `ocr_enabled=False` + 함수내
# lazy import라 미설치 환경에서도 collection·import·mypy(ignore_missing_imports) green. 설치:
# `pip install -e ".[dev,ocr]"`. 미설치 시 부품은 명확한 RuntimeError(조용한 폴백 없음).
ocr = [
    "rapidocr-onnxruntime>=1.3.0",
    "rapid-latex-ocr>=0.0.9",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
]
# L5 OCR(Phase B) — MFD(수식 영역 검출). rapid-layout는 RapidAI의 레이아웃 분석으로
# **Apache-2.0**·순수 ONNXRuntime(torch/ultralytics 불요)다. PP 계열 모델만 쓴다 —
# ultralytics 기반(yolov8*/doclayout*)은 AGPL-3.0이라 코드에서 거부한다(결정 우선순위 #2).
# lazy import라 미설치 CI에서도 green. 설치: `pip install -e ".[dev,ocr,ocr-layout]"`.
ocr-layout = [
    "rapid-layout>=1.2.0",
]
# L5 OCR(Phase C) — 무거운 백엔드(torch 수 GB). TexTeller·Qwen3-VL(transformers). Phase A/B
# 미사용(스텁 좌석)이라 분리한다. 실제 모델 배선은 후속 슬라이스. ultralytics(AGPL)는
# 제외한다 — MFD는 rapid-layout(Apache-2.0)으로 대체했다(우선순위 #2 법적 준수).
ocr-heavy = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
]
dev = [
    # 상한 핀 — data-pipeline에서 검증된 상한을 동일 적용 (2026-05-14).
    # 백엔드 CI 4스텝(ruff·black·mypy·pytest)을 동일 floor·동일 도구로 핀해
    # data-pipeline과 재현성을 일치시킨다. 다음 메이저는 재검증 후 상한을 올린다.
    "pytest>=8.3.3,<10",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.13.0,<3",
    "ruff>=0.7.0,<0.16",
    "black>=24.10.0,<27",
    # import-linter — 7계층 단방향(L_n→L_{n-1}) 정적 강제(감사 I4). `lint-imports`가 CI lint
    # 잡에서 계약 위반(예: L1이 L4를 위로 import)을 차단한다. 순수 정적 그래프 분석이라 런타임·
    # 라이브 의존 0(hermetic).
    "import-linter>=2.0,<3",
    # 메모(M1.2): 기존 dev 핀에 있던 `mocktail>=1.0.0`은 *배포된 버전이 없어*
    # (PyPI 최신 0.0.4) `pip install -e .[dev]`를 실패시켜 CI를 깨뜨린다. M1.2
    # 라우터 단위테스트는 외부 모킹 라이브러리가 필요 없으므로(순수 결정 로직 +
    # interfaces.py 인메모리 스텁) 해당 핀을 제거한다. 모킹 라이브러리가 실제로
    # 필요해지면 (예: 라이브 LLM 연동 시) data-pipeline처럼 검증된 라이브러리를
    # 재도입한다.
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whymath_backend"]
# 패키지 데이터(라벨 프로브셋 JSONL) — 설치된 wheel에서도 `importlib.resources`로 로드 가능하게
# 명시 포함한다(WH-1 ② 오프라인 진단정확도·semantic_eval 프로브 단일 source of truth).
artifacts = ["whymath_backend/l4/misconception/probes_v1.jsonl"]

[tool.hatch.build.targets.wheel.force-include]
"whymath_backend/l4/misconception/probes_v1.jsonl" = "whymath_backend/l4/misconception/probes_v1.jsonl"

# ──────────────────────────────────────────────────────────────────────
# 린터·포맷
# ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "W"]
# 한국어 식별자 사용 금지 (N) 비활성 안 함: docstring·문자열만 한국어, 식별자는 영어
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]   # 테스트 픽스처에 긴 한국어 문자열 허용

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
# 외부 라이브러리(langfuse·ollama 등)는 타입 스텁 미제공 가능
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ──────────────────────────────────────────────────────────────────────
# import-linter — 7계층 단방향 의존 강제 (감사 I4·CLAUDE.md "L_n→L_{n-1}, 역방향 금지")
# ──────────────────────────────────────────────────────────────────────
# 수학 코어(L1~L4)를 UI 밖 독립 플랫폼으로 지키는 핵심 invariant를 *정적*으로 못 박는다.
# layers 계약: 위 레이어는 아래를 import할 수 있으나(호출), 아래는 위를 import할 수 없다(역방향
# 금지). schema는 최하위(순수 타입·어느 계층도 import 안 함). 미열거 패키지(config·db·privacy·
# harness·whs)는 계약 밖(무제약) — harness/whs는 L3/L4 하네스라 상위 호출이 정상이고, config·db·
# privacy는 횡단 인프라다. `lint-imports`(CI lint 잡)가 위반을 차단한다.
[tool.importlinter]
root_package = "whymath_backend"

[[tool.importlinter.contracts]]
name = "7계층 단방향 (L_n → L_{n-1}, 역방향 금지)"
type = "layers"
layers = [
    "whymath_backend.api",
    "whymath_backend.l6",
    "whymath_backend.l5",
    "whymath_backend.l4",
    "whymath_backend.l3",
    "whymath_backend.l2",
    "whymath_backend.l1",
    "whymath_backend.schema",
]

# ──────────────────────────────────────────────────────────────────────
# 테스트
# ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests/backend"]
# importlib 모드 — 테스트 디렉토리(tests/backend)와 패키지(whymath_backend)
# 동명 충돌 없음. data-pipeline과 동일 레이아웃.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--rootdir=../..",
]
markers = [
    "integration: 통합 테스트 (실 네트워크·라이브 서비스 호출 가능 — 기본 skip)",
]

[tool.coverage.run]
source = ["whymath_backend"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
