[project]
name = "korean-math-backend"
version = "0.1.0"
description = "WhyMath 백엔드"
requires-python = ">=3.12"
dependencies = [
    # 웹 프레임워크
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # 데이터베이스
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    # psycopg(sync) — 슬105 PgVectorIndex 전용(벡터 store 좌석에 한정된 sync 드라이버).
    # 앱 본체는 async(asyncpg)이고, 이 sync 드라이버는 VectorIndex Protocol이 sync라 *영속
    # 벡터 인덱스 좌석에만* 도입한다. import는 PgVectorIndex 내부 lazy — 기본(memory) 경로는
    # psycopg 불요. async 앱 엔진은 무변경 (MEMORY 2026-06-10 슬105 결정 로그).
    "psycopg[binary]>=3.1",
    "alembic>=1.13.3",
    # 캐시·큐
    "redis[hiredis]>=5.1.0",
    "celery>=5.4.0",
    # 외부 통신
    "httpx>=0.27.2",
    # LLM
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "ollama>=0.4.0",
    # 벡터 DB(pgvector·Postgres 통합) — 마이그레이션·ORM이 top-level import라 메인 의존성 유지.
    "pgvector>=0.3.0",
    # 임베딩(sentence-transformers·bge-m3→torch 수 GB)은 [embedding] extra로 분리(슬110 #6) —
    # 기본(memory·게이트 off) 경로는 lazy import라 미사용. provider.py가 함수내 lazy import하고
    # mypy는 ignore_missing_imports=true라, extra 미설치 환경에서도 collection·hermetic·mypy green.
    # 인증·보안
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # 관측성
    "langfuse>=2.50.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "structlog>=24.4.0",
    # 데이터
    "pandas>=2.2.3",
    "polars>=1.10.0",
    "great-expectations>=1.0.0",
    # PDF·OCR·시각화
    "pdfplumber>=0.11.4",
    "sympy>=1.13.3",
]

[project.optional-dependencies]
# 임베딩(로컬 bge-m3) — sentence-transformers→torch(수 GB). 의미 매칭(슬104~)·라이브 통합
# 측정에 필요. 기본 배포·hermetic CI는 불요(lazy import·FakeEmbeddingProvider). 설치:
# `pip install -e ".[dev,embedding]"`. (OpenAI 임베딩은 openai 메인 의존성으로 별도.)
embedding = [
    "sentence-transformers>=3.1.0",
]
dev = [
    # 상한 핀 — data-pipeline에서 검증된 상한을 동일 적용 (2026-05-14).
    # 백엔드 CI 4스텝(ruff·black·mypy·pytest)을 동일 floor·동일 도구로 핀해
    # data-pipeline과 재현성을 일치시킨다. 다음 메이저는 재검증 후 상한을 올린다.
    "pytest>=8.3.3,<10",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.13.0,<3",
    "ruff>=0.7.0,<0.16",
    "black>=24.10.0,<27",
    # 메모(M1.2): 기존 dev 핀에 있던 `mocktail>=1.0.0`은 *배포된 버전이 없어*
    # (PyPI 최신 0.0.4) `pip install -e .[dev]`를 실패시켜 CI를 깨뜨린다. M1.2
    # 라우터 단위테스트는 외부 모킹 라이브러리가 필요 없으므로(순수 결정 로직 +
    # interfaces.py 인메모리 스텁) 해당 핀을 제거한다. 모킹 라이브러리가 실제로
    # 필요해지면 (예: 라이브 LLM 연동 시) data-pipeline처럼 검증된 라이브러리를
    # 재도입한다.
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whymath_backend"]

# ──────────────────────────────────────────────────────────────────────
# 린터·포맷
# ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "W"]
# 한국어 식별자 사용 금지 (N) 비활성 안 함: docstring·문자열만 한국어, 식별자는 영어
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]   # 테스트 픽스처에 긴 한국어 문자열 허용

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
# 외부 라이브러리(langfuse·ollama 등)는 타입 스텁 미제공 가능
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ──────────────────────────────────────────────────────────────────────
# 테스트
# ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests/backend"]
# importlib 모드 — 테스트 디렉토리(tests/backend)와 패키지(whymath_backend)
# 동명 충돌 없음. data-pipeline과 동일 레이아웃.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--rootdir=../..",
]
markers = [
    "integration: 통합 테스트 (실 네트워크·라이브 서비스 호출 가능 — 기본 skip)",
]

[tool.coverage.run]
source = ["whymath_backend"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
