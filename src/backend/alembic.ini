# alembic 설정 — WhyMath 영속 레이어(SQLAlchemy 2.0 async).
#
# sqlalchemy.url은 *비워둔다* — env.py가 whymath_backend.config.Settings().database_url
# (WHYMATH_DATABASE_URL env 오버라이드)에서 읽는다. 자격증명을 ini에 두지 않기 위함
# (CLAUDE.md 보안 금기: 시크릿 하드코딩 금지). 마이그레이션 실행은 src/backend에서:
#   alembic revision --autogenerate -m "..."   (메인이 로컬 PG로 수행·검증)
#   alembic upgrade head

[alembic]
# 마이그레이션 스크립트 위치(이 ini 기준 상대경로).
script_location = alembic

# 마이그레이션 파일명 템플릿 — 생성 시각 접두로 정렬성 확보.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 경로 구분자(권장값) — versions 경로 분해 방식.
version_path_separator = os

# env.py·스크립트의 기준 디렉토리를 script_location 기준으로 잡는다.
prepend_sys_path = .

# sqlalchemy.url은 비워둔다(env.py가 Settings에서 주입). ini에 자격증명 금지.
sqlalchemy.url =


# ── 로깅 (alembic 표준) ──
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
