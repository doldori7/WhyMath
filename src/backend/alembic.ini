# Alembic config for WhyMath's persistence layer (SQLAlchemy 2.0 async).
#
# NOTE (keep this file ASCII-only): Alembic (>=1.14ish) reads this file with
# encoding="locale" hardcoded in alembic/util/compat.py, with no CLI/env
# override. On Korean-locale Windows that resolves to cp949, which cannot
# decode UTF-8 Korean text -> UnicodeDecodeError on `alembic upgrade head`.
# See docs/architecture in Korean for prose; this file stays English-only.
#
# sqlalchemy.url is left *empty* on purpose -- env.py reads it from
# whymath_backend.config.Settings().database_url (overridable via the
# WHYMATH_DATABASE_URL env var) so no credentials live in this ini file
# (CLAUDE.md security rule: no hardcoded secrets). Run migrations from
# src/backend:
#   alembic revision --autogenerate -m "..."   (author on local PG, then review)
#   alembic upgrade head

[alembic]
# Migration script location (relative to this ini file).
script_location = alembic

# Migration filename template -- timestamp prefix keeps files sorted.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Path separator (recommended value) for decomposing the versions path.
version_path_separator = os

# Base directory for env.py/scripts, relative to script_location.
prepend_sys_path = .

# Left empty -- env.py injects the URL from Settings. No credentials here.
sqlalchemy.url =


# -- Logging (standard Alembic config) --
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
