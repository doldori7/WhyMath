name: korean_math_app
description: 한국 중·고 수학 메타인지 코칭 앱
publish_to: 'none'
version: 0.1.0+1

environment:
  # CI Flutter를 3.24.5→3.35로 상향해 Kiki 머신(Dart 3.11)과 정합 — 환경별 해석 드리프트
  # 제거(MOB-01·2026-07-17). 이 상향으로 구 pin 사유 ②(meta 1.15)·③(Dart 3.5)가 해소된다.
  # pubspec 하한은 ^3.5.0로 유지: 하한을 3.9로 올리면 build 4.x 전이 의존이 딸려와 freezed
  # 2.5.x(build ^2.3.1)와 build 충돌이 재발한다(코어 해석을 build 2.x/freezed 2.5.x 트랙에 고정).
  # 완전 pin 제거(generator 10.x·build 4.x)는 freezed 2→3 파괴적 마이그레이션 선행 — MOB-01 후속.
  sdk: ^3.5.0
  flutter: ^3.24.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 상태관리
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.4.0
  # 라우팅
  go_router: ^14.0.0
  # 모델·직렬화
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  # 네트워크
  dio: ^5.4.0
  retrofit: ^4.1.0
  # 보안
  flutter_secure_storage: ^9.2.0
  # localization — 앱 코드에서 직접 쓰지 않고 flutter_localizations가 전이 의존한다. SDK 버전이
  # 요구하는 intl을 그대로 따르도록 범위를 넓힌다(Flutter 3.24.x=0.19·최신=0.20.2 모두 해소).
  intl: ">=0.19.0 <0.21.0"
  # 미디어
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  video_player: ^2.8.0
  # 수식
  flutter_math_fork: ^0.7.2
  # 웹뷰 (Desmos·GeoGebra)
  webview_flutter: ^4.7.0
  # 음성 — 클라 TTS/STT는 *기능 착수 시* 재도입한다(현재 lib/test 사용처 0·선언만 있던 상태).
  # 제거 이유: speech_to_text 7.4.0은 자기 gradle에서 flutter.compileSdkVersion을 참조해
  # (Flutter 3.27+ 전용 주입) 고정판 3.24.5의 안드로이드 빌드를 치명 실패시키고, flutter_tts
  # 4.2.5는 compileSdk 36 하드코딩. 재도입 시 고정 Flutter와의 Gradle 호환을 실기기 빌드로 검증할 것.
  # 차트
  fl_chart: ^0.69.0
  # 푸시
  firebase_messaging: ^15.0.0
  firebase_core: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.4.0
  # ^9.1.0(→9.7.0) 유지 — freezed 2.5.x와 같은 build ^2.3.1 트랙 짝이라 함께 해소된다.
  # generator 10.x는 build ^4.0.0을 요구 → freezed 3.x(build 4.x) 파괴적 마이그레이션이 선행돼야
  # 함(모델 전수 abstract/sealed 수정·코드젠·실기기 검증). 그 이행은 MOB-01 후속 세션으로 이월.
  retrofit_generator: ^9.1.0
  mocktail: ^1.0.3
  golden_toolkit: ^0.15.0

# ── 버전 고정 (빌드 재현성 — pubspec.lock 미커밋 상태의 해석 드리프트 방어, MOB-01) ──
dependency_overrides:
  # retrofit 4.5.0 유지. CI Flutter 상향으로 구 pin 사유 ②(meta 1.15)·③(Dart 3.5)는 해소됐으나,
  # ①(generator 9.7.0이 retrofit 4.7.0+의 Parser.DartMappable를 비전수 switch로 처리 못 함)은
  # 여전히 유효 → retrofit<4.7.0가 필요하다. mobile CI 잡이 build_runner 코드젠을 실제 실행하므로
  # (analyze·test 앞) pin이 없으면 최신 retrofit(4.9.2)가 딸려와 코드젠이 깨진다. 완전 제거는
  # generator 10.x + freezed 3.x 이행 시(MOB-01 후속).
  retrofit: 4.5.0
  # image_picker_android: 0.8.13+18의 "Built-in Kotlin(AGP 9)" 이행이 현 AGP 8.3.2와 미검증이라
  # Kotlin DSL 도입 직전 버전으로 고정. Android 실기기 빌드는 CI 범위 밖이라 실기기 재빌드로만
  # 검증 가능 — 해제는 MOB-01 AGP 업그레이드 단계에서.
  image_picker_android: 0.8.12+23

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/animations/
    # 그래프 계산기 웹 번들(vendored·오프라인 WebView 임베드) — tool/sync_graphing_calculator.sh로 동기화.
    # Flutter 자산은 비재귀라 하위 디렉터리를 명시 등록한다(index.html·런타임 js·KaTeX 폰트).
    - assets/graphing_calculator/
    - assets/graphing_calculator/assets/
    - assets/graphing_calculator/mathlive/fonts/
    # MathLive 수식 입력기(vendored·오프라인 WebView 임베드) — 풀이 수식 입력(S1).
    # Flutter 자산은 비재귀라 하위 디렉터리(index.html·mathlive.min.js·KaTeX 폰트)를 명시 등록한다.
    - assets/mathlive_input/
    - assets/mathlive_input/fonts/
