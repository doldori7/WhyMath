<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>NCIC — 중학교 수학 수와 연산 (합성 픽스처)</title>
</head>
<body>
<header>
  <h1>중학교 수학</h1>
  <h2>(1) 수와 연산</h2>
  <p>핵심 아이디어: 수의 구조와 성질을 이해한다.</p>
</header>
<section>
  <ul>
    <li>
      <strong>[9수01-01]</strong>
      소인수분해의 뜻을 알고 자연수를 소인수분해할 수 있다.
      <span class="commentary">
        소인수분해는 유일하며, 모든 자연수에 적용된다.
      </span>
    </li>
    <li>
      <strong>[9수01-02]</strong>
      최대공약수와 최소공배수의 성질을 이해하고, 두 수의 최대공약수와 최소공배수를 구할 수 있다.
    </li>
    <li>
      <strong>[9수01-03]</strong>
      정수와 유리수의 개념을 이해하고, 정수와 유리수의 대소 관계를 판단할 수 있다.
    </li>
  </ul>
</section>
<footer>
  출처: 교육부 고시 제2022-33호 [수학과 교육과정]
</footer>
</body>
</html>
